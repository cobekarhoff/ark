<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs · Conversation · Ark hub prototype (hybrid 2)</title>
<!-- PROTOTYPE, throwaway. Hybrid 1 = metro map (project) + chat lane strip as replay scrubber, then trace + chat feed (run), one inspector.
     Project: Runs page with List | Conversation. Metro map (Master Chief trunk, one coloured line per run, question spurs, waiting hatching, person markers, trains),
     chat's density + lanes strip under it is the scrubber. Click a run line / badge / name to open the run.
     Run: Conversation tab. Trace (time axis + minimap, Master Chief, run lead, workers coloured by role) over the chat feed. Linked: trace tick <-> feed message,
     feed scroll -> trace cursor. Esc goes back.
     Data: data.js (window.COMMS_DATA). Message bodies are built with createElement/textContent only (no innerHTML of data).
     Review params: ?theme=dark|light|auto  ?run=<run id> (opens the run level) -->
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f6f4ef, #090b0f);
  --nav: light-dark(#fbfaf6, #0d1015);
  --panel: light-dark(#ffffff, #11141a);
  --panel-2: light-dark(#f8f6f0, #171b23);
  --panel-3: light-dark(#efece4, #1d222c);
  --line: light-dark(#e6e2d8, #222833);
  --line-2: light-dark(#d3cdbf, #2e3644);
  --line-3: light-dark(#8f887a, #6b7789);
  --text: light-dark(#1d1c1a, #dde2ea);
  --dim: light-dark(#4f4c45, #a0abba);
  --mute: light-dark(#65615a, #8591a2);
  --red: light-dark(#c2371f, #ff6b5e);
  --amber: light-dark(#c27a0e, #f2b04a);
  --green: light-dark(#2d8a57, #46c48a);
  --blue: light-dark(#2f62d8, #6aa6ff);
  --violet: light-dark(#7048c8, #a58bff);
  --red-t: light-dark(#b0301a, #ff9a90);
  --amber-t: light-dark(#85500a, #f5c26b);
  --green-t: light-dark(#23693f, #74d8a8);
  --blue-t: light-dark(#2553c7, #94bfff);
  --violet-t: light-dark(#6a3fc2, #c0acff);
  --red-bg: light-dark(#fbe9e5, #2a1311);
  --amber-bg: light-dark(#fbf0dc, #2a2010);
  --green-bg: light-dark(#e6f3ec, #10241a);
  --blue-bg: light-dark(#e6edfb, #121f38);
  --violet-bg: light-dark(#efe9fb, #1e1836);
  --sel: light-dark(#eaf0fd, #162136);
  --link: light-dark(#2553c7, #9cc3ff);
  --primary: light-dark(#1d1c1a, #2d6cdf);
  --primary-hover: light-dark(#34322e, #3470e4);
  --on-primary: #ffffff;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  /* prototype-only */
  --code-bg: light-dark(#f3f0e8, #0b0e13);
  --trunk: light-dark(#2b2a27, #c9d1de);
  --on-mark: light-dark(#ffffff, #0b0d12);
  --on-line: light-dark(#ffffff, #0b0d12);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { height: 100%; background: var(--bg); color: var(--text); scrollbar-color: var(--line-3) transparent; scrollbar-width: thin; }
body { height: 100%; margin: 0; display: flex; flex-direction: column; overflow: hidden; font: 13px/1.4 var(--sans); font-variant-numeric: tabular-nums; background: var(--bg); color: var(--text); }
::selection { background: color-mix(in srgb, var(--blue) 32%, transparent); }
* { scrollbar-color: var(--line-3) transparent; scrollbar-width: thin; }
a { color: var(--link); text-decoration: none; }
button, select, input { font: inherit; color: inherit; }
h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 650; text-wrap: balance; }
h2, h3, p { margin: 0; }
.mono { font-family: var(--mono); }
.mut { color: var(--mute); }
.dim { color: var(--dim); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }

/* ---------- nav (hub: Home / Runs / Roadmap) ---------- */
.top { flex: none; display: flex; align-items: center; gap: 4px; min-height: 45px; padding: 0 16px; background: var(--nav); border-bottom: 1px solid var(--line); }
.brand { margin-right: 18px; font-size: 14px; font-family: var(--mono); letter-spacing: -0.02em; }
.top nav { display: flex; gap: 2px; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; color: var(--dim); font-weight: 500; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--blue); border-radius: 2px; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--dim); }
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--panel-2); }
.seg button { background: none; border: 0; color: var(--dim); padding: 3px 9px; border-radius: 5px; cursor: pointer; transition: color 120ms var(--ease), background-color 120ms var(--ease), transform 120ms var(--ease); }
.seg button:active { transform: scale(0.97); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line-2); }
@media (hover: hover) and (pointer: fine) { .seg button[aria-pressed="false"]:hover { color: var(--text); } }
.proto { flex: none; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 16px; border-bottom: 1px dashed var(--line-2); background: var(--panel-2); font-size: 12px; color: var(--dim); }
.proto select { background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 6px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); font-weight: 500; cursor: pointer; white-space: nowrap; text-align: left; transition: background-color 120ms var(--ease), transform 120ms var(--ease); }
.btn:active, .icon-btn:active, .fchip:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn:disabled, .icon-btn:disabled { opacity: 0.45; cursor: default; }
@media (hover: hover) and (pointer: fine) { .btn:not(.primary):not(:disabled):hover { background: var(--panel-3); } .btn.primary:hover { background: var(--primary-hover); } .icon-btn:not(:disabled):hover { background: var(--panel-3); color: var(--text); } }
.icon-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); color: var(--dim); cursor: pointer; transition: background-color 120ms var(--ease), transform 120ms var(--ease), color 120ms var(--ease); }
.icon-btn.play { width: 34px; height: 34px; background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
@media (hover: hover) and (pointer: fine) { .icon-btn.play:not(:disabled):hover { background: var(--primary-hover); color: var(--on-primary); } }
.pill { display: inline-block; padding: 0 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); white-space: nowrap; }
.pill.ok { color: var(--green-t); background: var(--green-bg); border-color: var(--green); }
.pill.bad { color: var(--red-t); background: var(--red-bg); border-color: var(--red); }
.pill.warn { color: var(--amber-t); background: var(--amber-bg); border-color: var(--amber); }
.pill.build { color: var(--blue-t); background: var(--blue-bg); border-color: var(--blue); }
.pill.unk { color: var(--mute); border-style: dashed; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
kbd { font: 11px/1 var(--mono); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 5px; background: var(--panel-2); color: var(--dim); }
.badge { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--lc); color: var(--on-line); font: 700 11.5px/1 var(--sans); letter-spacing: 0; flex: none; }
.badge.sm { min-width: 20px; height: 20px; border-radius: 10px; font-size: 10.5px; padding: 0 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); flex: none; display: inline-block; }

/* ---------- page ---------- */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1680px; margin: 0 auto; padding: 12px 16px 14px; gap: 10px; }
.pagehead { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.pagehead .crumb { flex-basis: 100%; font-size: 12px; color: var(--dim); }
.pagehead .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.runtabs { flex-basis: 100%; display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 4px; }
.runtabs .tab { min-height: 34px; }
.runtabs .tab.stub { cursor: default; color: var(--mute); }
.runtabs .tab[aria-current="page"]::after { bottom: -1px; }
.conv { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 392px; gap: 12px; }
.mapcard { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.cardhead, .filterbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); min-height: 42px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
.crumbs button { background: none; border: 0; padding: 2px 4px; border-radius: 4px; color: var(--link); cursor: pointer; }
.crumbs .here { font-weight: 600; }
.crumbs .sep { color: var(--mute); }
.hint { margin-left: 8px; color: var(--mute); font-size: 12px; white-space: nowrap; }
.end { margin-left: auto; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 6px; border: 1px dashed var(--line-2); background: transparent; color: var(--mute); cursor: pointer; transition: background-color 120ms var(--ease), color 120ms var(--ease), transform 120ms var(--ease); white-space: nowrap; }
.fchip[aria-pressed="true"] { border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); }
.fchip .n { color: var(--mute); font-size: 12px; }
.fchip[aria-pressed="true"] .n { color: var(--dim); }
@media (hover: hover) and (pointer: fine) { .fchip:hover { background: var(--panel-3); color: var(--text); } }
.fsep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--line-2); }
.search { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; height: 28px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); color: var(--mute); min-width: 0; flex: 1 1 140px; max-width: 240px; }
.search input { border: 0; background: none; outline: 0; width: 100%; min-width: 0; color: var(--text); }
.search input::placeholder { color: var(--mute); }
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
details.menu { position: relative; }
details.menu > summary { list-style: none; cursor: pointer; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu .pop { position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: 240px; max-height: 340px; overflow: auto; padding: 6px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); box-shadow: 0 8px 28px rgb(0 0 0 / 0.28); transform-origin: top left; animation: pop-in 140ms var(--ease); }
@keyframes pop-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
.pop label { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
.pop label:hover { background: var(--panel-3); }
.pop .actions { display: flex; gap: 6px; padding: 4px 6px 6px; }
.count-line { color: var(--mute); font-size: 12px; white-space: nowrap; }

/* ---------- stage ---------- */
.stage { position: relative; flex: 1; min-height: 160px; overflow: auto; background: var(--panel); outline-offset: -2px; }
.stage > svg { display: block; }
.stage > svg.in { animation: scene-in 240ms var(--ease) both; }
.stage > svg.out { position: absolute; left: 0; top: 0; pointer-events: none; animation: scene-out 150ms var(--ease) forwards; }
@keyframes scene-in { from { opacity: 0; transform: scale(0.985); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes scene-out { to { opacity: 0; filter: blur(2px); } }
svg text { font-family: var(--sans); }
.t-lane { font-size: 12.5px; font-weight: 650; fill: var(--text); }
.t-sub { font-size: 11px; fill: var(--dim); }
.t-tick { font: 10.5px var(--mono); fill: var(--mute); }
.t-day { font: 600 10.5px var(--mono); fill: var(--dim); }
.t-st { font-size: 11px; fill: var(--dim); }
.t-bar { font-size: 11px; font-weight: 600; fill: var(--on-line); pointer-events: none; }
.t-out { font-size: 11px; font-weight: 600; fill: var(--text); }
.halo { paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.lane-sep { stroke: var(--line); stroke-width: 1; }
.rail { stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 2 5; }
.ruler-tick { stroke: var(--line-2); stroke-width: 1; }
.lane-hit { fill: transparent; cursor: pointer; }
.lane-label { cursor: pointer; }
.lane-label .lane-bg { fill: transparent; transition: fill 120ms var(--ease); }
@media (hover: hover) and (pointer: fine) { .lane-label:hover .lane-bg { fill: var(--panel-3); } }
.lane-label:focus-visible { outline: none; }
.lane-label:focus-visible .lane-bg { fill: var(--sel); stroke: var(--blue); stroke-width: 2; }
.zoom-hint { opacity: 0; transition: opacity 120ms var(--ease); }
.lane-label:hover .zoom-hint, .lane-label:focus-visible .zoom-hint { opacity: 1; }
.rule-line { fill: none; stroke: var(--lc); stroke-linejoin: round; stroke-linecap: butt; }
.rule-line.hit { stroke: transparent; stroke-width: 14; cursor: pointer; }
.trunk { stroke: var(--trunk); stroke-width: 8; stroke-linecap: round; }
.bs-line { stroke: var(--line-3); stroke-width: 2.5; stroke-dasharray: 5 4; stroke-linecap: round; }
.bar { fill: var(--lc); cursor: pointer; transition: opacity 120ms var(--ease); }
.bar.unknown { fill: color-mix(in srgb, var(--lc) 44%, var(--panel)); stroke: var(--lc); stroke-width: 1.6; }
.bar.pseudo { opacity: 0.6; }
.bar-cap { fill: var(--red); pointer-events: none; }
.bar.sel { stroke: var(--text); stroke-width: 2.5; }
@media (hover: hover) and (pointer: fine) { .bar:hover { opacity: 0.82; } }
.st circle.core, .st rect.core { fill: var(--panel); stroke: var(--lc); stroke-width: 2.6; transition: transform 120ms var(--ease); transform-box: fill-box; transform-origin: center; }
.st.bad circle.core { stroke: var(--red); }
.st .pip { pointer-events: none; }
.st { cursor: pointer; }
.st.sel .core { stroke: var(--text); }
@media (hover: hover) and (pointer: fine) { .st:hover .core { transform: scale(1.25); } }
.ix { fill: var(--panel); stroke: var(--trunk); stroke-width: 2.4; pointer-events: none; }
.ix.q { stroke-width: 3; }
.conn { fill: none; stroke: var(--lc); stroke-linecap: round; transition: opacity 160ms var(--ease), stroke-width 160ms var(--ease); }
.conn.soft { stroke-width: 1.4; opacity: 0.5; stroke-dasharray: 1 4; }
.conn.hard { stroke-width: 3; opacity: 0.95; stroke-dasharray: none; }
.conn.neutral { stroke: var(--line-3); }
.conn.sel { stroke-width: 3; opacity: 1; stroke-dasharray: none; stroke: var(--text); }
.chev { fill: none; stroke: var(--lc); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; pointer-events: none; }
.mk { cursor: pointer; --tc: var(--blue); }
.mk.ty-question { --tc: var(--amber); } .mk.ty-escalation { --tc: var(--red); } .mk.ty-worker_done { --tc: var(--green); } .mk.ty-status { --tc: var(--blue); }
.mk .shape { fill: var(--tc); stroke: var(--panel); stroke-width: 1.6; transform-box: fill-box; transform-origin: center; transition: transform 120ms var(--ease); }
.mk.unanswered .shape { fill: var(--panel); stroke: var(--tc); stroke-width: 2; }
.mk .glyph { fill: none; stroke: var(--on-mark); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.mk.unanswered .glyph { stroke: var(--tc); }
.mk .ring { fill: none; stroke: var(--text); stroke-width: 2; opacity: 0; transition: opacity 120ms var(--ease); }
.mk .hit { fill: transparent; }
.mk.sel .ring { opacity: 1; }
.mk.peer .ring { opacity: 1; stroke-dasharray: 3 2.5; }
.mk:focus-visible { outline: none; }
.mk:focus-visible .ring { opacity: 1; stroke: var(--blue); }
@media (hover: hover) and (pointer: fine) { .mk:hover .shape { transform: scale(1.3); } .mk:hover .ring { opacity: 0.55; } }
.off { opacity: 0.08; pointer-events: none; }
.tick { cursor: pointer; }
.tick rect { fill: var(--tc); }
.tick.ty-worker_done { --tc: var(--green); } .tick.ty-status { --tc: var(--blue); } .tick.ty-question { --tc: var(--amber); } .tick.ty-escalation { --tc: var(--red); }
.tick.sel rect { stroke: var(--text); stroke-width: 1.5; }
.tick.peer rect { stroke: var(--text); stroke-width: 1; stroke-dasharray: 2 1; }
@media (hover: hover) and (pointer: fine) { .tick:hover rect { opacity: 0.7; } }
.wait { fill: url(#hatch-wait); stroke: var(--amber); stroke-width: 1; rx: 2; cursor: pointer; }
.person { cursor: pointer; }
.person .face { fill: var(--panel); stroke: var(--text); stroke-width: 1.8; transition: transform 120ms var(--ease); transform-box: fill-box; transform-origin: center; }
.person .glyph { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-linecap: round; pointer-events: none; }
.person.problem .face { stroke: var(--red); stroke-width: 2.4; }
.person.sel .face { fill: var(--sel); stroke: var(--blue); stroke-width: 2.6; }
.person .stem { stroke: var(--text); stroke-width: 1.5; }
.person .n { font: 700 10.5px var(--sans); fill: var(--text); }
@media (hover: hover) and (pointer: fine) { .person:hover .face { transform: scale(1.12); } }
.cursor-line { stroke: var(--blue); stroke-width: 1.5; pointer-events: none; }
.cursor-tag rect { fill: var(--blue); }
.cursor-tag text { font: 600 10.5px var(--mono); fill: var(--on-primary); }
.veil { fill: var(--panel); opacity: 0.74; pointer-events: none; }
.train .body { fill: var(--lc); stroke: var(--panel); stroke-width: 2.5; }
.train .glow { fill: var(--lc); opacity: 0.28; }
.live-dot { fill: var(--lc); stroke: var(--panel); stroke-width: 2; }
.live-pulse { fill: none; stroke: var(--lc); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: live-ring 2.2s ease-out infinite; }
@keyframes live-ring { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(2.1); opacity: 0; } }
.travel .dot { fill: var(--tc); stroke: var(--panel); stroke-width: 2.5; filter: drop-shadow(0 1px 3px rgb(0 0 0 / 0.45)); }
.travel .trail { stroke: var(--tc); stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
.travel .ripple { fill: none; stroke: var(--tc); stroke-width: 2; }
.thread-link { fill: none; stroke: var(--violet); stroke-width: 2; stroke-dasharray: 5 4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.sel-ring { fill: none; stroke: var(--blue); stroke-width: 2; pointer-events: none; }

/* ---------- legend + player ---------- */
.legend { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel-2); font-size: 11.5px; color: var(--dim); }
.legend .it { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend svg { width: 26px; height: 16px; overflow: visible; flex: none; }
.legend .gap { flex-basis: 1px; width: 1px; height: 14px; background: var(--line-2); }
.player { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); }
.player .time { font: 12px var(--mono); color: var(--text); min-width: 142px; }
.player .time small { display: block; font-size: 10.5px; color: var(--mute); }
.scrub { position: relative; flex: 1; min-width: 120px; height: 34px; }
.scrub svg { position: absolute; inset: 0 0 auto 0; width: 100%; height: 14px; pointer-events: none; }
.scrub input[type=range] { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 18px; margin: 0; background: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
.scrub input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--panel-3); border: 1px solid var(--line-2); }
.scrub input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--blue); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--blue); transition: transform 120ms var(--ease); }
.scrub input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
.scrub input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--panel-3); border: 1px solid var(--line-2); }
.scrub input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); border: 2px solid var(--panel); }
.player .note { font-size: 11px; color: var(--mute); max-width: 150px; }
.tip { position: fixed; z-index: 300; width: max-content; max-width: 340px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); box-shadow: 0 8px 28px rgb(0 0 0 / 0.28); font-size: 12px; pointer-events: none; animation: tip-in 120ms var(--ease); }
.tip b { font-weight: 650; }
.tip .sub { color: var(--dim); display: block; }
@keyframes tip-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* ---------- inspector ---------- */
.inspector { min-height: 0; display: flex; flex-direction: column; }
.inspector > header { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-height: 42px; }
.inspector h2 { font-size: 13px; font-weight: 600; }
.insp-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.insp-title { font-size: 16px; line-height: 1.3; font-weight: 650; text-wrap: balance; }
.insp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--dim); }
.route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.route .arrow { color: var(--mute); }
.who { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--panel-2); text-align: left; cursor: pointer; transition: background-color 120ms var(--ease), transform 120ms var(--ease); }
.who:active { transform: scale(0.98); }
.who .k { font-size: 11px; color: var(--mute); }
.who .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { .who:hover { background: var(--panel-3); } }
.sect { display: flex; flex-direction: column; gap: 6px; }
.sect > h3 { font-size: 12px; font-weight: 600; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.sect > h3 .count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--panel-3); color: var(--dim); font-size: 12px; text-align: center; font-weight: 400; }
.list { display: flex; flex-direction: column; gap: 1px; max-height: 232px; overflow: auto; margin: 0 -4px; padding: 0 4px; }
.row { display: grid; grid-template-columns: 42px 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 30px; padding: 3px 6px; border: 0; border-radius: 6px; background: none; text-align: left; cursor: pointer; color: var(--dim); transition: background-color 100ms var(--ease); width: 100%; }
.row .time { font: 11px var(--mono); color: var(--mute); }
.row .main { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .main b { font-weight: 600; color: var(--text); margin-right: 6px; }
.row .end { font: 11px var(--mono); color: var(--mute); margin-left: 0; }
.row.cur { background: var(--sel); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 45%, transparent); color: var(--text); }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--panel-3); } }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }
.stat { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); }
.stat b { display: block; font-size: 15px; font-weight: 650; }
.stat span { font-size: 11px; color: var(--mute); }
.costbar { display: grid; grid-template-columns: minmax(0, 118px) 1fr 54px; align-items: center; gap: 8px; font-size: 12px; }
.costbar .track { height: 8px; border-radius: 4px; background: var(--panel-3); overflow: hidden; }
.costbar .track i { display: block; height: 100%; background: var(--lc); border-radius: 4px; }
.costbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.costbar .usd { text-align: right; font-family: var(--mono); font-size: 11.5px; }
.callout { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--dim); font-size: 12px; }
.callout.stub { border-style: dashed; color: var(--text); background: var(--violet-bg); border-color: var(--violet); }
.callout.warn { background: var(--amber-bg); border-color: var(--amber); color: var(--amber-t); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
.kv dt { color: var(--mute); } .kv dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11.5px; }
.actions { display: flex; flex-direction: column; gap: 6px; }
.empty { color: var(--mute); }

/* ---------- table (runs list) ---------- */
.runs-list { flex: 1; min-height: 0; overflow: auto; }
.runs-list table { width: 100%; border-collapse: collapse; }
.runs-list th, .runs-list td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.runs-list th { position: sticky; top: 0; background: var(--panel-2); color: var(--dim); font-weight: 600; font-size: 12px; }
.runs-list tr[tabindex] { cursor: pointer; }
.runs-list td.title { max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) and (pointer: fine) { .runs-list tbody tr:hover { background: var(--panel-3); } }
.runs-list tr:focus-visible { outline-offset: -2px; }

/* ---------- markdown (from hybrid-2) ---------- */
.md { font-size: 13.5px; line-height: 1.6; overflow-wrap: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md blockquote { max-width: 76ch; }
.md p { margin: 0 0 10px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.3; margin: 18px 0 6px; font-weight: 650; text-wrap: balance; }
.md h1 { font-size: 17px; } .md h2 { font-size: 15.5px; } .md h3 { font-size: 14px; }
.md h4, .md h5, .md h6 { font-size: 13px; color: var(--dim); }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md li + li { margin-top: 3px; }
.md li::marker { color: var(--mute); }
.md blockquote { margin: 0 0 10px; padding: 6px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; color: var(--dim); }
.md hr { border: 0; border-top: 1px solid var(--line-2); margin: 16px 0; }
.md a { color: var(--link); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent); text-underline-offset: 2px; }
.md strong { font-weight: 650; }
code.ic { font: 0.88em var(--mono); background: var(--panel-3); border: 1px solid var(--line); border-radius: 4px; padding: 0.5px 5px; overflow-wrap: anywhere; }
pre.code { margin: 4px 0 12px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--code-bg); overflow: auto; font: 12px/1.5 var(--mono); max-height: 260px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 8px; margin: 4px 0 12px; background: var(--panel); }
.md table { border-collapse: collapse; width: 100%; font-size: 12.5px; line-height: 1.45; }
.md th, .md td { padding: 5px 10px; min-width: 4.5em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.md th { background: var(--panel-2); color: var(--dim); font-weight: 600; white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.md td.nw { white-space: nowrap; }
.md td + td, .md th + th { border-left: 1px solid var(--line); }
.bodybox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); }

/* ======================================================================
   hybrid-1 additions: project strip, run page (trace + feed), shared bits
   ====================================================================== */
:root { --lw: 188px; }
.cursor-tag rect { fill: var(--primary); }
.hit { fill: transparent; stroke: none; }
.zoom-hint, .zoom-hint * { pointer-events: none; }
.rk-implementer { --rc: var(--blue); --rt: var(--blue-t); --rb: var(--blue-bg); }
.rk-validator { --rc: var(--green); --rt: var(--green-t); --rb: var(--green-bg); }
.rk-reviewer { --rc: var(--violet); --rt: var(--violet-t); --rb: var(--violet-bg); }
.rk-planning { --rc: var(--line-3); --rt: var(--dim); --rb: var(--panel-3); }
.t-status { --c: var(--blue); --ct: var(--blue-t); --cbg: var(--blue-bg); }
.t-question { --c: var(--amber); --ct: var(--amber-t); --cbg: var(--amber-bg); }
.t-escalation { --c: var(--red); --ct: var(--red-t); --cbg: var(--red-bg); }
.t-worker_done { --c: var(--green); --ct: var(--green-t); --cbg: var(--green-bg); }
.rswatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--rc); flex: none; }
.small { font-size: 12px; }
.row.static { cursor: default; }
.row-actions { flex-direction: row; padding: 4px 6px 6px; }
.page-enter { animation: page-in 220ms var(--ease) both; }
@keyframes page-in { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: none; } }

/* ---------- layout, both levels ---------- */
.pagehead .crumb { display: flex; align-items: center; }
.crumb a { color: var(--link); padding: 2px 0; }
.crumb a:hover { text-decoration: underline; text-underline-offset: 2px; }
.crumb .sep { margin: 0 7px; color: var(--mute); }
.crumb .here { color: var(--text); font-weight: 600; }
.crumb .hint { margin-left: auto; }
.pagehead h1 { font-size: 20px; }
.pagehead .title-line { max-width: 72ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.conv, .runwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 392px; gap: 12px; }
.leftcol { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.mapcard { flex: 1 1 0; }
.filterbar { flex-wrap: wrap; row-gap: 4px; }
.filterbar .end { margin-left: auto; }
.zoomlabel { min-width: 38px; text-align: center; font-size: 12px; }
.inspector { min-width: 0; }
.fchip.agent { border-style: solid; border-color: var(--blue); background: var(--blue-bg); color: var(--blue-t); }
.fchip.agent svg.i { width: 12px; height: 12px; }
.icon-btn.flat { border-color: transparent; background: none; width: 22px; height: 22px; }

/* ---------- replay controls (strip row at project level, player row at run level) ---------- */
.readout { font: 12px var(--mono); color: var(--text); min-width: 9.6em; white-space: nowrap; }
.count-now { color: var(--dim); white-space: nowrap; font-size: 12px; }
.ctl-note, .note { font-size: 11.5px; color: var(--mute); }
.strip-controls, .rplayer { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.strip-controls { min-height: 34px; min-width: 0; }
.strip-controls .scope { color: var(--mute); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rplayer { flex: none; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); min-height: 46px; }
.rplayer .scrub { flex: 1 1 160px; min-width: 100px; }
.scrub .ticks { position: absolute; inset: 0 0 auto 0; height: 14px; }
.scrub .ticks svg { width: 100%; height: 14px; }
.scrub.in-strip { flex: 1; }

/* ---------- project strip: density + lanes + scrubber ---------- */
.stripcard { flex: none; padding: 4px 12px 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; overflow: visible; }
.strip-body { position: relative; }
.sp-row { display: grid; grid-template-columns: 118px minmax(0, 1fr); align-items: center; }
.sp-label { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 8px 0 0; font-size: 11.5px; color: var(--dim); background: none; border: 0; text-align: left; height: 100%; border-radius: 4px; cursor: default; }
.sp-label span:not(.n) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-label .n { margin-left: auto; color: var(--mute); }
button.sp-label { cursor: pointer; }
@media (hover: hover) and (pointer: fine) { button.sp-label:hover { color: var(--text); } }
.sp-cell { position: relative; }
.sp-axis { height: 16px; }
.sp-axis .sp-cell span { position: absolute; top: 1px; transform: translateX(-50%); font-size: 10.5px; color: var(--mute); white-space: nowrap; }
.sp-axis .sp-cell i { position: absolute; bottom: 0; width: 1px; height: 3px; background: var(--line-3); }
.sp-density { height: 24px; }
.sp-density .sp-label { align-items: flex-end; padding-bottom: 2px; }
.sp-lane { margin-top: 1px; }
.sp-lane .sp-label { height: auto; font-size: 10px; line-height: 10px; }
.sp-lane.off { opacity: 0.35; }
.sp-row svg { display: block; overflow: visible; }
.bar-status { fill: var(--blue); } .bar-worker_done { fill: var(--green); } .bar-question { fill: var(--amber); } .bar-escalation { fill: var(--red); }
.lane-bg { fill: var(--panel-3); }
.span-run { fill: var(--lc); opacity: 0.28; }
.span-step { fill: var(--lc); opacity: 0.8; }
.sp-pip { width: 8px; height: 8px; border-radius: 50%; background: var(--lc); flex: none; }
.sp-lanes { max-height: 128px; overflow-y: auto; overflow-x: hidden; margin-top: 2px; scrollbar-width: none; }
.sp-lanes.scrolls { -webkit-mask-image: linear-gradient(#000 calc(100% - 14px), transparent); mask-image: linear-gradient(#000 calc(100% - 14px), transparent); }
.sp-human { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; display: grid; place-items: center; padding: 0; border: 1.5px solid var(--text); background: var(--panel); color: var(--text); z-index: 4; cursor: pointer; transition: transform 120ms var(--ease); }
.sp-human svg.i { width: 11px; height: 11px; stroke-width: 1.8; }
.sp-human .x { position: absolute; top: -7px; left: 10px; font: 650 9.5px/1 var(--mono); background: var(--text); color: var(--panel); border-radius: 6px; padding: 1px 3px; }
@media (hover: hover) and (pointer: fine) { .sp-human:hover { transform: scale(1.18); } }
.sp-ovl { position: absolute; top: 0; bottom: 0; left: 118px; right: 0; z-index: 3; cursor: ew-resize; touch-action: none; border-radius: 4px; }
.sp-ovl:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.sp-future { position: absolute; top: 0; bottom: 0; left: 118px; right: 0; overflow: hidden; pointer-events: none; z-index: 2; }
.sp-future i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: color-mix(in srgb, var(--panel) 66%, transparent); }
.sp-playhead { position: absolute; top: 0; bottom: 0; left: 118px; width: 0; z-index: 3; pointer-events: none; }
.sp-playhead i { position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--blue); border-radius: 1px; }
.sp-playhead b { position: absolute; top: -1px; left: -5px; width: 10px; height: 8px; background: var(--blue); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.sp-cursor { position: absolute; top: 0; bottom: 0; left: 118px; width: 0; z-index: 3; pointer-events: none; }
.sp-cursor i { position: absolute; top: 0; bottom: 0; left: 0; border-left: 1.5px dashed var(--primary); }
.sp-cursor b { position: absolute; top: 17px; left: 4px; padding: 0 5px; border-radius: 4px; font: 650 10.5px/15px var(--mono); background: var(--primary); color: var(--on-primary); white-space: nowrap; }
.sp-cursor.flip b { left: auto; right: 4px; }

/* ---------- run card ---------- */
.runcard { display: flex; flex-direction: column; min-height: 0; min-width: 0; --trace-h: 224px; }
.tr-mini-row, .tr-axis-row { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); flex: none; }
.tr-mini-row { border-bottom: 1px solid var(--line); background: var(--panel); }
.tr-mini-label { padding: 5px 12px; font-size: 11.5px; color: var(--dim); border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.tr-mini-label b { color: var(--text); font-weight: 600; font-size: 12px; }
.tr-mini-wrap { position: relative; height: 46px; }
.tr-mini { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.tr-mini .bg { fill: var(--panel); }
.tr-mini .hist rect { fill: var(--line-3); opacity: 0.55; }
.tr-mini .runline { stroke: var(--line-3); stroke-width: 2.5; stroke-linecap: round; }
.tr-mini .runline.open { stroke-dasharray: 1 4; }
.tr-mini .runline.act { stroke: var(--dim); }
.tr-mini .human { fill: var(--text); }
.tr-mini .shade { fill: var(--bg); opacity: 0.62; }
.tr-mini .brush { fill: color-mix(in srgb, var(--blue) 12%, transparent); stroke: var(--blue); stroke-width: 1.5; cursor: grab; }
.tr-mini .handle { fill: var(--blue); cursor: ew-resize; }
.tr-mini .cursor { stroke: var(--primary); stroke-width: 1.5; stroke-dasharray: 3 2; }
.tr-mini .cursor.play { stroke: var(--blue); stroke-dasharray: none; stroke-width: 2; }
.tr-mini text { fill: var(--mute); font-size: 10px; }
.tr-scroller { flex: none; height: var(--trace-h); overflow-x: hidden; overflow-y: auto; position: relative; }
.tr-axis-row { position: sticky; top: 0; z-index: 6; background: var(--panel); border-bottom: 1px solid var(--line-2); }
.tr-axis-label { padding: 0 4px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 2px; font-size: 11px; color: var(--dim); border-right: 1px solid var(--line); white-space: nowrap; }
.tr-axis-label > span { overflow: hidden; text-overflow: ellipsis; }
.tr-zoom { display: flex; flex: none; }
.tr-axis-wrap { position: relative; height: 28px; overflow: hidden; }
.tr-axis-wrap svg { position: absolute; inset: 0; }
.tr-axis text { fill: var(--dim); font-size: 11px; font-family: var(--mono); }
.tr-axis text.day { fill: var(--text); font-weight: 700; }
.tr-axis line { stroke: var(--line-2); }
.tr-axis .flag rect, .tr-axis .playflag rect { fill: var(--primary); }
.tr-axis .flag text, .tr-axis .playflag text { fill: var(--on-primary); font-weight: 600; }
.tr-axis .playflag rect { fill: var(--blue-t); }
.tr-axis .playflag text { fill: var(--panel); }
.tr-axis .hoverflag rect { fill: var(--panel-3); stroke: var(--line-3); }
.tr-axis .hoverflag text { fill: var(--text); }
.tr-lanes { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); position: relative; }
.tr-labels { position: relative; border-right: 1px solid var(--line); background: var(--panel); }
.tr-plot { position: relative; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; outline-offset: -2px; }
.tr-plot.dragging { cursor: grabbing; }
.tr-plot.over-hit { cursor: pointer; }
.tr-plot svg { display: block; position: absolute; left: 0; top: 0; }
.tr-lab { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.tr-lab.k-lead { border-top: 1px solid var(--line-2); }
.tr-lab.k-worker { background: var(--panel-2); padding-left: 30px; }
.tr-lab.k-group .main.grp { flex-direction: row; align-items: center; gap: 7px; font-weight: 600; }
.tr-lab.k-group { border-top: 1px solid var(--line); }
.tr-lab.k-group .name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-lab.k-group .role { margin-left: auto; font: 11px var(--mono); color: var(--dim); background: var(--panel-3); border-radius: 9px; padding: 0 6px; }
.tr-lab.k-group svg.i { width: 13px; height: 13px; color: var(--dim); transition: transform 160ms var(--ease); }
.tr-lab.k-group [aria-expanded="true"] svg.i { transform: rotate(90deg); }
.scale-tag { font-weight: 600; color: var(--dim); }
.scale-tag b { color: var(--text); }
.tr-lab.sel { background: var(--sel); }
.tr-lab .main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; height: 100%; color: inherit; }
.tr-lab .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
.tr-lab .l1 .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-lab .l2 { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-lab.k-worker .main { flex-direction: row; align-items: center; gap: 7px; }
.tr-lab.k-worker .name { font-weight: 500; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-lab.k-worker .role { margin-left: auto; font: 11px var(--mono); color: var(--mute); }
.pill.mini { font-size: 11px; padding: 0 6px; }
.g-grid line { stroke: var(--line); stroke-width: 1; }
.rowbg { fill: transparent; }
.rowbg.worker { fill: var(--panel-2); }
.rowbg.sel { fill: var(--sel); }
.rowsep { stroke: var(--line); }
.rowsep.strong { stroke: var(--line-2); }
.baseline { stroke: var(--line-2); stroke-width: 2; }
.tr-track { fill: var(--panel-3); }
.tr-activity { fill: color-mix(in srgb, var(--line-3) 55%, var(--panel)); stroke: var(--line-3); stroke-width: 1; }
.tr-gap { fill: color-mix(in srgb, var(--amber) 20%, transparent); }
.gap-label { fill: var(--amber-t); font-size: 10.5px; pointer-events: none; }

  if (kind === 'wait') { const m = messageById.get(id); return [`Waiting on you: ${duration(m.reply.t - m.t)}`, `${clock(m.t)} question → ${clock(m.reply.t)} reply`]; }
