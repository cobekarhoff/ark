        <section class="panel" id="panel-runs"><header><h2>Run progress</h2><span class="count">${DATA.runs.length}</span><span class="hint">step bar · round · time in step / median</span></header><div class="body">${progressRows()}</div></section>
        ${usagePanel()}
      </div>
    </div></div>`;
      }

      /* ---------- RUNS ---------- */
      function runCard(run) {
        const progress = DATA.progress[run.run];
        const stuck = stuckByRun.get(run.run);
        const review = reviewByRun.get(run.run);
        return `<a class="rcard ${run.phase}" href="#/runs/${run.run}" title="${escapeHtml(titleOfRun(run))}">${runRing(run)}
    <div class="rc-main"><div class="rc-top"><span class="mono">${run.ticket.id}</span>${roundLabel(progress)}<span class="eta" title="estimated time to merge-ready">ETA ${formatMinutes(progress.eta_minutes)}</span></div>
    <div class="rc-title ttl2">${escapeHtml(titleOfRun(run))}</div>
    <div class="rc-bot">${timerBar(progress)}</div>
    ${stuck ? `<div class="rc-line red">${icon("alert", 12)} ${stuck[0].kind === "waiting_on_prompt" ? "waiting on a prompt" : "idle"} ${formatMinutes(stuck[0].since_minutes)}</div>` : ""}
    ${review ? `<div class="rc-line ${review.ci === "passing" ? "" : "red"}">MR #${review.merge_order} in review · CI ${review.ci}</div>` : ""}
    ${run.phase === "escalation" ? '<div class="rc-line amber">escalation: waiting for you</div>' : ""}</div>
  </a>`;
      }
      function queuedBlockers(ticketId) {
        const declared = DATA.queued.find((entry) => entry.ticket === ticketId)?.blocked_by ?? [];
        return [...new Set([...declared, ...openDependencies(ticketId)])];
      }
      function blockerState(ticketId) {
        const run = activeRunByTicket.get(ticketId);
        if (run) return run.phase;
        return queuedTicketIds.includes(ticketId)
          ? "queued"
          : (ticketById.get(ticketId)?.status ?? "unknown");
      }
      function queuedCard(ticketId) {
        const ticket = ticketById.get(ticketId);
        const blockers = queuedBlockers(ticketId);
        return `<a class="rcard" href="#/backlog/${ticketId}" title="${escapeHtml(ticket?.title ?? "")}">${ticketRing(ticketId)}
    <div class="rc-main"><div class="rc-top"><span class="mono">${ticketId}</span></div><div class="rc-title ttl2">${escapeHtml(ticket?.title ?? "")}</div>
    <div class="rc-line ${blockers.length ? "" : "green"}">${blockers.length ? `waits on ${blockers.map((id) => `${id} (${blockerState(id)})`).join(", ")}` : "ready, waits for a free slot"}</div></div></a>`;
      }
      function simpleCard(ticketId, runId, lineHtml, ringHtml = ticketRing(ticketId)) {
        const ticket = ticketById.get(ticketId);
        return `<a class="rcard" href="#/runs/${runId}" title="${escapeHtml(ticket?.title ?? "")}">${ringHtml}
    <div class="rc-main"><div class="rc-top"><span class="mono">${ticketId}</span></div><div class="rc-title ttl2">${escapeHtml(ticket?.title ?? "no ticket record in this snapshot")}</div>
    <div class="rc-line">${lineHtml}</div></div></a>`;
      }
      function unblocksList() {
        const sources = [...DATA.runs.map((run) => run.ticket.id), ...queuedTicketIds];
        const entries = sources
          .map((ticketId) => ({
            ticketId,
            downstream: (dependantsById.get(ticketId) ?? []).filter(
              (id) => ticketById.get(id)?.status !== "done",
            ),
          }))
          .filter((entry) => entry.downstream.length);
        const rows = entries
          .map((entry) => {
            const run = activeRunByTicket.get(entry.ticketId);
            const progress = run && DATA.progress[run.run];
            const when = run
              ? run.phase === "escalation"
                ? `needs you · ETA ${formatMinutes(progress.eta_minutes)}`
                : `ETA ${formatMinutes(progress.eta_minutes)}`
              : "queued";
            return `<div class="ub"><div class="lead"><span class="dot ${run ? run.phase : "queued"}"></span><a class="mono link" href="${run ? `#/runs/${run.run}` : `#/backlog/${entry.ticketId}`}">${entry.ticketId}</a><span class="dim">${when}</span></div>
      <div class="to"><span class="mute" style="font-size:11px;padding-top:2px">unblocks</span>${entry.downstream.map(idChip).join("")}</div></div>`;
          })
          .join("");
        return `<aside class="unblocks"><h3>What finishing unblocks</h3>${rows || '<div class="empty">No queued ticket waits on a run.</div>'}</aside>`;
      }
      function renderRuns() {
        const closedLatest = closedRuns.slice(0, 5);
        const lanes = [
          {
            name: "Queued",
            dot: "queued",
            sub: "waiting for a slot",
            cards: queuedTicketIds.map(queuedCard),
          },
          {
            name: "Building",
            dot: "building",
            sub: "agents working",
            cards: DATA.runs.filter((run) => run.phase === "building").map(runCard),
          },
          {
            name: "Needs me",
            dot: "escalation",
            sub: "gate or escalation",
            cards: DATA.runs.filter((run) => run.phase === "escalation").map(runCard),
          },
          {
            name: "Awaiting merge",
            dot: "ready",
            sub: "MR in review queue",
            cards: DATA.review_queue
              .filter((item) => !runById.has(item.run))
              .map((item) =>
                simpleCard(
                  item.ticket,
                  item.run,
                  `<span class="${item.ci === "passing" ? "" : "red"}">MR #${item.merge_order} · CI ${item.ci} · waiting ${formatMinutes(item.waiting_minutes)}</span>`,
                  ticketRing(item.ticket),
                ),
              ),
          },
          {
            name: "Closed",
            dot: "closed",
            sub: `last 5 of ${closedRuns.length}`,
            cards: closedLatest.map((entry) =>
              simpleCard(
                entry.ticket,
                entry.run,
                `closed ${closedLabel(entry.run)} · ${money(entry.cost_usd)}`,
              ),
            ),
            foot: `<button class="btn" data-dag-only="old">${closedRuns.length - 5} older runs in graph</button>`,
          },
        ];
        const board = lanes
          .map(
            (
              lane,
            ) => `<section class="lane"><header><span class="dot ${lane.dot}"></span>${lane.name}<span class="count">${lane.cards.length}</span><span class="sub">${lane.sub}</span></header>
    <div class="lane-body">${lane.cards.join("") || '<div class="empty" style="padding:8px">none</div>'}</div>${lane.foot ? `<div class="lane-foot">${lane.foot}</div>` : ""}</section>`,
          )
          .join("");
        const filterButton = (key, label, count) =>
          `<button data-dag-filter="${key}" aria-pressed="${state.dagFilter.has(key)}">${label}<span class="n">${count}</span></button>`;
        return `<div class="runs-view">
    <div class="page-head"><h1>Runs</h1><span class="dim">${DATA.runs.length} active · ${DATA.queued.length} queued · ${closedRuns.length} closed. Click a run for its plan.</span></div>
    <div class="board">${board}</div>
    <section class="panel dag-panel"><header><h2>Cross-run dependency graph</h2>
      <div class="seg" role="group" aria-label="Filter runs">${filterButton("active", "Active", DATA.runs.length)}${filterButton("queued", "Queued", DATA.queued.length)}${filterButton("old", "Old", closedRuns.length)}</div>
      <div class="legend"><span><i class="dot building"></i>running</span><span><i class="dot escalation"></i>needs me</span><span><i class="dot queued"></i>queued</span><span><i class="ln amber"></i>still blocking</span><span><i class="ln solid"></i>satisfied</span></div></header>
      <div class="dag-body"><div class="dag-scroll" id="dag-host"></div>${unblocksList()}</div></section>
  </div>`;
      }
      function graphNode(ticketId, meta, title) {
        return `${ticketRing(ticketId, 38)}<div class="nb"><div class="n1"><b>${ticketId}</b><span class="meta">${meta}</span></div><div class="n2 ttl2">${escapeHtml(title)}</div></div>`;
      }
      function mountRunsDag() {
        const nodes = [];
        const seen = new Set();
        const push = (node) => {
          if (!seen.has(node.id)) {
            seen.add(node.id);
            nodes.push(node);
          }
        };
        if (state.dagFilter.has("active")) {
          DATA.runs.forEach((run) => {
            const progress = DATA.progress[run.run];
            push({
              id: run.ticket.id,
              className: run.phase === "escalation" ? "escalation" : "active",
              href: `#/runs/${run.run}`,
              title: titleOfRun(run),
              html: graphNode(
                run.ticket.id,
                `ETA ${formatMinutes(progress.eta_minutes)}`,
                titleOfRun(run),
              ),
            });
          });
        }
        if (state.dagFilter.has("queued")) {
          queuedTicketIds.forEach((ticketId) =>
            push({
              id: ticketId,
              className: "queued",
              href: `#/backlog/${ticketId}`,
              title: ticketById.get(ticketId)?.title,
              html: graphNode(
                ticketId,
                queuedBlockers(ticketId).length ? "blocked" : "ready",
                ticketById.get(ticketId)?.title ?? "",
              ),
            }),
          );
        }
        if (state.dagFilter.has("old")) {
          closedRuns.forEach((entry) => {
            const ticket = ticketById.get(entry.ticket);
            push({
              id: entry.ticket,
              className: "old compact",
              href: `#/runs/${entry.run}`,
              title: ticket?.title ?? `${entry.ticket}, no ticket record in this snapshot`,
              width: 176,
              height: 28,
              html: `<span class="ck">${icon("check", 13)}</span><b>${entry.ticket}</b><span class="meta">${closedLabel(entry.run)} · ${money(entry.cost_usd)}</span>`,
            });
          });
        }
        const edges = [];
        nodes.forEach((node) =>
          (ticketById.get(node.id)?.depends_on ?? []).forEach((dependencyId) =>
            edges.push([dependencyId, node.id]),
          ),
        );
        const closedIds = new Set(closedRuns.map((entry) => entry.ticket));
        mountDag(document.getElementById("dag-host"), {
          nodes,
          edges,
          nodeWidth: 300,
          nodeHeight: 56,
          gapX: 90,
          gapY: 10,
          edgeTone: (from) =>
            closedIds.has(from) || ticketById.get(from)?.status === "done" ? "dim" : "amber",
        });
      }

      /* ---------- RUN DETAIL ---------- */
      const defaultStepId = (steps) =>
        (
          steps.find((step) => step.status === "running") ??
          steps.find((step) => step.status !== "succeeded") ??
          steps[0]
        )?.id;
      const stuckStepOf = (run, stuckEntries) =>
        run.plan.find(
          (step) =>
            step.status === "running" && stuckEntries.some((entry) => entry.role === step.role),
        )?.id;
      function planSvg(run, selectedId, stuckId) {
        const width = 340,
          height = 52,
          pad = 4;
        const edges = reduceEdges(
          run.plan.flatMap((step) => step.needs.map((need) => [need, step.id])),
        );
        const layout = layeredLayout({
          items: run.plan.map((step) => ({ id: step.id, w: width, h: height })),
          edges,
          direction: "tb",
          gapMain: 26,
          gapCross: 16,
          center: true,
        });
        const glyph = (status, x, y) =>
          status === "succeeded"
            ? `<circle class="gl-done" cx="${x}" cy="${y}" r="9"/><path class="gl-tick" d="m${x - 4} ${y + 0.5} 3 3 5-6"/>`
            : status === "running"
              ? `<circle class="gl-run-track" cx="${x}" cy="${y}" r="8"/><path class="gl-run" d="M${x} ${y - 8}A8 8 0 0 1 ${x + 8} ${y}"/>`
              : `<circle class="gl-todo" cx="${x}" cy="${y}" r="8"/>`;
        const stuckGlyph = (x, y) =>
          `<circle class="gl-stuck" cx="${x}" cy="${y}" r="9"/><path class="gl-stuck-p" d="M${x - 2.5} ${y - 3.5}v7M${x + 2.5} ${y - 3.5}v7"/>`;
        const paths = edges
          .map(([from, to]) => {
            const a = layout.positions.get(from),
              b = layout.positions.get(to);
            const x1 = a.x + width / 2 + pad,
              y1 = a.y + height + pad,
              x2 = b.x + width / 2 + pad,
              y2 = b.y + pad - 3,
              handle = (y2 - y1) / 2;
            return `<path class="e" d="M${x1} ${y1}C${x1} ${y1 + handle} ${x2} ${y2 - handle} ${x2} ${y2}" marker-end="url(#plan-arrow)"/>`;
          })
          .join("");
        const steps = run.plan
          .map((step) => {
            const point = layout.positions.get(step.id);
            const x = point.x + pad,
              y = point.y + pad;
            const cost = step.cost_usd == null ? "" : money(step.cost_usd);
            const clock =
              step.status === "running" && step.started_at
                ? formatMinutes(minutesSince(step.started_at))
                : "";
            return `<g class="step s-${step.status} ${step.id === selectedId ? "picked" : ""} ${step.id === stuckId ? "stuckstep" : ""}" data-step="${escapeHtml(step.id)}" role="button" tabindex="0" aria-label="${escapeHtml(step.id)}, ${step.role}, ${step.status}">
      <title>${escapeHtml(step.id)}</title><rect class="bx" x="${x}" y="${y}" width="${width}" height="${height}" rx="9"/>${step.id === stuckId ? stuckGlyph(x + 24, y + height / 2) : glyph(step.status, x + 24, y + height / 2)}
      <text class="role" x="${x + 44}" y="${y + 20}">${step.role}${step.status === "pending" ? " · waiting" : step.status === "running" ? " · running" : ""}</text>
      <text class="sid" x="${x + 44}" y="${y + 37}">${escapeHtml(step.id.length > 30 ? step.id.slice(0, 29) + "…" : step.id)}</text>
      <text class="meta" x="${x + width - 12}" y="${y + 20}">${clock}</text><text class="meta" x="${x + width - 12}" y="${y + 37}">${cost}</text>
</g>`;
          })
          .join("");
        const svgWidth = layout.width + pad * 2,
          svgHeight = layout.height + pad * 2;
        return `<svg class="plan-svg" viewBox="0 0 ${svgWidth} ${svgHeight}" width="${svgWidth}" height="${svgHeight}" role="group" aria-label="Step plan"><defs><marker id="plan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M1 1.5 9 5 1 8.5z"/></marker></defs>${paths}${steps}</svg>`;
      }
      function stepDetail(run, selectedId, progress) {
        const step = run.plan.find((entry) => entry.id === selectedId);
        if (!step) return "";
        const stateText =
          {
            succeeded: "done",
            running: step.started_at
              ? `running ${formatMinutes(minutesSince(step.started_at))}${progress ? ` of ~${progress.median_step_minutes}m median` : ""}`
              : "running",
            pending: "waiting for its prerequisites",
          }[step.status] ?? step.status;
        return `<div class="stepdetail"><span class="sd-title">${escapeHtml(step.id)}</span>${step.status === "running" ? orcaButton(`${step.id} worker`, "Open in Orca") : ""}
    <span class="sd-meta">${step.role} · ${escapeHtml(step.harness)} · ${escapeHtml(shortModel(step.model))} · ${stateText}${step.cost_usd ? ` · ${money(step.cost_usd)}` : ""}<br>${step.needs.length ? `after ${step.needs.map(escapeHtml).join(", ")}` : "no prerequisites"}</span></div>`;
      }
      function planBody(runId) {
        const run = runById.get(runId);
        const selectedId = state.selectedStepByRun.get(runId) ?? defaultStepId(run.plan);
        return (
          planSvg(run, selectedId, stuckStepOf(run, stuckByRun.get(runId) ?? [])) +
          stepDetail(run, selectedId, DATA.progress[runId])
        );
      }
      function runStrip(run, progress, cost) {
        if (!run)
          return `<div class="strip" style="--cols:2"><div><span class="k">Cost</span><span class="v">${money(cost)}</span></div><div><span class="k">Plan</span><span class="v"><small>not kept for closed runs</small></span></div></div>`;
        const counts = stepCounts(run);
        const ratio = progress.current_step_minutes / progress.median_step_minutes;
        const level = ratio > 1.3 ? "red" : ratio > 1 ? "amber" : "";
        const budget = Array.from(
          { length: progress.round_budget },
          (_, index) =>
            `<i class="${index < progress.round ? (progress.round >= progress.round_budget ? "last" : "used") : ""}"></i>`,
        ).join("");
        return `<div class="strip" style="--cols:6">
    <div class="lead">${runRing(run, 46)}<span><span class="k">Steps</span><br><span class="v">${counts.done} of ${counts.total}</span></span></div>
    <div><span class="k">Round</span><span class="v">${progress.round}<small> of ${progress.round_budget}</small><span class="budget" title="${progress.round >= progress.round_budget ? "last round" : "rounds used"}">${budget}</span></span></div>
    <div><span class="k">Time in step vs median</span><span class="stepbar ${level}"><i style="width:${Math.min(ratio / 2, 1) * 100}%"></i><u></u></span><span class="v">${progress.current_step_minutes}m <small>/ ${progress.median_step_minutes}m median${ratio > 1 ? `, +${progress.current_step_minutes - progress.median_step_minutes}m over` : ""}</small></span></div>
    <div><span class="k">ETA to merge-ready</span><span class="v">${formatMinutes(progress.eta_minutes)}</span></div>
    <div><span class="k">Cost so far</span><span class="v">${money(cost)}</span></div>
    <div><span class="k">Started</span><span class="v">${formatMinutes(minutesSince(run.started_at))}<small> ago</small></span></div></div>`;
      }
      function renderRunDetail(runId) {
        const liveRun = runById.get(runId);
        const closedEntry = DATA.ticket_runs.find((entry) => entry.run === runId);
        if (!liveRun && !closedEntry)
          return `<div class="page-scroll"><div class="detail"><a class="back" href="#/runs">${icon("back", 14)}Runs</a><div class="empty">No run ${escapeHtml(runId)}.</div></div></div>`;
        const ticketId = liveRun ? liveRun.ticket.id : closedEntry.ticket;
        const ticket = ticketById.get(ticketId);
        const title = liveRun
          ? titleOfRun(liveRun)
          : (ticket?.title ?? "No ticket record in this snapshot");
        const phase = liveRun ? liveRun.phase : "closed";
        const progress = DATA.progress[runId];
        const cost = liveRun ? liveRun.cost_usd : closedEntry.cost_usd;
        const gate = DATA.gates.find((entry) => entry.run === runId);
        const stuckEntries = stuckByRun.get(runId) ?? [];
        const review = reviewByRun.get(runId);
        const agents = (liveRun?.agents ?? [])
          .filter((agent) => agent.role !== "Master Chief")
          .map((agent) => {
            const terminal =
              stuckEntries.find((entry) => entry.role === agent.role)?.terminal ??
              `${agent.role} of ${runId}`;
            return `<div class="agent"><span class="dot ${agent.step ? "running" : "ready"}"></span><div class="who"><b>${escapeHtml(agent.role)}${agent.step ? ` · ${escapeHtml(agent.step)}` : ""}</b><span>${escapeHtml(agent.harness ?? agent.planned.harness)} · ${escapeHtml(shortModel(agent.model ?? agent.planned.model))}</span></div>
      <button class="btn" data-toast="Would open ${escapeHtml(terminal)} in Orca (prototype)">${icon("terminal")}Open in Orca</button></div>`;
          })
          .join("");
        const criteriaCount = ticket?.body.criteria.length ?? 0;
        const dependencyCount = ticket?.depends_on.length ?? 0;
        const dependantCount = (dependantsById.get(ticketId) ?? []).length;
        const planPanel = liveRun
          ? `<section class="panel"><header><h2>Plan</h2><span class="count">${liveRun.plan.length} steps</span><span class="hint">click a step for detail</span></header><div class="plan-body" id="plan-body">${planBody(runId)}</div></section>`
          : `<section class="panel"><header><h2>Plan</h2></header><div class="empty">This run is closed and the snapshot keeps no plan for it. Its cost, ticket and merge request are on the right.</div></section>`;
        const mergePanel = `<section class="panel"><header><h2>Merge request</h2>${review ? `<span class="chip ${reviewBlockers(review).length ? "red" : "green"}" style="margin-left:auto">${reviewBlockers(review).length ? "Blocked" : "Ready to merge"} · #${review.merge_order} in merge order</span>` : ""}</header>${
          review
            ? `<div class="item">${reviewEvidence(review, true)}<div class="actions"><button class="btn primary" data-toast="Would open ${escapeHtml(review.url)} (prototype)">${icon("ext")}Open PR #${review.url.split("/").pop()}</button><a class="btn ghost" href="#/">In review queue</a></div></div>`
            : `<div class="empty">${liveRun ? "No merge request yet. It opens after the review step passes." : "No open merge request for this run."}</div>`
        }</section>`;
        return `<div class="page-scroll"><div class="detail enter">
    <div><a class="back" href="${backHref()}" style="margin-bottom:10px">${icon("back", 14)}${backLabel()}</a>
      <div class="d-title">${phaseChip(phase)}<h1><span class="mono">${ticketId}</span>${escapeHtml(title)}</h1>
        ${ticket ? `<a class="btn" href="#/backlog/${ticketId}" style="margin-left:auto">Read ticket${icon("chevron", 12)}</a>` : ""}</div>
      <div class="mute mono" style="margin-top:6px;font-size:11.5px">${runId}</div></div>
    ${runStrip(liveRun, progress, cost)}
    <div class="d-grid">
      <div class="d-left">${planPanel}</div>
      <div class="d-right">
        ${gate ? `<section class="panel warn"><header><h2>Needs me · ${escapeHtml(gate.kind)}</h2><span class="age hot" style="margin-left:auto">${formatMinutes(minutesSince(gate.since))}</span></header><div class="alertbox"><p class="gate-q" style="-webkit-line-clamp:5">${escapeHtml(gate.question)}</p><div class="actions">${orcaButton("the run lead terminal", "Answer in Orca")}</div></div></section>` : ""}
        ${stuckEntries.map((entry) => `<section class="panel warn"><header><h2>Stuck · ${escapeHtml(entry.role)}</h2><span class="age hot" style="margin-left:auto">${formatMinutes(entry.since_minutes)}</span></header><div class="alertbox"><pre class="term">${escapeHtml(entry.last_line)}<span class="caret"></span></pre><div class="actions">${orcaButton(entry.terminal)}</div></div></section>`).join("")}
        ${liveRun ? `<section class="panel"><header><h2>Agents</h2><span class="count">${liveRun.agents.filter((agent) => agent.role !== "Master Chief").length}</span><span class="hint">run lead and workers</span></header><div class="body">${agents}</div></section>` : ""}
        ${mergePanel}
        ${ticket ? `<section class="panel"><header><h2>Ticket</h2><span class="mono dim">${ticketId}</span></header><div class="ticket-link"><div class="t">${escapeHtml(ticket.title)}</div><div class="dim">${criteriaCount} acceptance criteria · depends on ${dependencyCount} · unblocks ${dependantCount}</div><div class="actions"><a class="btn" href="#/backlog/${ticketId}">Read ticket and dependency graph${icon("chevron", 12)}</a></div></div></section>` : ""}
      </div>
    </div></div></div>`;
      }

      /* ---------- BACKLOG ---------- */
      function backlogGroups() {
        const query = state.backlogQuery.trim().toLowerCase();
        const visible = DATA.tickets.filter(
          (ticket) =>
            (state.backlogShowDone || ticket.status !== "done") &&
            (!query || `${ticket.id} ${ticket.title}`.toLowerCase().includes(query)),
        );
        const sorter = (a, b) =>
          (openDependencies(a.id).length ? 1 : 0) - (openDependencies(b.id).length ? 1 : 0) ||
          ticketNumber(a.id) - ticketNumber(b.id);
        const groupDefinitions =
          state.backlogGroup === "milestone"
            ? [...new Set(DATA.tickets.map((ticket) => ticket.milestone))]
                .sort()
                .map((milestone) => ({
                  name: milestone,
                  note: "",
                  match: (ticket) => ticket.milestone === milestone,
                }))
            : state.backlogGroup === "flat"
              ? [{ name: "", note: "", match: () => true }]
              : [
                  {
                    name: "In a run",
                    note: "an agent is on it right now",
                    match: (ticket) => activeRunByTicket.has(ticket.id),
                  },
                  {
                    name: "In progress",
                    note: "started by hand",
                    match: (ticket) =>
                      ticket.status === "in_progress" && !activeRunByTicket.has(ticket.id),
                  },
                  {
                    name: "Ready",
                    note: "unblocked tickets first",
                    match: (ticket) =>
                      ticket.status === "ready" && !activeRunByTicket.has(ticket.id),
                  },
                  {
                    name: "Proposed",
                    note: "not approved yet",
                    match: (ticket) => ticket.status === "proposed",
                  },
                  { name: "Done", note: "", match: (ticket) => ticket.status === "done" },
                ];
        const claimed = new Set();
        return groupDefinitions
          .map((definition) => {
            const tickets = visible
              .filter((ticket) => !claimed.has(ticket.id) && definition.match(ticket))
              .sort(sorter);
            tickets.forEach((ticket) => claimed.add(ticket.id));
            return { ...definition, tickets };
          })
          .filter((group) => group.tickets.length);
      }
      function backlogRow(ticket, selectedId) {
        const run = activeRunByTicket.get(ticket.id);
        const progress = run && DATA.progress[run.run];
        const blockers = openDependencies(ticket.id);
        const dependants = dependantsById.get(ticket.id) ?? [];
        return `<a class="row ${ticket.status === "done" ? "done" : ""} ${ticket.id === selectedId ? "sel" : ""}" href="#/backlog/${ticket.id}" data-ticket="${ticket.id}" ${ticket.id === selectedId ? 'aria-current="true"' : ""}>
    <span class="id">${ticket.id}</span><span class="title" title="${escapeHtml(ticket.title)}">${escapeHtml(ticket.title)}</span><span>${statusChip(ticket.status)}</span><span class="mono dim">${ticket.milestone}</span>
    <span class="deps c-deps">${ticket.depends_on.length ? ticket.depends_on.map((id) => `<span class="idchip ${blockers.includes(id) ? "open" : ticketById.has(id) ? "" : "ghost"}" title="${blockers.includes(id) ? "blocking" : ticketById.has(id) ? "done" : "not in snapshot"}">${id.replace("ARK-", "")}</span>`).join("") : '<span class="mute">none</span>'}</span>
    <span class="num c-down">${dependants.length || ""}</span><span class="num c-ac">${ticket.body.criteria.length || ""}</span>
    <span class="c-run">${run ? `<span class="chip ${run.phase === "escalation" ? "amber" : "blue"}">${run.phase === "escalation" ? "needs me" : "building"} ${formatMinutes(progress.eta_minutes)}</span>` : blockers.length ? '<span class="chip amber">blocked</span>' : ""}</span></a>`;
      }
      function renderBacklogRows(selectedId) {
        const groups = backlogGroups();
        if (!groups.length)
          return '<div class="empty">No ticket matches. Clear the search or show done tickets.</div>';
        return (
          `<div class="row head" role="presentation"><span>ID</span><span>Title</span><span>Status</span><span>M</span><span class="c-deps">Depends on</span><span class="c-down num" title="tickets that wait on this one">Unblocks</span><span class="c-ac num">ACs</span><span class="c-run">Run</span></div>` +
          groups
            .map(
              (group) =>
                `${group.name ? `<div class="row group" style="top:28px"><span>${group.name}</span><span class="count">${group.tickets.length}</span><span class="gnote">${group.note}</span></div>` : ""}${group.tickets.map((ticket) => backlogRow(ticket, selectedId)).join("")}`,
            )
            .join("")
        );
      }
      function renderBacklog(selectedId) {
        const total = DATA.tickets.length;
        const doneCount = DATA.tickets.filter((ticket) => ticket.status === "done").length;
        const blockedCount = DATA.tickets.filter(
          (ticket) => ticket.status !== "done" && openDependencies(ticket.id).length,
        ).length;
        const groupButton = (key, label) =>
          `<button data-bl-group="${key}" aria-pressed="${state.backlogGroup === key}">${label}</button>`;
        return `<div class="bl" id="bl"><div class="bl-main">
    <div class="page-head"><h1>Backlog</h1><span class="dim">Done tickets are hidden. <span class="mute">j / k to move, Enter to read, / to search</span></span></div>
    <div class="toolbar"><label class="search">${icon("search")}<input id="bl-search" type="search" placeholder="Search id or title" value="${escapeHtml(state.backlogQuery)}" aria-label="Search tickets"></label>
      <div class="seg" role="group" aria-label="Group by">${groupButton("status", "Status")}${groupButton("milestone", "Milestone")}${groupButton("flat", "Flat")}</div>
      <label><input type="checkbox" id="bl-done" ${state.backlogShowDone ? "checked" : ""}>Show done (${doneCount})</label>
      <span class="summary">${total - doneCount} open · ${blockedCount} blocked by an unfinished dependency · ${DATA.runs.length} in a run</span></div>
    <div class="tbl" id="bl-table">${renderBacklogRows(selectedId)}</div></div></div>`;
      }
      function ticketGraph(ticketId) {
        const ancestors = new Set();
        const collectAncestors = (id) =>
          (ticketById.get(id)?.depends_on ?? []).forEach((dependencyId) => {
            if (!ancestors.has(dependencyId)) {
              ancestors.add(dependencyId);
              collectAncestors(dependencyId);
            }
          });
        const descendants = new Set();
        const collectDescendants = (id) =>
          (dependantsById.get(id) ?? []).forEach((dependantId) => {
            if (!descendants.has(dependantId)) {
              descendants.add(dependantId);
              collectDescendants(dependantId);
            }
          });
        collectAncestors(ticketId);
        collectDescendants(ticketId);
        const included = [...ancestors, ticketId, ...descendants];
        const includedSet = new Set(included);
        const nodes = included.map((id) => {
          const ticket = ticketById.get(id);
          const run = activeRunByTicket.get(id);
          return {
            id,
            className: `tnode ${id === ticketId ? "focus" : ""} ${ticket ? "" : "ghost"} ${ticket?.status === "done" ? "old" : ""}`,
            href: ticket && id !== ticketId ? `#/backlog/${id}` : null,
            title: ticket?.title ?? "Not in this backlog snapshot",
            html: `${ticketRing(id, 32)}<div class="nb"><div class="n1"><b>${id}</b></div><div class="n2">${ticket ? (run ? run.phase : ticket.status === "done" ? "done" : openDependencies(id).length ? "blocked" : ticket.status.replace("_", " ")) : "not in snapshot"}</div></div>`,
          };
        });
        const edges = included.flatMap((id) =>
          (ticketById.get(id)?.depends_on ?? [])
            .filter((dependencyId) => includedSet.has(dependencyId))
            .map((dependencyId) => [dependencyId, id]),
        );
        return { nodes, edges, hasEdges: edges.length > 0 };
      }
      /* ---------- TICKET READER (variant B) ---------- */
      function linkItem(id) {
        const ticket = ticketById.get(id);
        const run = activeRunByTicket.get(id);
        const chip = !ticket
          ? '<span class="chip outline">not in snapshot</span>'
          : run
            ? phaseChip(run.phase)
            : ticket.status !== "done" && openDependencies(id).length
              ? '<span class="chip amber">blocked</span>'
              : statusChip(ticket.status);
        const blocked =
          ticket && !run && ticket.status !== "done" && openDependencies(id).length > 0;
        const inner = `<span class="dot ${run ? run.phase : blocked ? "waiting" : (ticket?.status ?? "ghost")}"></span><span class="t"><b>${id}</b>${escapeHtml(ticket?.title ?? "Not in this backlog snapshot")}</span>${chip}`;
        return `<li>${ticket ? `<a href="#/backlog/${id}" title="${escapeHtml(ticket.title)}">${inner}</a>` : `<a style="pointer-events:none">${inner}</a>`}</li>`;
      }
      function renderReader(ticketId) {
        const ticket = ticketById.get(ticketId);
        const back = `<a class="back" href="${backHref()}">${icon("back", 14)}${backLabel()}</a>`;
        if (!ticket)
          return `<div class="page-scroll"><div class="reader-page enter">${back}<div class="prose"><p class="note">${escapeHtml(ticketId)} is not in this backlog snapshot.</p></div></div></div>`;
        const run = activeRunByTicket.get(ticketId);
        const dependants = dependantsById.get(ticketId) ?? [];
        const { problem, change, criteria } = ticket.body;
        const body =
          problem || change || criteria.length
            ? `${problem ? `<h2>Problem</h2>${renderRichText(problem)}` : ""}${change ? `<h2>Change</h2>${renderRichText(change)}` : ""}${criteria.length ? `<h2>Acceptance criteria · ${criteria.length}</h2><ol class="crit">${criteria.map((criterion) => `<li><span class="acid">${criterion.id.replace(/^.*-(AC\d+)$/, "$1")}</span><p>${renderInline(criterion.text)}</p></li>`).join("")}</ol>` : ""}`
            : '<p class="note" style="margin-top:30px">This ticket has no written problem, change or criteria yet. Only its title and dependencies exist.</p>';
        return `<div class="page-scroll"><div class="reader-page">${back}
    <div class="reader">
      <article class="prose enter">
        <div class="head-meta"><span class="tid">${ticket.id}</span>${run ? phaseChip(run.phase) : statusChip(ticket.status)}<span class="chip outline">${ticket.milestone}</span></div>
        <h1>${escapeHtml(ticket.title)}</h1>
        ${run ? `<div class="head-actions"><a class="btn primary" href="#/runs/${run.run}">Open run</a>${orcaButton(`${ticket.id} run lead`, "Open in Orca", "")}</div>` : ""}
        <div>${body}</div>
      </article>
      <aside class="reader-aside enter" aria-label="Dependencies">
        <section class="side-card"><h4>Dependency graph</h4><div class="dagbox" id="ticket-graph"></div></section>
        <section class="side-card"><h4>Depends on · ${ticket.depends_on.length}</h4>${ticket.depends_on.length ? `<ul class="linklist">${ticket.depends_on.map(linkItem).join("")}</ul>` : '<p class="empty">Nothing. It can start any time.</p>'}</section>
        <section class="side-card"><h4>Unblocks · ${dependants.length}</h4>${dependants.length ? `<ul class="linklist">${dependants.map(linkItem).join("")}</ul>` : '<p class="empty">Nothing waits on this ticket.</p>'}</section>
      </aside>
    </div></div></div>`;
      }
      function mountTicketGraph(ticketId) {
        const host = document.getElementById("ticket-graph");
        if (!host) return;
        const graph = ticketGraph(ticketId);
        if (!graph.hasEdges) {
          host.innerHTML =
            '<p class="empty">No dependencies and no dependants. This ticket stands alone.</p>';
          return;
        }
        mountDag(host, {
          nodes: graph.nodes,
          edges: graph.edges,
          nodeWidth: 164,
          nodeHeight: 48,
          gapX: 12,
          gapY: 34,
          direction: "down",
          edgeTone: (from) =>
            ticketById.get(from)?.status === "done" || !ticketById.has(from) ? "dim" : "amber",
        });
      }

      /* ---------- shell and routing ---------- */
      const isDetailHash = (hash) => /^#\/(runs|backlog)\/[^/]+/.test(hash);
      const isReaderHash = (hash) => /^#\/backlog\/[^/]+/.test(hash);
      const backHref = () =>
        state.origins.get(location.hash) ?? (isReaderHash(location.hash) ? "#/backlog" : "#/runs");
      function backLabel() {
        const target = backHref();
        const run = /^#\/runs\/(.+)/.exec(target);
        if (run) return `Run ${runById.get(decodeURIComponent(run[1]))?.ticket.id ?? ""}`.trim();
        return target === "#/runs" ? "Runs" : target.startsWith("#/backlog") ? "Backlog" : "Home";
      }
      function applyTheme() {
        if (state.theme === "system") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.dataset.theme = state.theme;
      }
      function renderNav(routeName) {
        const limit = DATA.usage.limits[0];
        const attention = DATA.gates.length + DATA.stuck.length;
        const tab = (name, href, label, badge = "") =>
          `<a class="tab" href="${href}" ${routeName === name ? 'aria-current="page"' : ""}>${label}${badge}</a>`;
        const themeButton = (key, label) =>
          `<button data-theme-set="${key}" aria-pressed="${state.theme === key}">${label}</button>`;
        document.getElementById("nav").innerHTML =
          `<div class="brand"><span class="mono">ark</span><span>hub</span></div>
    ${tab("home", "#/", "Home", attention ? `<span class="badge" title="${DATA.gates.length} gate, ${DATA.stuck.length} stuck">${attention}</span>` : "")}${tab("runs", "#/runs", "Runs")}${tab("backlog", "#/backlog", "Backlog")}
    <div class="nav-right"><span class="nav-status" title="snapshot ${formatClock(NOW)}"><i></i>Master Chief · ${DATA.runs.length} runs</span>
      <a class="pill ${limit.used_pct >= 80 ? "alarm" : ""}" href="#/" title="resets in ${formatMinutes(limit.resets_in_minutes)}">${icon("bolt")}${limit.provider} ${limit.window} <b>${limit.used_pct}%</b></a>
      <span class="mono">${money(DATA.usage.today_usd)} today</span>
      <div class="seg theme" role="group" aria-label="Theme">${themeButton("system", "Auto")}${themeButton("light", "Light")}${themeButton("dark", "Dark")}</div></div>`;
      }
      function currentRoute() {
        const [, name = "", argument] = location.hash.slice(1).split("/");
        return { name: name || "home", argument: argument ? decodeURIComponent(argument) : null };
      }
      function route() {
        const { name, argument } = currentRoute();
        const view = document.getElementById("view");
        const routeName = ["home", "runs", "backlog"].includes(name) ? name : "home";
        if (view.dataset.key === "backlog")
          state.backlogScroll =
            document.getElementById("bl-table")?.scrollTop ?? state.backlogScroll;
        const hash = location.hash || "#/";
        const previous = state.lastHash;
        // remember where a detail page was opened from, so its back link and Esc return there
        if (
          previous &&
          previous !== hash &&
          isDetailHash(hash) &&
          (!isDetailHash(previous) || (isReaderHash(hash) && !isReaderHash(previous)))
        )
          state.origins.set(hash, previous);
        state.lastHash = hash;
        renderNav(routeName);
        view.dataset.key =
          routeName === "backlog" && argument
            ? `ticket:${argument}`
            : routeName === "runs" && argument
              ? `run:${argument}`
              : routeName;
        if (routeName === "home") view.innerHTML = renderHome();
        else if (routeName === "runs" && argument) view.innerHTML = renderRunDetail(argument);
        else if (routeName === "runs") {
          view.innerHTML = renderRuns();
          mountRunsDag();
        } else if (argument) {
          state.backlogSelected = argument;
          view.innerHTML = renderReader(argument);
          mountTicketGraph(argument);
        } else {
          view.innerHTML = renderBacklog(state.backlogSelected);
          document.getElementById("bl-table").scrollTop = state.backlogScroll;
        }
      }
      window.addEventListener("hashchange", route);

      function selectStep(runId, stepId) {
        state.selectedStepByRun.set(runId, stepId);
        document.getElementById("plan-body").innerHTML = planBody(runId);
        document
          .querySelector(`[data-step="${CSS.escape(stepId)}"]`)
          ?.focus({ preventScroll: true });
      }
      function moveBacklogSelection(delta) {
        const rows = [...document.querySelectorAll("#bl-table a.row[data-ticket]")];
        if (!rows.length) return;
        const currentIndex = rows.findIndex((row) => row.dataset.ticket === state.backlogSelected);
        const next = rows[Math.min(rows.length - 1, Math.max(0, currentIndex + delta))];
        rows.forEach((row) => {
          row.classList.remove("sel");
          row.removeAttribute("aria-current");
        });
        next.classList.add("sel");
        next.setAttribute("aria-current", "true");
        state.backlogSelected = next.dataset.ticket;
        next.scrollIntoView({ block: "nearest" });
      }
      const refreshBacklogRows = () => {
        document.getElementById("bl-table").innerHTML = renderBacklogRows(state.backlogSelected);
      };

      document.addEventListener("click", (event) => {
        const target = event.target;
        const toastTarget = target.closest("[data-toast]");
        if (toastTarget) {
          event.preventDefault();
          showToast(toastTarget.dataset.toast);
          return;
        }
        const themeTarget = target.closest("[data-theme-set]");
        if (themeTarget) {
          state.theme = themeTarget.dataset.themeSet;
          applyTheme();
          renderNav(currentRoute().name);
          return;
        }
        const focusTarget = target.closest("[data-focus]");
        if (focusTarget) {
          const panel = document.getElementById(focusTarget.dataset.focus);
          if (panel) {
            panel.scrollIntoView({ block: "nearest" });
            panel.classList.remove("flash");
            void panel.offsetWidth;
            panel.classList.add("flash");
          }
          return;
        }
        const reviewTarget = target.closest("[data-expand-review]");
        if (reviewTarget) {
          const runId = reviewTarget.dataset.expandReview;
          state.expandedReviews.has(runId)
            ? state.expandedReviews.delete(runId)
            : state.expandedReviews.add(runId);
          document.getElementById("view").innerHTML = renderHome();
          return;
        }
        const onlyTarget = target.closest("[data-dag-only]");
        if (onlyTarget) {
          state.dagFilter = new Set([onlyTarget.dataset.dagOnly]);
          document
            .querySelectorAll("[data-dag-filter]")
            .forEach((button) =>
              button.setAttribute(
                "aria-pressed",
                String(state.dagFilter.has(button.dataset.dagFilter)),
              ),
            );
          mountRunsDag();
          return;
        }
        const filterTarget = target.closest("[data-dag-filter]");
        if (filterTarget) {
          const key = filterTarget.dataset.dagFilter;
          state.dagFilter.has(key) ? state.dagFilter.delete(key) : state.dagFilter.add(key);
          filterTarget.setAttribute("aria-pressed", String(state.dagFilter.has(key)));
          mountRunsDag();
          return;
        }
        const groupTarget = target.closest("[data-bl-group]");
        if (groupTarget) {
          state.backlogGroup = groupTarget.dataset.blGroup;
          groupTarget.parentElement
            .querySelectorAll("button")
            .forEach((button) =>
              button.setAttribute("aria-pressed", String(button === groupTarget)),
            );
          refreshBacklogRows();
          return;
        }
        const stepTarget = target.closest("[data-step]");
        if (stepTarget) selectStep(currentRoute().argument, stepTarget.dataset.step);
      });
      document.addEventListener("input", (event) => {
        if (event.target.id === "bl-search") {
          state.backlogQuery = event.target.value;
          refreshBacklogRows();
        }
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "bl-done") {
          state.backlogShowDone = event.target.checked;
          refreshBacklogRows();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const stepTarget = event.target.closest?.("[data-step]");
        if (stepTarget && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          selectStep(currentRoute().argument, stepTarget.dataset.step);
          return;
        }
        const { name, argument } = currentRoute();
        const typing = event.target.tagName === "INPUT";
        if (event.key === "Escape") {
          if (typing) event.target.blur();
          else if ((name === "runs" || name === "backlog") && argument) location.hash = backHref();
          return;
        }
        if (name !== "backlog" || argument || typing) return;
        if (event.key === "/") {
          event.preventDefault();
          document.getElementById("bl-search")?.focus();
        } else if (event.key === "j" || event.key === "k")
          moveBacklogSelection(event.key === "j" ? 1 : -1);
        else if (
          event.key === "Enter" &&
          state.backlogSelected &&
          !event.target.closest?.("a, button")
        )
          location.hash = `#/backlog/${state.backlogSelected}`;
      });
      applyTheme();
      route();
    </script>
  </body>
</html>
