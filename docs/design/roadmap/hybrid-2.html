<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ark hub v2 · Roadmap · hybrid 2 (PROTOTYPE)</title>
    <style>
      /* PROTOTYPE, throwaway. Tokens copied from hub-v2/hybrid-1.html so the page sits in the approved design language.
   Base: variant C (milestone rail, vision lead, Now cards, review column, lane graph).
   Borrowed from variant B: dense two-line rows, one-line Shipped footer bar.
   hybrid 2: done milestones fold into one rail line; review rows are two lines; dense rows carry relations on line 1;
   graph collapses finished dependencies into a thin strip; review tooltip opens inside its own column. */
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f6f4ef, #090b0f);
        --nav: light-dark(#fbfaf6, #0d1015);
        --panel: light-dark(#ffffff, #11141a);
        --panel-2: light-dark(#f8f6f0, #171b23);
        --panel-3: light-dark(#efece4, #1d222c);
        --line: light-dark(#e6e2d8, #222833);
        --line-2: light-dark(#d3cdbf, #2e3644);
        --line-3: light-dark(#b3ac9b, #3b4658);
        --text: light-dark(#1d1c1a, #dde2ea);
        --dim: light-dark(#4f4c45, #a0abba);
        --mute: light-dark(#65615a, #8591a2);
        --red: light-dark(#c2371f, #ff6b5e);
        --amber: light-dark(#c27a0e, #f2b04a);
        --green: light-dark(#2d8a57, #46c48a);
        --blue: light-dark(#2f62d8, #6aa6ff);
        --red-t: light-dark(#b0301a, #ff9a90);
        --amber-t: light-dark(#85500a, #f5c26b);
        --green-t: light-dark(#23693f, #74d8a8);
        --blue-t: light-dark(#2553c7, #94bfff);
        --link: light-dark(#2553c7, #9cc3ff);
        --primary: light-dark(#1d1c1a, #2d6cdf);
        --primary-hover: light-dark(#34322e, #3a7af0);
        --on-primary: #ffffff;
        --code-bg: light-dark(#ece8de, #1d222c);
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
        --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Georgia, serif;
        --foot: 36px;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        scrollbar-color: var(--line-2) transparent;
        scrollbar-width: thin;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 var(--sans);
        font-variant-numeric: tabular-nums;
        min-width: 1280px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      ::selection {
        background: color-mix(in srgb, var(--blue) 35%, transparent);
        color: var(--text);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      p,
      ul {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      .mono {
        font-family: var(--mono);
      }
      code {
        font: 0.92em var(--mono);
        padding: 0 4px;
        border-radius: 3px;
        background: var(--code-bg);
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* ---------- nav (same as hub v2) ---------- */
      .nav {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 16px;
        background: var(--nav);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-right: 18px;
        font-weight: 700;
        font-size: 14px;
      }
      .brand .mono {
        letter-spacing: -0.02em;
      }
      .tab {
        position: relative;
        height: 44px;
        display: inline-flex;
        align-items: center;
        padding: 0 10px;
        color: var(--dim);
        font-weight: 500;
        transition: color 120ms;
      }
      .tab[aria-current="page"] {
        color: var(--text);
      }
      .tab[aria-current="page"]::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: -1px;
        height: 2px;
        background: var(--blue);
        border-radius: 2px;
      }
      @media (hover: hover) {
        .tab:hover {
          color: var(--text);
        }
      }
      .nav-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 12px;
        color: var(--dim);
      }
      .project {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .project select {
        height: 26px;
        padding: 0 8px;
        border-radius: 6px;
        border: 1px solid var(--line-2);
        background: var(--panel-2);
        color: var(--text);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border-radius: 7px;
        background: var(--panel-2);
        border: 1px solid var(--line);
      }
      .seg button {
        height: 22px;
        padding: 0 9px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--dim);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition:
          background-color 120ms,
          color 120ms,
          transform 120ms var(--ease);
      }
      .seg button:active {
        transform: scale(0.96);
      }
      .seg button[aria-pressed="true"] {
        background: var(--panel-3);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      @media (hover: hover) {
        .seg button:hover {
          color: var(--text);
        }
      }

      /* ---------- shared bits ---------- */
      .ic {
        width: 14px;
        height: 14px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 18px;
        padding: 0 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        flex: none;
        background: var(--chip-bg, color-mix(in srgb, var(--dim) 16%, transparent));
        color: var(--chip-fg, var(--dim));
      }
      .chip.amber {
        --chip-bg: color-mix(in srgb, var(--amber) 15%, transparent);
        --chip-fg: var(--amber-t);
      }
      .chip.green {
        --chip-bg: color-mix(in srgb, var(--green) 15%, transparent);
        --chip-fg: var(--green-t);
      }
      .chip.blue {
        --chip-bg: color-mix(in srgb, var(--blue) 15%, transparent);
        --chip-fg: var(--blue-t);
      }
      .chip.red {
        --chip-bg: color-mix(in srgb, var(--red) 16%, transparent);
        --chip-fg: var(--red-t);
      }
      .chip.outline {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      /* proposed: amber outline, the same colour as the review column it also lives in */
      .chip.proposed {
        background: transparent;
        color: var(--amber-t);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 60%, transparent);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
        background: currentColor;
      }
      .dot.hollow {
        background: transparent;
        box-shadow: inset 0 0 0 1.5px currentColor;
      }
      .idchip {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 6px;
        border-radius: 4px;
        background: var(--panel-3);
        font: 600 11px var(--mono);
        color: var(--text);
        transition: background-color 120ms;
        white-space: nowrap;
        flex: none;
      }
      .idchip.open {
        color: var(--amber-t);
        background: color-mix(in srgb, var(--amber) 12%, transparent);
      }
      .idchip.short {
        height: 18px;
        padding: 0 5px;
      }
      @media (hover: hover) {
        a.idchip:hover {
          background: var(--line-2);
        }
      }
      .btn {
        height: 28px;
        padding: 0 11px;
        border-radius: 6px;
        border: 1px solid var(--line-2);
        background: var(--panel-2);
        font-size: 12px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 120ms,
          border-color 120ms,
          transform 120ms var(--ease);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-primary);
      }
      @media (hover: hover) {
        .btn:hover {
          background: var(--panel-3);
          border-color: var(--line-3);
        }
        .btn.primary:hover {
          background: var(--primary-hover);
          border-color: var(--primary-hover);
        }
      }
      .count {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--panel-3);
        color: var(--dim);
        font-size: 11px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* ---------- shell ---------- */
      .shell {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
      }
      .shell.solo {
        grid-template-columns: minmax(0, 1fr);
      }
      .rail {
        border-right: 1px solid var(--line);
        background: var(--nav);
        overflow: auto;
        padding: 14px 10px 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .rail[hidden] {
        display: none;
      }
      .main {
        overflow: auto;
        padding: 20px 24px 48px;
        min-width: 0;
      }
      .solo-line {
        padding: 56px 24px;
        font-size: 15px;
        color: var(--dim);
      }

      /* ---------- rail ---------- */
      .rail-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 0 6px;
      }
      .rail-head h2 {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .rail-head span {
        color: var(--mute);
        font-size: 11px;
        margin-left: auto;
      }
      .rail > * {
        flex: none;
      } /* expanded done rows overflow the rail and scroll; nothing may squash */
      .ms-all {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--dim);
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 120ms,
          transform 120ms var(--ease);
      }
      .ms-all:active {
        transform: scale(0.98);
      }
      .ms-all[aria-pressed="true"] {
        background: var(--panel-3);
        color: var(--text);
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      @media (hover: hover) {
        .ms-all:hover {
          background: var(--panel-2);
          color: var(--text);
        }
      }
      .ms-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .ms {
        position: relative;
        border-radius: 8px;
      }
      .ms-pick {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 100%;
        text-align: left;
        padding: 8px 10px 9px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        transition:
          background-color 120ms,
          transform 120ms var(--ease);
      }
      .ms-pick:active {
        transform: scale(0.985);
      }
      @media (hover: hover) {
        .ms-pick:hover {
          background: var(--panel-2);
        }
      }
      .ms-pick[aria-pressed="true"] {
        background: var(--panel-3);
        box-shadow: inset 0 0 0 1.5px var(--blue);
      }
      .ms-head {
        display: flex;
        align-items: baseline;
        gap: 7px;
        min-width: 0;
      }
      .ms-id {
        font: 700 11px var(--mono);
        color: var(--dim);
        flex: none;
        width: 24px;
      }
      .ms-name {
        font-weight: 600;
        font-size: 13px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ms-state {
        margin-left: auto;
        flex: none;
        align-self: center;
      }
      .ms-outcome {
        font-size: 12px;
        line-height: 1.35;
        color: var(--dim);
        padding-left: 31px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .ms-meter {
        display: block;
        height: 5px;
        margin: 5px 0 0 31px;
        border-radius: 3px;
        background: var(--panel-3);
        overflow: hidden;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .ms-pick[aria-pressed="true"] .ms-meter {
        background: var(--panel);
      }
      .ms-meter i {
        display: block;
        height: 100%;
        background: var(--green);
        border-radius: 3px;
        transform-origin: left;
        animation: fill 700ms var(--ease) both;
      }
      @keyframes fill {
        from {
          transform: scaleX(0);
        }
      }
      .ms-foot {
        padding-left: 31px;
        font-size: 11.5px;
        color: var(--dim);
      }
      .ms-foot b {
        color: var(--text);
        font-weight: 600;
      }
      /* finished milestones: one quiet line, the thin bar is the shipped part */
      .ms.done .ms-pick {
        padding: 6px 10px 9px;
      }
      .ms.done .ms-name {
        color: var(--dim);
        font-weight: 500;
        font-size: 12.5px;
      }
      .ms.done .ms-outcome {
        display: none;
      }
      .ms.done .ms-meter {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 3px;
        margin: 0;
        height: 2px;
        box-shadow: none;
      }
      .ms.done .ms-meter i {
        background: color-mix(in srgb, var(--green) 60%, transparent);
      }
      .ms-count {
        margin-left: auto;
        flex: none;
        font-size: 11.5px;
        color: var(--dim);
      }
      .ms-count b {
        color: var(--text);
        font-weight: 600;
      }
      /* folded done milestones: one quiet line, expands to the per-milestone rows */
      .ms-fold > .ms-list {
        margin-top: 4px;
      }
      .ms-foldbtn {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 7px;
        height: 30px;
        padding: 0 10px 0 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--dim);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
        transition:
          background-color 120ms,
          transform 120ms var(--ease);
      }
      .ms-foldbtn:active {
        transform: scale(0.98);
      }
      @media (hover: hover) {
        .ms-foldbtn:hover {
          background: var(--panel-2);
          color: var(--text);
        }
      }
      .ms-foldbtn .ic {
        width: 11px;
        height: 11px;
        color: var(--mute);
        transition: transform 140ms var(--ease);
      }
      .ms-foldbtn[aria-expanded="true"] .ic {
        transform: rotate(90deg);
      }
      .ms-foldbtn b {
        font: 700 11px var(--mono);
        color: var(--text);
      }
      .ms-foldbtn.has-filter {
        box-shadow: inset 0 0 0 1.5px var(--blue);
        background: var(--panel-3);
      }
      /* active milestones: the rail's loud part */
      .ms.active {
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      .ms.active .ms-name {
        font-size: 14px;
      }
      .ms.active .ms-outcome {
        color: var(--text);
        font-size: 12.5px;
      }
      .ms.active .ms-meter {
        height: 7px;
      }
      .ms.later .ms-name {
        color: var(--text);
      }

      /* ---------- main ---------- */
      .vision {
        font: 400 22px/1.3 var(--serif);
        letter-spacing: -0.01em;
        max-width: 64ch;
        text-wrap: balance;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 16px 0 22px;
        flex-wrap: wrap;
      }
      .seg.big {
        padding: 3px;
        border-radius: 9px;
        border-color: var(--line-2);
      }
      .seg.big button {
        height: 28px;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 6px;
      }
      .seg.big button .ic {
        width: 15px;
        height: 15px;
      }
      .filter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--dim);
        min-width: 0;
      }
      .filter b {
        color: var(--text);
        font-weight: 600;
      }
      .filter button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 7px;
        border: 0;
        border-radius: 5px;
        background: var(--panel-3);
        color: var(--text);
        font-size: 11.5px;
        cursor: pointer;
      }
      .toolbar .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: var(--dim);
      }
      .cmd {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px dashed var(--line-3);
        background: transparent;
        color: var(--text);
        font: 12px var(--mono);
        cursor: pointer;
        transition:
          background-color 120ms,
          transform 120ms var(--ease);
      }
      .cmd:active {
        transform: scale(0.97);
      }
      @media (hover: hover) {
        .cmd:hover {
          background: var(--panel);
        }
      }
      .cmd .ic {
        color: var(--mute);
      }
      .linkbtn {
        border: 0;
        background: transparent;
        color: var(--link);
        font-size: 12px;
        cursor: pointer;
        padding: 0;
      }
      @media (hover: hover) {
        .linkbtn:hover {
          text-decoration: underline;
          text-underline-offset: 2px;
        }
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 24px;
        align-items: start;
      }
      .lists {
        display: flex;
        flex-direction: column;
        gap: 26px;
        min-width: 0;
      }
      .sec-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .sec-head h2 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .sec-head .hint {
        color: var(--mute);
        font-size: 12px;
      }
      .sec.now .sec-head h2 {
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      .sec-empty {
        padding: 14px 16px;
        border-radius: 8px;
        border: 1px dashed var(--line-2);
        color: var(--dim);
        font-size: 12.5px;
        max-width: 70ch;
      }
      .grid-now {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      /* Now: big cards. Elevation is the border only. */
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 18px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--line-2);
        transition:
          border-color 120ms,
          transform 160ms var(--ease);
        min-width: 0;
      }
      @media (hover: hover) {
        .card:hover {
          border-color: var(--line-3);
        }
      }
      .card:has(.card-title a:active) {
        transform: scale(0.99);
      }
      .card.proposed {
        border-color: color-mix(in srgb, var(--amber) 50%, var(--line-2));
      }
      .card-top {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      .card-top .push {
        margin-left: auto;
      }
      .rank {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background: var(--text);
        color: var(--bg);
        font: 700 15px/28px var(--mono);
        text-align: center;
        flex: none;
      }
      .idtext {
        font-weight: 700;
        font-size: 13px;
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.005em;
      }
      .card-title a::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 10px;
      }
      .card-title a {
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-why {
        font-size: 13px;
        color: var(--dim);
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .rels {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-top: auto;
        padding-top: 2px;
      }
      .rels:empty {
        display: none;
      }
      .rel {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 5px;
        position: relative;
        z-index: 1;
      }
      .rel-label {
        font-size: 11px;
        color: var(--mute);
        margin-right: 2px;
      }

      /* Next / Later / Unranked: dense two-line rows (from variant B) */
      .rows {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        overflow: hidden;
      }
      .row {
        position: relative;
        display: grid;
        grid-template-columns: 18px 54px 86px minmax(0, 1fr);
        align-items: center;
        column-gap: 10px;
        min-height: 50px;
        padding: 5px 12px;
        border-bottom: 1px solid var(--line);
        transition: background-color 100ms;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row.proposed {
        box-shadow: inset 2px 0 0 color-mix(in srgb, var(--amber) 75%, transparent);
      }
      @media (hover: hover) {
        .row:hover {
          background: var(--panel-2);
        }
      }
      .row:has(.rtitle:active) {
        background: var(--panel-3);
      }
      .rk {
        font: 700 12px var(--mono);
        color: var(--dim);
        text-align: right;
      }
      .rk.none {
        color: var(--line-3);
        font-weight: 400;
      }
      .rid {
        font: 700 12px var(--mono);
      }
      .row .chip {
        justify-self: start;
      }
      .rmain {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .rtitle {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rtitle::after {
        content: "";
        position: absolute;
        inset: 0;
      }
      .rline {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        min-height: 20px;
      }
      .rwhy {
        min-width: 0;
        font-size: 12px;
        color: var(--dim);
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rrels {
        position: relative;
        z-index: 1;
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rrel {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      /* review callout: compact, one line per ticket */
      .review {
        position: sticky;
        top: 0;
        z-index: 2;
        border-radius: 12px;
        border: 1px solid color-mix(in srgb, var(--amber) 50%, transparent);
        background: color-mix(in srgb, var(--amber) 7%, var(--panel));
      }
      .review-head {
        padding: 12px 14px 11px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        border-bottom: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
      }
      .review-head .row-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .review-head h2 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.005em;
      }
      .review-head p {
        font-size: 12px;
        color: var(--dim);
        line-height: 1.45;
      }
      .review .btn {
        width: 100%;
        height: 30px;
      }
      .review-list li {
        border-bottom: 1px solid color-mix(in srgb, var(--amber) 22%, transparent);
      }
      .review-list li:last-child {
        border-bottom: 0;
      }
      .rv {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        padding: 4px 12px 5px;
        transition: background-color 100ms;
      }
      .review-list li:last-child .rv {
        border-radius: 0 0 11px 11px;
      }
      @media (hover: hover) {
        .rv:hover {
          background: color-mix(in srgb, var(--amber) 10%, transparent);
        }
      }
      .rv-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .rv .idtext {
        font-size: 11px;
        line-height: 15px;
      }
      .rv .chip {
        height: 15px;
        padding: 0 5px;
        font-size: 10.5px;
      }
      .rv .rvt {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.25;
      }
      /* hover tooltip: opens inside the review column (below the row, above it for the last rows), never over the Now cards */
      .tip {
        position: absolute;
        left: 10px;
        right: 10px;
        top: calc(100% + 2px);
        z-index: 6;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--line-3);
        box-shadow: 0 12px 28px -8px rgb(0 0 0 / 0.35);
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-4px);
        transition:
          opacity 120ms,
          transform 160ms var(--ease);
      }
      .review-list li:nth-last-child(-n + 4) .tip {
        top: auto;
        bottom: calc(100% + 2px);
        transform: translateY(4px);
      }
      .tip b {
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.35;
        white-space: normal;
      }
      .tip span {
        font-size: 12px;
        color: var(--dim);
        line-height: 1.4;
        white-space: normal;
        font-weight: 400;
      }
      @media (hover: hover) {
        .review-list .rv:hover .tip {
          opacity: 1;
          transform: none;
          transition-delay: 150ms;
        }
      }
      .review-list .rv:focus-visible .tip {
        opacity: 1;
        transform: none;
      }
      .rv:focus-visible {
        outline-offset: -2px;
      }
      body:has(.drawer.open) .tip {
        display: none;
      }
      .review-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        margin-bottom: 14px;
        border-radius: 10px;
        border: 1px solid color-mix(in srgb, var(--amber) 50%, transparent);
        background: color-mix(in srgb, var(--amber) 7%, var(--panel));
        font-size: 12.5px;
        color: var(--dim);
      }
      .review-bar b {
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
      }
      .review-bar .btn {
        margin-left: auto;
      }

      /* notes: quiet, not an error */
      .notes {
        margin-top: 8px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--dim);

      }
      .notes h2 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--mute);
        margin-bottom: 6px;
      }
      .notes li {
        display: flex;
        gap: 8px;
        padding: 2px 0;
        line-height: 1.45;
      }
      .notes li .mono {
        color: var(--mute);
        font-size: 11px;
        flex: none;
        width: 150px;
        padding-top: 1px;
      }

      /* graph */
      .graph-wrap {
        min-width: 0;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 10px;
        font-size: 12px;
        color: var(--dim);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .legend svg {
        width: 28px;
        height: 8px;
        overflow: visible;
      }
      .legend i {
        width: 14px;
        height: 10px;
        border-radius: 3px;
