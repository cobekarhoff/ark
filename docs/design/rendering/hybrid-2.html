<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hybrid 2 · Ark hub rendering prototype</title>
    <!-- PROTOTYPE, throwaway. Hybrid 2 = hybrid 1 + context/long user messages shown in full in the inspector + entry-only position counter + slim empty relations.
     Data: data.js (window.RENDER_DATA). Markdown is built with createElement/textContent only (no innerHTML of input text).
     The real build uses marked's lexer + a React walker, and shiki core + the JS engine instead of the regex tokenizer below. -->
    <style>
      /* ---------- tokens: copied from hub/page/styles.css ---------- */
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f6f4ef, #090b0f);
        --nav: light-dark(#fbfaf6, #0d1015);
        --panel: light-dark(#ffffff, #11141a);
        --panel-2: light-dark(#f8f6f0, #171b23);
        --panel-3: light-dark(#efece4, #1d222c);
        --line: light-dark(#e6e2d8, #222833);
        --line-2: light-dark(#d3cdbf, #2e3644);
        --line-3: light-dark(#8f887a, #6b7789);
        --text: light-dark(#1d1c1a, #dde2ea);
        --dim: light-dark(#4f4c45, #a0abba);
        --mute: light-dark(#65615a, #8591a2);
        --red: light-dark(#c2371f, #ff6b5e);
        --amber: light-dark(#c27a0e, #f2b04a);
        --green: light-dark(#2d8a57, #46c48a);
        --blue: light-dark(#2f62d8, #6aa6ff);
        --violet: light-dark(#7048c8, #a58bff);
        --red-t: light-dark(#b0301a, #ff9a90);
        --amber-t: light-dark(#85500a, #f5c26b);
        --green-t: light-dark(#23693f, #74d8a8);
        --blue-t: light-dark(#2553c7, #94bfff);
        --violet-t: light-dark(#6a3fc2, #c0acff);
        --red-bg: light-dark(#fbe9e5, #2a1311);
        --amber-bg: light-dark(#fbf0dc, #2a2010);
        --green-bg: light-dark(#e6f3ec, #10241a);
        --blue-bg: light-dark(#e6edfb, #121f38);
        --sel: light-dark(#eaf0fd, #162136);
        --link: light-dark(#2553c7, #9cc3ff);
        --on-red: light-dark(#ffffff, #1a0907);
        --primary: light-dark(#1d1c1a, #2d6cdf);
        --primary-hover: light-dark(#34322e, #3470e4);
        --on-primary: #ffffff;
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
        /* prototype-only: code surface, a step off the panel in both themes */
        --code-bg: light-dark(#f3f0e8, #0b0e13);
        --nav-h: 45px;
        --bar-h: 44px;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        color: var(--text);
        scrollbar-color: var(--line-3) transparent;
        scrollbar-width: thin;
      }
      body {
        margin: 0;
        font: 13px/1.4 var(--sans);
        font-variant-numeric: tabular-nums;
        background: var(--bg);
        color: var(--text);
      }
      ::selection {
        background: color-mix(in srgb, var(--blue) 32%, transparent);
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      h1 {
        font-size: 22px;
        line-height: 1.25;
        margin: 0;
        font-weight: 650;
        text-wrap: balance;
      }
      .mono {
        font-family: var(--mono);
      }
      .mut {
        color: var(--mute);
      }
      .dim {
        color: var(--dim);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
        border-radius: 4px;
      }
      * {
        scrollbar-color: var(--line-3) transparent;
        scrollbar-width: thin;
      }

      /* ---------- nav ---------- */
      .top {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        min-height: 44px;
        padding: 0 16px;
        background: var(--nav);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        margin-right: 18px;
        font-size: 14px;
        font-family: var(--mono);
        letter-spacing: -0.02em;
      }
      .top nav {
        display: flex;
        gap: 2px;
      }
      .tab {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 10px;
        color: var(--dim);
        font-weight: 500;
      }
      .tab[aria-current="page"] {
        color: var(--text);
      }
      .tab[aria-current="page"]::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: -1px;
        height: 2px;
        background: var(--blue);
        border-radius: 2px;
      }
      .nav-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: var(--dim);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 6px;
        border: 1px solid var(--line-2);
        background: var(--panel-2);
        color: var(--text);
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        gap: 2px;
        border: 1px solid var(--line-2);
        border-radius: 7px;
        background: var(--panel-2);
      }
      .seg button {
        background: none;
        border: 0;
        color: var(--dim);
        padding: 3px 9px;
        border-radius: 5px;
        cursor: pointer;
        transition:
          color 120ms var(--ease),
          background-color 120ms var(--ease);
      }
      .seg button[aria-pressed="true"] {
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--line-2);
      }
      @media (hover: hover) and (pointer: fine) {
        .seg button[aria-pressed="false"]:hover {
          color: var(--text);
        }
      }

      /* ---------- controls ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--line-2);
        background: var(--panel);
        color: var(--text);
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 120ms var(--ease),
          transform 120ms var(--ease);
      }
      .btn:active,
      .icon-btn:active,
      .seg button:active {
        transform: scale(0.97);
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-primary);
      }
      .btn.sm {
        padding: 2px 8px;
        font-size: 12px;
      }
      @media (hover: hover) and (pointer: fine) {
        .btn:not(.primary):hover {
          background: var(--panel-3);
        }
        .btn.primary:hover {
          background: var(--primary-hover);
        }
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border-radius: 6px;
        border: 1px solid var(--line-2);
        background: var(--panel);
        color: var(--dim);
        cursor: pointer;
        transition:
          background-color 120ms var(--ease),
          transform 120ms var(--ease);
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      @media (hover: hover) and (pointer: fine) {
        .icon-btn:not(:disabled):hover {
          background: var(--panel-3);
          color: var(--text);
        }
      }
      svg.i {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      kbd {
        font: 11px/1 var(--mono);
        border: 1px solid var(--line-2);
        border-radius: 4px;
        padding: 2px 5px;
        background: var(--panel-2);
        color: var(--dim);
      }
      .pill {
        display: inline-block;
        padding: 0 8px;
        border-radius: 99px;
        font-size: 12px;
        border: 1px solid var(--line-2);
        background: var(--panel-2);
        color: var(--text);
        white-space: nowrap;
      }
      .pill.ok {
        color: var(--green-t);
        background: var(--green-bg);
        border-color: var(--green);
      }
      .pill.bad {
        color: var(--red-t);
        background: var(--red-bg);
        border-color: var(--red);
      }
      .pill.warn {
        color: var(--amber-t);
        background: var(--amber-bg);
        border-color: var(--amber);
      }
      .pill.build {
        color: var(--blue-t);
        background: var(--blue-bg);
        border-color: var(--blue);
      }
      .pill.review {
        color: var(--violet-t);
      }
      .pill.unk {
        color: var(--mute);
        border-style: dashed;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .panel > header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        min-height: 44px;
      }
      .panel h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .count {
        display: inline-block;
        min-width: 20px;
        padding: 0 6px;
        border-radius: 10px;
        background: var(--panel-3);
        color: var(--dim);
        font-size: 12px;
        text-align: center;
      }

      /* ---------- markdown ---------- */
      .md {
        font-size: 14px;
        line-height: 1.62;
        overflow-wrap: break-word;
      }
      .md > :first-child {
        margin-top: 0;
      }
      .md > :last-child {
        margin-bottom: 0;
      }
      .md p,
      .md ul,
      .md ol,
      .md blockquote,
      .md h1,
      .md h2,
      .md h3,
      .md h4,
      .md h5,
      .md h6 {
        max-width: 76ch;
      }
      .md p {
        margin: 0 0 12px;
      }
      .md h1,
      .md h2,
      .md h3,
      .md h4,
      .md h5,
      .md h6 {
        line-height: 1.3;
        margin: 26px 0 8px;
        font-weight: 650;
        text-wrap: balance;
      }
      .md h1 {
        font-size: 20px;
      }
      .md h2 {
        font-size: 16.5px;
      }
      .md h3 {
        font-size: 14.5px;
      }
      .md h4,
      .md h5,
      .md h6 {
        font-size: 13px;
        color: var(--dim);
      }
      .md ul,
      .md ol {
        margin: 0 0 12px;
        padding-left: 22px;
      }
      .md li + li {
        margin-top: 4px;
      }
      .md li > ul,
      .md li > ol {
        margin: 4px 0 0;
      }
      .md li::marker {
        color: var(--mute);
      }
      .md blockquote {
        margin: 0 0 12px;
        padding: 8px 14px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--dim);
      }
      .md blockquote > :last-child {
        margin-bottom: 0;
      }
      .md hr {
        border: 0;
        border-top: 1px solid var(--line-2);
        margin: 20px 0;
      }
      .md a {
        color: var(--link);
        text-decoration: underline;
        text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent);
        text-underline-offset: 2px;
      }
      .md strong {
        font-weight: 650;
      }
      code.ic {
        font: 0.88em var(--mono);
        background: var(--panel-3);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.5px 5px;
        overflow-wrap: break-word;
      }
      .tablewrap {
        overflow-x: auto;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        margin: 4px 0 14px;
        background: var(--panel);
      }
      .md table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        line-height: 1.5;
      }
      .md th,
      .md td {
        padding: 7px 12px;
        min-width: 5.5em;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      .md th {
        background: var(--panel-2);
        color: var(--dim);
        font-weight: 600;
        white-space: nowrap;
      }
      .md tr:last-child td {
        border-bottom: 0;
      }
      .md td.nw {
        white-space: nowrap;
      }
      .md td + td,
      .md th + th {
        border-left: 1px solid var(--line);
      }

      /* ---------- code blocks + tokens ---------- */
      .code {
        margin: 4px 0 14px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--code-bg);
        overflow: hidden;
      }
      .code > figcaption {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 4px 3px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--mute);
        font: 11px var(--mono);
      }
      .code > figcaption .lang {
        margin-right: auto;
      }
      .code pre {
        margin: 0;
        padding: 10px 14px;
        overflow: auto;
        tab-size: 2;
        font: 12.5px/1.55 var(--mono);
        color: var(--text);
      }
      .code pre code {
        font: inherit;
      }
      .code.wrap pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .code.scroll pre {
        max-height: 440px;
      }
      .code.folded pre {
        max-height: calc(12 * 1.55em + 20px);
        overflow: hidden;
        mask-image: linear-gradient(#000 calc(100% - 34px), transparent);
      }
      .code .more {
        display: block;
        width: 100%;
        padding: 5px 12px;
        border: 0;
        border-top: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--dim);
        text-align: left;
        cursor: pointer;
        font-size: 12px;
        transition:
          color 120ms var(--ease),
          background-color 120ms var(--ease);
      }
      @media (hover: hover) and (pointer: fine) {
        .code .more:hover {
          color: var(--text);
          background: var(--panel-3);
        }
      }
      .copy {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 7px;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--mute);
        cursor: pointer;
        font: 11px var(--sans);
        transition:
          color 120ms var(--ease),
          background-color 120ms var(--ease),
          transform 120ms var(--ease);
      }
      .copy:active {
        transform: scale(0.96);
      }
      .copy svg.i {
        width: 13px;
        height: 13px;
      }
      .copy.done {
        color: var(--green-t);
      }
      @media (hover: hover) and (pointer: fine) {
        .copy:hover {
          background: var(--panel-3);
          color: var(--text);
        }
      }
      .tk-key {
        color: var(--blue-t);
      }
      .tk-str {
        color: var(--green-t);
      }
      .tk-num {
        color: var(--amber-t);
      }
      .tk-kw {
        color: var(--violet-t);
      }
      .tk-fn {
        color: var(--blue-t);
      }
      .tk-type {
        color: var(--amber-t);
      }
      .tk-var {
        color: var(--violet-t);
      }
      .tk-flag {
        color: var(--amber-t);
      }
      .tk-com {
        color: var(--mute);
        font-style: italic;
      }
      .tk-add {
        color: var(--green-t);
      }
      .tk-del {
        color: var(--red-t);
      }
      .tk-hunk {
        color: var(--violet-t);
        font-weight: 600;
      }
      .tk-head {
        color: var(--violet-t);
        font-weight: 650;
      }

      /* ---------- transcript view ---------- */
      .tview {
        height: calc(100vh - var(--nav-h));
        display: flex;
        flex-direction: column;
        padding: 12px 16px 16px;
        max-width: 1680px;
        margin: 0 auto;
      }
      .thead {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 14px;
        padding-bottom: 10px;
      }
      .crumb {
        font-size: 12px;
        color: var(--dim);
        flex-basis: 100%;
      }
      .thead h1 {
        font-size: 20px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 12px;
        color: var(--mute);
        min-width: 0;
      }
      .meta b {
        font-weight: 400;
        color: var(--mute);
        margin-right: 5px;
      }
      .meta .v {
        color: var(--text);
      }
      .split {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 400px minmax(0, 1fr);
        gap: 12px;
      }
      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .pane > header {
        flex: none;
      }
      .pane .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .listhead {
        justify-content: space-between;
      }
      .listhead .keys {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        color: var(--mute);
        font-size: 12px;
        white-space: nowrap;
      }
      .listhead h2 {
        white-space: nowrap;
      }
      .filterbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .fchip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 9px 2px 7px;
        border-radius: 6px;
        border: 1px dashed var(--line-2);
        background: transparent;
        color: var(--mute);
        cursor: pointer;
        transition:
          background-color 120ms var(--ease),
          color 120ms var(--ease),
          transform 120ms var(--ease);
      }
      .fchip:active {
        transform: scale(0.97);
      }
      .fchip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
        flex: none;
      }
      .fchip .n {
        color: var(--mute);
      }
      .fchip[aria-pressed="true"] {
        border: 1px solid var(--line-2);
        background: var(--panel-2);
        color: var(--text);
      }
      .fchip[aria-pressed="true"] .n {
        color: var(--dim);
      }
      .fchip.errors[aria-pressed="true"] {
        background: var(--red-bg);
        border-color: var(--red);
        color: var(--red-t);
      }
      .fchip.errors .n,
      .fchip.errors[aria-pressed="true"] .n {
        color: var(--red-t);
      }
      .filterbar.only-errors .fchip:not(.errors) {
        opacity: 0.45;
      }
      @media (hover: hover) and (pointer: fine) {
        .fchip:hover {
          background: var(--panel-3);
          color: var(--text);
        }
      }
      .fsep {
        width: 1px;
        align-self: stretch;
        margin: 3px 2px;
        background: var(--line-2);
      }
      .nomatch {
        padding: 18px 12px;
        color: var(--mute);
      }
      .list {
        padding: 6px;
      }
      .row {
        display: grid;
        grid-template-columns: 38px 16px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 34px;
        padding: 0 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        text-align: left;
        cursor: pointer;
        color: var(--dim);
        transition: background-color 100ms var(--ease);
      }
      .row[hidden] {
        display: none;
      }
      .row + .row {
        margin-top: 1px;
      }
      .row .time {
        font: 11px var(--mono);
        color: var(--mute);
      }
      .row .main {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .main b {
        font-weight: 600;
        color: var(--text);
        margin-right: 6px;
      }
      .row .main b.mono {
        font-weight: 600;
        font-size: 12px;
      }
      .row .end {
        font: 11px var(--mono);
        color: var(--mute);
      }
      .row svg.i {
        width: 15px;
        height: 15px;
      }
      .row.k-context svg {
        color: var(--violet-t);
      }
      .row.k-assistant svg {
        color: var(--blue-t);
      }
      .row.k-user svg {
        color: var(--green-t);
      }
      .row.k-thinking svg {
        color: var(--mute);
      }
      .row.k-tool svg {
        color: var(--dim);
      }
      .row.failed {
        background: color-mix(in srgb, var(--red-bg) 70%, transparent);
        padding: 6px 8px 7px;
        row-gap: 3px;
      }
      .row.failed svg,
      .row.failed .main b {
        color: var(--red-t);
      }
      .row .errline {
        grid-column: 3 / -1;

          const failed = entry.ok === false;
          const row = h(
            "button",
            {
              type: "button",
              class: `row k-${summary.tone}${failed ? " failed" : ""}`,
              role: "option",
              "aria-selected": "false",
              onclick: () => select(item),
            },
            h("span", { class: "time", text: fmtTime(entry.time) }),
            icon(summary.glyph),
            h(
              "span",
              { class: "main" },
              h("b", { class: summary.mono ? "mono" : "", text: summary.label }),
              summary.text,
            ),
            failed
              ? h("span", { class: "pill bad", text: "failed" })
              : h("span", {
                  class: "end",
                  text: entry.kind === "tool" ? fmtBytes(entry.result_bytes ?? 0) : "",
                }),
            failed
              ? h("span", {
                  class: "errline",
                  text:
                    (entry.result || "")
                      .split("\n")
                      .find((line) => line.trim())
                      ?.trim() || "(no output)",
                })
              : null,
          );
          return row;
        }

        function buildTranscript() {
          const transcript = DATA.transcript;
          const failures = entries.filter((entry) => entry.ok === false).length;
          const toolCount = entries.filter((entry) => entry.kind === "tool").length;
          listRows = new Map();
          const list = h("div", {
            class: "list",
            role: "listbox",
            "aria-label": "Transcript entries",
          });
          entries.forEach((_, key) => {
            const item = { type: "entry", key };
            const row = buildRow(item);
            listRows.set(selectionKey(item), row);
            list.append(row);
          });
          const nomatch = h("div", { class: "nomatch", text: "No entries match these filters." });
          const files = h("div", { role: "listbox", "aria-label": "Run files" });
          fileNames.forEach((key) => {
            const item = { type: "file", key };
            const row = buildRow(item);
            listRows.set(selectionKey(item), row);
            files.append(row);
          });

          const countNode = h("span", { class: "count", text: entries.length });
          const counts = {
            messages: entries.filter((entry) => filterOf(entry) === "messages").length,
            tools: toolCount,
            thinking: entries.filter((entry) => entry.kind === "thinking").length,
            errors: failures,
          };
          const chips = [
            ["messages", "var(--green)"],
            ["tools", "var(--blue)"],
            ["thinking", "var(--violet)"],
            ["errors", null],
          ].map(([name, color]) =>
            h(
              "button",
              {
                type: "button",
                class: `fchip${name === "errors" ? " errors" : ""}`,
                "data-filter": name,
                style: color ? `--c:${color}` : null,
                title: name === "errors" ? "Only failed tool calls" : `Show ${name}`,
                onclick: () => {
                  state.filter[name] = !state.filter[name];
                  applyFilter(true);
                },
              },
              color ? h("span", { class: "dot" }) : null,
              name,
              h("span", { class: "n", text: counts[name] }),
            ),
          );
          chips[3].before(h("span", { class: "fsep", role: "separator" }));
          const filterbar = h(
            "div",
            { class: "filterbar", role: "toolbar", "aria-label": "Filter entries" },
            ...chips,
          );
          function applyFilter(reselect) {
            let shown = 0;
            entries.forEach((_, key) => {
              const visible = isVisible({ type: "entry", key });
              listRows.get(`entry:${key}`).hidden = !visible;
              if (visible) shown++;
            });
            for (const chip of chips)
              chip.setAttribute("aria-pressed", String(state.filter[chip.dataset.filter]));
            filterbar.classList.toggle("only-errors", state.filter.errors);
            countNode.textContent =
              shown === entries.length ? entries.length : `${shown} of ${entries.length}`;
            nomatch.hidden = shown > 0;
            if (reselect) {
              if (isVisible(state.selected)) renderInspector();
              else select(order.find(isVisible));
            }
          }
          inspectorPane = h("section", { class: "panel pane insp", "aria-label": "Inspector" });

          const view = h(
            "div",
            { class: "tview" },
            h(
              "div",
              { class: "thead" },
              h(
                "div",
                { class: "crumb" },
                h("a", { href: "#ticket", text: "← ARK-313" }),
                " · transcript",
              ),
              h("h1", { text: transcript.step }),
              h(
                "div",
                { class: "meta" },
                h(
                  "span",
                  null,
                  h("b", { text: "harness" }),
                  h("span", { class: "v mono", text: transcript.harness }),
                ),
                h(
                  "span",
                  null,
                  h("b", { text: "session" }),
                  h("span", { class: "v mono", text: tailTrim(transcript.session, 44) }),
                ),
                h(
                  "span",
                  null,
                  h("b", { text: "window" }),
                  h("span", {
                    class: "v",
                    text: `${fmtTime(entries[0].time)} → ${fmtTime(entries[entries.length - 1].time)}`,
                  }),
                ),
              ),
            ),
            h(
              "div",
              { class: "split" },
              h(
                "section",
                { class: "panel pane", "aria-label": "Transcript" },
                h(
                  "header",
                  { class: "listhead" },
                  h("h2", null, "Transcript ", countNode),
                  h(
                    "span",
                    { class: "keys", "aria-label": "Keyboard: j next, k previous, r raw" },
                    h("kbd", { text: "j" }),
                    h("kbd", { text: "k" }),
                    " move · ",
                    h("kbd", { text: "r" }),
                    " raw",
                  ),
                ),
                filterbar,
                h("div", { class: "scroll" }, list, nomatch),
                h(
                  "div",
                  { class: "filesbox" },
                  h(
                    "h2",
                    null,
                    "Run files ",
                    h("span", { class: "count", text: fileNames.length }),
                  ),
                  files,
                ),
              ),
              inspectorPane,
            ),
          );
          applyFilter(false);
          return view;
        }

        function select(item, { updateHash = true } = {}) {
          state.selected = item;
          for (const [key, row] of listRows)
            row.setAttribute("aria-selected", String(key === selectionKey(item)));
          const row = listRows.get(selectionKey(item));
          row?.scrollIntoView({ block: "nearest" });
          renderInspector();
          if (updateHash)
            history.replaceState(
              null,
              "",
              `#transcript/${item.type === "entry" ? "e" : "f"}/${item.key}`,
            );
        }
        function move(delta) {
          const next = neighbor(delta);
          if (next) select(next);
        }

        const rawSwitch = (isRaw, onChange) =>
          h(
            "span",
            { class: "seg", role: "group", "aria-label": "Rendered or raw" },
            h("button", {
              type: "button",
              "aria-pressed": String(!isRaw),
              text: "Rendered",
              onclick: () => onChange(false),
            }),
            h("button", {
              type: "button",
              "aria-pressed": String(isRaw),
              text: "Raw",
              onclick: () => onChange(true),
            }),
          );
        const setRaw = (value) => {
          state.raw = value;
          renderInspector();
        };

        function renderInspector() {
          const { type, key } = state.selected;
          const visibleEntries = order.filter((item) => item.type === "entry" && isVisible(item));
          const position = visibleEntries.findIndex(
            (item) => selectionKey(item) === selectionKey(state.selected),
          );
          const total = visibleEntries.length;
          let title, sub, glyph, body;
          if (type === "file") {
            const text = DATA.run_files[key];
            title = "Run file";
            sub = `${fmtBytes(byteLength(text))} · ${countLines(text)} lines`;
            glyph = key.endsWith(".json") ? "json" : "file";
            body = renderFile(key, text);
          } else {
            const entry = entries[key];
            const summary = entrySummary(entry);
            glyph = summary.glyph;
            title =
              entry.kind === "tool"
                ? "Tool call"
                : entry.kind === "message"
                  ? `${entry.role === "user" ? "User" : "Assistant"} message`
                  : entry.kind === "thinking"
                    ? "Thinking"
                    : "Context";
            sub = (entry.kind === "tool" ? `${entry.tool} · ` : "") + fmtTime(entry.time);
            body = renderEntry(entry, key);
          }
          const bodyNode = h(
            "div",
            { class: "scroll body", tabindex: "0", "aria-label": `${title} content` },
            body,
          );
          inspectorPane.replaceChildren(
            h(
              "header",
              null,
              h(
                "div",
                { class: "title" },
                icon(glyph),
                h("span", { text: title }),
                h("span", { class: "sub", text: sub }),
              ),
              h(
                "div",
                { class: "tools" },
                rawSwitch(state.raw, setRaw),
                h(
                  "button",
                  {
                    type: "button",
                    class: "icon-btn",
                    "aria-label": "Previous (k)",
                    title: "Previous (k)",
                    disabled: !neighbor(-1),
                    onclick: () => move(-1),
                  },
                  icon("up"),
                ),
                h("span", {
                  class: "pos",
                  title: type === "file" ? key : null,
                  text: type === "file" ? key : `${position + 1}/${total}`,
                }),
                h(
                  "button",
                  {
                    type: "button",
                    class: "icon-btn",
                    "aria-label": "Next (j)",
                    title: "Next (j)",
                    disabled: !neighbor(1),
                    onclick: () => move(1),
                  },
                  icon("down"),
                ),
              ),
            ),
            bodyNode,
          );
        }

        function renderFile(name, text) {
          if (state.raw) return codeBlock(text, "", { wrap: true, label: `raw · ${name}` });
          if (name.endsWith(".json")) {
            const value = tryJson(text);
            return value === undefined
              ? codeBlock(text, "", { wrap: true })
              : jsonBlock(value, { label: `json · ${name}` });
          }
          return renderMarkdown(text);
        }

        /* inspector fold gate: only thinking stays folded. Context and long user text show in full here; their fold lives on the list row. */
        function needsFold(entry) {
          return entry.kind === "thinking";
        }
        function renderText(entry) {
          if (state.raw) return codeBlock(entry.text, "", { wrap: true, label: "raw" });
          const json = tryJson(entry.text);
          return json !== undefined ? jsonBlock(json) : renderMarkdown(entry.text);
        }
        function renderEntry(entry, key) {
          if (entry.kind === "tool") return renderTool(entry, key);
          if (!needsFold(entry)) return renderText(entry);
          const open = state.expanded.has(key);
          const lines = countLines(entry.text);
          const isThinking = entry.kind === "thinking";
          const toggle = h("button", {
            type: "button",
            class: "btn sm",
            "aria-expanded": String(open),
            text: open ? "Collapse" : isThinking ? "Show thinking" : `Expand`,
            onclick: () => {
              open ? state.expanded.delete(key) : state.expanded.add(key);
              renderInspector();
            },
          });
          const title = isThinking ? "Thinking hidden" : foldTitle(entry.text);
          const meta = `${lines} ${lines === 1 ? "line" : "lines"}${isThinking ? "" : ` · ${fmtBytes(byteLength(entry.text))}`}`;
          if (!open)
            return h(
              "div",
              { class: "foldcard" },
              icon(isThinking ? "thinking" : "context"),
              h("span", { class: "t", text: title }),
              h("span", { class: "n", text: meta }),
              toggle,
            );
          return h(
            "div",
            null,
            h(
              "div",
              { class: "foldbar" },
              h("span", { class: "t", text: title }),
              h("span", { class: "n", text: meta }),
              toggle,
            ),
            renderText(entry),
          );
        }

        /* tool calls: full arguments (pretty, folded), result peek + on-demand full result */
        const LANG_BY_EXTENSION = {
          ts: "ts",
          tsx: "ts",
          js: "ts",
          json: "json",
          yml: "yaml",
          yaml: "yaml",
          md: "markdown",
          sh: "bash",
          py: "python",
          diff: "diff",
        };
        function renderTool(entry, key) {
          const args = entry.arguments || {};
          const rest = { ...args };
          const blocks = [];
          if (typeof rest.command === "string") {
            blocks.push(codeBlock(rest.command, "bash", { fold: true, label: "bash · command" }));
            delete rest.command;
          }
          if (typeof rest.input === "string") {
            blocks.push(
              codeBlock(rest.input, "hashline", { fold: true, label: `${entry.tool} · input` }),
            );
            delete rest.input;
          }
          if (typeof rest.content === "string") {
            blocks.push(
              codeBlock(rest.content, LANG_BY_EXTENSION[(rest.path || "").split(".").pop()] || "", {
                fold: true,
                label: `${entry.tool} · content`,
              }),
            );
            delete rest.content;
          }
          if (state.raw) {
            return h(
              "div",
              null,
              h(
                "div",
                { class: "io" },
                h("h3", { text: "Arguments, as stored" }),
                codeBlock(JSON.stringify(args), "", { wrap: true, label: "raw json" }),
              ),
              h(
                "div",
                { class: "io" },
                h(
                  "h3",
                  null,
                  "Result, as stored ",
                  h("span", { class: "mut mono", text: fmtBytes(entry.result_bytes ?? 0) }),
                ),
                codeBlock(entry.result ?? "", "", { wrap: true, scroll: true, label: "raw" }),
              ),
            );
          }
          const failed = entry.ok === false;
          const result = entry.result ?? "";
          const open = state.revealed.has(key);
          const resultLines = result.split("\n");
          const first = resultLines.find((line) => line.trim()) ?? "(empty)";
          const toggle = h("button", {
            type: "button",
            class: "btn sm",
            "aria-expanded": String(open),
            text: open
              ? "Hide result"
              : `Show result · ${fmtBytes(entry.result_bytes ?? byteLength(result))}`,
            onclick: () => {
              open ? state.revealed.delete(key) : state.revealed.add(key);
              renderInspector();
            },
          });
          let resultNode;
          if (!open) {
            resultNode = h(
              "div",
              { class: `peek${failed ? " bad" : ""}` },
              h("span", { text: first }),
              resultLines.length > 1
                ? h("span", {
                    class: "extra",
                    text: `+${resultLines.length - 1} more ${resultLines.length === 2 ? "line" : "lines"}`,
                  })
                : null,
            );
          } else {
            const json = tryJson(result);
            resultNode = h(
              "div",
              null,
              (entry.result_bytes ?? 0) > byteLength(result)
                ? h("p", {
                    class: "note",
                    text: `Prototype data holds the first ${byteLength(result).toLocaleString()} of ${entry.result_bytes.toLocaleString()} bytes. The real build loads the result on demand, capped at 64 KB.`,
                  })
                : null,
              json !== undefined
                ? jsonBlock(json, { label: "json · result" })
                : codeBlock(result, "", { scroll: true, label: failed ? "error" : "result" }),
            );
          }
          return h(
            "div",
            null,
            h(
              "div",
              { class: "io" },
              h("h3", { text: "Arguments" }),
              ...blocks,
              Object.keys(rest).length
                ? jsonBlock(rest, { label: blocks.length ? "json · other arguments" : "json" })
                : null,
            ),
            h(
              "div",
              { class: "io" },
              h(
                "h3",
                null,
                "Result",
                failed
                  ? h("span", { class: "pill bad", text: "failed" })
                  : h("span", { class: "pill ok", text: "ok" }),
                toggle,
              ),
              resultNode,
            ),
          );
        }

        /* ====================================================================== ticket view */
        const STATUS_LABEL = {
          done: "closed",
          in_progress: "in_progress",
          ready: "ready",
          proposed: "proposed",
        };
        const STATUS_PILL = { done: "ok", in_progress: "build", ready: "review", proposed: "unk" };
        function statusGlyph(status) {
          const glyph = svgEl("svg", {
            viewBox: "0 0 18 18",
            width: 18,
            height: 18,
            class: `glyph s-${status}`,
            "aria-hidden": "true",
          });
          glyph.append(svgEl("circle", { cx: 9, cy: 9, r: 7, class: "ring" }));
          if (status === "done")
            glyph.append(svgEl("path", { d: "M5.6 9.2l2.4 2.4 4.4-4.8", class: "mark" }));
          if (status === "in_progress")
            glyph.append(svgEl("path", { d: "M9 4.2a4.8 4.8 0 0 1 0 9.6z", class: "fill" }));
          return glyph;
        }

        const NODE = { width: 236, height: 68, gapX: 88, gapY: 14, lane: 8 };
        // Layered layout, left to right by dependency depth. An edge that skips a column gets a thin
        // "lane" item per skipped column (one per source, shared), so it runs between cards instead of behind them.
        function layoutGraph(nodes, focusId) {
          const byId = Object.fromEntries(nodes.map((node) => [node.id, node]));
          const depth = {};
          const level = (id) =>
            (depth[id] ??= Math.max(
              0,
              ...byId[id].depends_on.filter((dep) => byId[dep]).map((dep) => level(dep) + 1),
            ));
          nodes.forEach((node) => level(node.id));
          const items = new Map(
            nodes.map((node) => [
              node.id,
              { id: node.id, column: depth[node.id], height: NODE.height, preds: [], succs: [] },
            ]),
          );
          const link = (from, to) => {
            const a = items.get(from),
              b = items.get(to);
            if (!a.succs.includes(to)) a.succs.push(to);
            if (!b.preds.includes(from)) b.preds.push(from);
          };
          const chains = [];
          nodes.forEach((node) =>
            node.depends_on
              .filter((dep) => byId[dep])
              .forEach((dep) => {
                const chain = [dep];
                for (let column = depth[dep] + 1; column < depth[node.id]; column++) {
                  const id = `${dep}~${column}`;
                  if (!items.has(id))
                    items.set(id, {
                      id,
                      column,
                      height: NODE.lane,
                      preds: [],
                      succs: [],
                      lane: true,
                    });
                  chain.push(id);
                }
                chain.push(node.id);
                for (let i = 1; i < chain.length; i++) link(chain[i - 1], chain[i]);
                chains.push({
                  chain,
                  blocking: byId[dep].status !== "done",
                  focus: dep === focusId || node.id === focusId,
                });
              }),
          );
          const columns = [];
          items.forEach((item) => (columns[item.column] ??= []).push(item));
          const rowOf = {};
          columns.forEach((column) =>
            column.forEach((item, row) => {
              rowOf[item.id] = row;
            }),
          );
          const mean = (values) =>
            values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
          for (let sweep = 0; sweep < 6; sweep++) {
            // barycenter sweeps: fewer crossings
            const forward = sweep % 2 === 0;
            for (const columnIndex of columns.map((_, i) =>
              forward ? i : columns.length - 1 - i,
            )) {
              const column = columns[columnIndex];
              const score = (item) =>
                mean((forward ? item.preds : item.succs).map((id) => rowOf[id])) ?? rowOf[item.id];
              column.sort((a, b) => score(a) - score(b) || a.id.localeCompare(b.id));
              column.forEach((item, row) => {
                rowOf[item.id] = row;
              });
            }
          }
          const columnHeight = (column) =>
            column.reduce((sum, item) => sum + item.height, 0) + (column.length - 1) * NODE.gapY;
          const height = Math.max(...columns.map(columnHeight));
          const position = {};
          columns.forEach((column, columnIndex) => {
            let y = (height - columnHeight(column)) / 2;
            column.forEach((item) => {
              position[item.id] = { x: columnIndex * (NODE.width + NODE.gapX), y };
              y += item.height + NODE.gapY;
            });
          });
          const bezier = (x1, y1, x2, y2) => {
            const bend = Math.max(28, (x2 - x1) / 2);
            return `C${x1 + bend} ${y1} ${x2 - bend} ${y2} ${x2} ${y2}`;
          };
          const edges = chains.map(({ chain, blocking, focus }) => {
            const start = position[chain[0]];
            let px = start.x + NODE.width,
              py = start.y + NODE.height / 2;
            let d = `M${px} ${py}`;
            for (const id of chain.slice(1)) {
              const item = items.get(id),
                place = position[id];
              const cy = place.y + item.height / 2;
              if (item.lane) {
                d += bezier(px, py, place.x, cy) + `L${place.x + NODE.width} ${cy}`;
                px = place.x + NODE.width;
                py = cy;
              } else d += bezier(px, py, place.x - 3, cy);
            }
            return { d, blocking, focus };
          });
          return {
            position,
            edges,
            width: columns.length * NODE.width + (columns.length - 1) * NODE.gapX,
            height,
          };
        }

        function buildGraph(onToggleFullscreen) {
          const nodes = DATA.graph;
          const focusId = DATA.ticket.id;
          const layout = layoutGraph(nodes, focusId);
          const canvas = h("div", {
            class: "graph-canvas",
            style: `width:${layout.width}px;height:${layout.height}px`,
          });
          const edgeLayer = svgEl("svg", {
            class: "edges",
            width: layout.width,
            height: layout.height,
            "aria-hidden": "true",
          });
          const defs = svgEl("defs");
          for (const kind of ["finished", "blocking", "focus"]) {
            const marker = svgEl("marker", {
              id: `arrow-${kind}`,
              viewBox: "0 0 10 10",
              refX: 9,
              refY: 5,
              markerWidth: 9,
              markerHeight: 9,
              markerUnits: "userSpaceOnUse",
              orient: "auto",
            });
            marker.append(svgEl("path", { d: "M0 0 10 5 0 10z", class: `arrow ${kind}` }));
            defs.append(marker);
          }
          edgeLayer.append(defs);
          // draw non-focus edges first so the focus ticket's edges sit on top
          [...layout.edges]
            .sort((a, b) => a.focus - b.focus)
            .forEach((edge) => {
              const kind = edge.blocking ? "blocking" : edge.focus ? "focus" : "finished";
              edgeLayer.append(
                svgEl("path", {
                  d: edge.d,
                  class: `gedge${edge.blocking ? " blocking" : ""}${edge.focus ? " focus" : ""}`,
                  "marker-end": `url(#arrow-${kind})`,
                }),
              );
            });
          canvas.append(edgeLayer);
          nodes.forEach((node) => {
            const place = layout.position[node.id];
            canvas.append(
              h(
                "div",
                {
                  class: `gnode s-${node.status}${node.id === focusId ? " focus" : ""}`,
                  style: `left:${place.x}px;top:${place.y}px;width:${NODE.width}px;height:${NODE.height}px`,
                  title: `${node.id} · ${STATUS_LABEL[node.status]} · ${node.milestone}\n${node.title}`,
                },
                statusGlyph(node.status),
                h(
                  "div",
                  { class: "gtext" },
                  h(
                    "div",
                    { class: "ghead" },
                    h("span", { class: "gid", text: node.id }),
                    h("span", { class: "gm", text: node.milestone }),
                  ),
                  h("div", { class: "gtitle", text: node.title }),
                ),
              ),
            );
          });
          const stage = h("div", { class: "graph-stage" }, canvas);
          const viewport = h(
            "div",
            {
              class: "graph-viewport",
              tabindex: "0",
              role: "group",
              "aria-label": "Dependency graph, scrollable",
            },
            stage,
          );

          let mode = "fit",
            lastScale = 0;
          const zoom = h("span", { class: "zoom", text: "" });
          const fitButton = h("button", {
            type: "button",
            "aria-pressed": "true",
            text: "Fit",
            onclick: () => setMode("fit"),
          });
          const fullButton = h("button", {
            type: "button",
            "aria-pressed": "false",
            text: "100%",
            onclick: () => setMode("100"),
          });
          const fullscreenButton = h(
            "button",
            {
              type: "button",
              class: "btn sm",
              "aria-label": "Full screen",
              onclick: () => onToggleFullscreen(),
            },
            icon("expand"),
            h("span", { text: "Full screen" }),
          );
          const panel = h(
            "section",
            { class: "panel graph-panel", "aria-label": "Dependency graph" },
            h(
              "header",
              null,
              h("h2", { text: "Dependency graph" }),
              h("span", { class: "count", text: nodes.length }),
              h(
                "div",
                { class: "legend" },
                ...["done", "in_progress", "ready", "proposed"].map((status) =>
                  h("span", null, statusGlyph(status), STATUS_LABEL[status]),
                ),
                h("span", null, lineSample(false), "finished"),
                h("span", null, lineSample(true), "still blocking"),
              ),
              h(
                "div",
                { class: "gtools" },
                zoom,
                h(
                  "span",
                  { class: "seg", role: "group", "aria-label": "Graph zoom" },
                  fitButton,
                  fullButton,
                ),
                fullscreenButton,
              ),
            ),
            viewport,
          );

          function applyScale(force) {
            const panelIsFullscreen = panel.classList.contains("fs");
            const styles = getComputedStyle(viewport);
            const availableWidth =
              viewport.clientWidth -
              parseFloat(styles.paddingLeft) -
              parseFloat(styles.paddingRight);
            const availableHeight =
              viewport.clientHeight -
              parseFloat(styles.paddingTop) -
              parseFloat(styles.paddingBottom);
            let scale = 1;
            if (mode === "fit") {
              const ceiling = panelIsFullscreen ? 1.6 : 1;
              const fit = panelIsFullscreen
                ? Math.min(availableWidth / layout.width, availableHeight / layout.height)
                : availableWidth / layout.width;
              scale = Math.min(ceiling, Math.max(0.6, fit)); // scale down to 60%, then the viewport scrolls
            }
            scale = Math.round(scale * 1000) / 1000;
            if (scale === lastScale && !force) return;
            lastScale = scale;
            canvas.style.transform = `scale(${scale})`;
            stage.style.width = `${layout.width * scale}px`;
            stage.style.height = `${layout.height * scale}px`;
            zoom.textContent = `${Math.round(scale * 100)}%`;
          }
          function setMode(next) {
            mode = next;
            fitButton.setAttribute("aria-pressed", String(next === "fit"));
            fullButton.setAttribute("aria-pressed", String(next === "100"));
            applyScale(true);
          }
          new ResizeObserver(() => applyScale(false)).observe(viewport);
          panel.refit = () => {
            lastScale = 0;
            applyScale(true);
          };
          panel.fullscreenButton = fullscreenButton;
          panel.setFullscreenLabel = (isFullscreen) => {
            fullscreenButton.replaceChildren(
              icon(isFullscreen ? "close" : "expand"),
              h("span", { text: isFullscreen ? "Close · Esc" : "Full screen" }),
            );
            fullscreenButton.setAttribute(
              "aria-label",
              isFullscreen ? "Close full screen" : "Full screen",
            );
          };
          return panel;
        }
        function lineSample(blocking) {
          const sample = svgEl("svg", { class: "ln", viewBox: "0 0 26 8", "aria-hidden": "true" });
          sample.append(
            svgEl("path", { d: "M0 4H26", class: `gedge${blocking ? " blocking" : ""}` }),
          );
          return sample;
        }

        let fullscreenPanel = null;
        let teardown = [];

        function buildTicket() {
          const ticket = DATA.ticket;
          const byId = Object.fromEntries(DATA.graph.map((node) => [node.id, node]));
          const band = h("div", { class: "band" });
          const graph = buildGraph(() => toggleFullscreen(graph, band));
          band.append(graph);

          const prose = [
            { id: "sec-problem", label: "Problem", markdown: ticket.sections.problem },
            { id: "sec-change", label: "Change", markdown: ticket.sections.change },
            { id: "sec-evidence", label: "Evidence", markdown: ticket.sections.evidence },
          ];
          const rawBlock = (text) =>
            codeBlock(text, "markdown", { wrap: true, label: "markdown source" });
          const body = h(
            "div",
            { class: "kbody" },
            prose.map((section) =>
              h(
                "section",
                { class: "ksec", id: section.id },
                h("h2", { text: section.label }),
                state.ticketRaw ? rawBlock(section.markdown) : renderMarkdown(section.markdown),
              ),
            ),
          );

          // sticky chips: prose sections (left column) | acceptance criteria (right column) | Rendered/Raw
          const chipLinks = new Map();
          const jump = (id, className, ...children) => {
            const link = h(
              "a",
              {
                class: className,
                href: `#${id}`,
                onclick: (event) => {
                  event.preventDefault();
                  document.getElementById(id).scrollIntoView({ block: "start" });
                },
              },
              ...children,
            );
            chipLinks.set(id, link);
            return link;
          };
          const bar = h(
            "nav",
            { class: "kbar", "aria-label": "Ticket outline" },
            prose.map((section) => jump(section.id, "", section.label)),
            h("span", { class: "ksep", role: "separator" }),
            jump(
              "sec-criteria",
              "",
              "Acceptance criteria",
              h("span", { class: "count", text: ticket.criteria.length }),
            ),
            ticket.criteria.map((criterion) => jump(`ac-${criterion.id}`, "ac-chip", criterion.id)),
            h(
              "span",
              { class: "seg", role: "group", "aria-label": "Rendered or raw" },
              h("button", {
                type: "button",
                "aria-pressed": String(!state.ticketRaw),
                text: "Rendered",
                onclick: () => {
                  state.ticketRaw = false;
                  renderApp();
                },
              }),
              h("button", {
                type: "button",
                "aria-pressed": String(state.ticketRaw),
                text: "Raw",
                onclick: () => {
                  state.ticketRaw = true;
                  renderApp();
                },
              }),
            ),
          );

          const dependsOn = ticket.depends_on;
          const unblocks = DATA.graph.filter((node) => node.depends_on.includes(ticket.id));
          const dependencyRow = (node) =>
            h(
              "div",
              { class: "dep" },
              h(
                "div",
                { class: "top2" },
                h("span", { class: "did", text: node.id }),
                h("span", {
                  class: `pill ${STATUS_PILL[node.status]}`,
                  text: STATUS_LABEL[node.status],
                }),
              ),
              h("div", { class: "dt", text: node.title }),
            );
          const run = ticket.run;
          const side = h(
            "aside",
            { class: "side", "aria-label": "Dependencies and acceptance criteria" },
            (() => {
              const relation = (title, list) =>
                list.length
                  ? h(
                      "section",
                      { class: "panel" },
                      h(
                        "header",
                        null,
                        h("h2", { text: title }),
                        h("span", { class: "count", text: list.length }),
                      ),
                      list.map(dependencyRow),
                    )
                  : h("div", { class: "relnone" }, h("b", { text: title }), "· none");
              const relations = [
                relation(
                  "Depends on",
                  dependsOn.map((id) => byId[id]),
                ),
                relation("Unblocks", unblocks),
              ];
              return h(
                "div",
                {
                  class: "rels",
                  style: `--cols:${Math.max(1, [dependsOn, unblocks].filter((list) => list.length).length)}`,
                },
                ...relations.sort(
                  (a, b) => (a.className === "relnone") - (b.className === "relnone"),
                ),
              );
            })(),
            h(
              "section",
              { class: "panel", id: "sec-criteria" },
              h(
                "header",
                null,
                h("h2", { text: "Acceptance criteria" }),
                h("span", { class: "count", text: ticket.criteria.length }),
              ),
              h(
                "div",
                { class: "aclist" },
                ticket.criteria.map((criterion) =>
                  h(
                    "article",
                    { class: "ac", id: `ac-${criterion.id}` },
                    h("div", { class: "acid", text: criterion.id }),
                    h(
                      "div",
                      null,
                      state.ticketRaw ? rawBlock(criterion.text) : renderMarkdown(criterion.text),
                    ),
                  ),
                ),
              ),
            ),
          );

          const view = h(
            "div",
            { class: "kview" },
            h(
              "div",
              { class: "khead" },
              h("span", { class: "id", text: ticket.id }),
              h("span", { class: "pill build", text: run.phase }),
              h("span", { class: "pill", text: ticket.milestone }),
              h("span", { class: "pill", text: ticket.status }),
              h(
                "span",
                { class: "mut", text: "Project " },
                h("span", { class: "mono", text: "ark" }),
              ),
            ),
            h("h1", { class: "ktitle", text: ticket.title }),
            h(
              "div",
              { class: "kactions" },
              h("a", { class: "btn primary", href: "#transcript", text: "Open run" }),
              h("span", { class: "mono", text: run.run }),
              h(
                "span",
                null,
                h(
                  "span",
                  { class: "steps", "aria-hidden": "true" },
                  Array.from({ length: run.steps_total }, (_, i) =>
                    h("i", { class: i < run.steps_done ? "on" : "" }),
                  ),
                ),
                `${run.steps_done} / ${run.steps_total} steps`,
              ),
              h("a", { href: "#transcript", text: DATA.transcript.step }),
              "running in Orca, open it from its chat tab",
            ),
            band,
            bar,
            h("div", { class: "kgrid" }, body, side),
          );

          // scroll-spy: prose sections and acceptance criteria scroll side by side, so each column gets its own active chip
          const proseIds = prose.map((section) => section.id);
          const acIds = ticket.criteria.map((criterion) => `ac-${criterion.id}`);
          const passed = (id) => document.getElementById(id).getBoundingClientRect().top <= 106; // bar bottom + scroll margin
          let frame = 0;
          const spy = () => {
            frame = 0;
            const atBottom =
              window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
            const activeProse = atBottom
              ? proseIds[proseIds.length - 1]
              : proseIds.filter(passed).pop() || proseIds[0];
            const activeAc = acIds.filter(passed).pop() || null;
            for (const [id, link] of chipLinks) {
              const current =
                id === activeProse || id === activeAc || (id === "sec-criteria" && activeAc);
              if (current) link.setAttribute("aria-current", "location");
              else link.removeAttribute("aria-current");
            }
          };
          const onScroll = () => {
            if (!frame) frame = requestAnimationFrame(spy);
          };
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", onScroll);
          teardown.push(() => {
            window.removeEventListener("scroll", onScroll);
            window.removeEventListener("resize", onScroll);
          });
          requestAnimationFrame(spy);
          return view;
        }

        function toggleFullscreen(panel, band) {
          const entering = !panel.classList.contains("fs");
          if (entering) {
            band.style.height = `${band.offsetHeight}px`;
            panel.classList.add("fs");
            document.body.style.overflow = "hidden";
            fullscreenPanel = { panel, band };
          } else {
            panel.classList.remove("fs");
            band.style.height = "";
            document.body.style.overflow = "";
            fullscreenPanel = null;
          }
          panel.setFullscreenLabel(entering);
          panel.refit();
          panel.fullscreenButton.focus();
        }

        /* ====================================================================== app shell */
        function parseHash() {
          const [view, kind, ...rest] = location.hash.replace(/^#/, "").split("/");
          if (view === "ticket") return { view: "ticket" };
          const selection =
            kind === "e" && entries[Number(rest[0])]
              ? { type: "entry", key: Number(rest[0]) }
              : kind === "f" && DATA.run_files[rest.join("/")]
                ? { type: "file", key: rest.join("/") }
                : null;
          return { view: "transcript", selection };
        }
        function renderApp() {
          if (fullscreenPanel) toggleFullscreen(fullscreenPanel.panel, fullscreenPanel.band);
          teardown.forEach((fn) => fn());
          teardown = [];
          const route = parseHash();
          const keepScroll = state.view === route.view ? window.scrollY : 0;
          state.view = route.view;
          document
            .getElementById("tab-transcript")
            .setAttribute("aria-current", route.view === "transcript" ? "page" : "false");
          document
            .getElementById("tab-ticket")
            .setAttribute("aria-current", route.view === "ticket" ? "page" : "false");
          const view = document.getElementById("view");
          if (route.view === "ticket") {
            view.replaceChildren(buildTicket());
            window.scrollTo(0, keepScroll);
          } else {
            view.replaceChildren(buildTranscript());
            if (route.selection) state.selected = route.selection;
            select(state.selected, { updateHash: false });
            window.scrollTo(0, 0);
          }
        }
        window.addEventListener("hashchange", renderApp);

        document.addEventListener("keydown", (event) => {
          if (event.metaKey || event.ctrlKey || event.altKey) return;
          if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
          if (event.key === "Escape" && fullscreenPanel) {
            toggleFullscreen(fullscreenPanel.panel, fullscreenPanel.band);
            return;
          }
          if (state.view !== "transcript") return;
          if (event.key === "j") move(1);
          else if (event.key === "k") move(-1);
          else if (event.key === "r") setRaw(!state.raw);
        });

        document.getElementById("theme").addEventListener("click", (event) => {
          const button = event.target.closest("button[data-theme]");
          if (!button) return;
          const root = document.documentElement;
          if (button.dataset.theme === "auto") root.removeAttribute("data-theme");
          else root.dataset.theme = button.dataset.theme;
          for (const other of event.currentTarget.children)
            other.setAttribute("aria-pressed", String(other === button));
        });

        if (!location.hash) history.replaceState(null, "", "#transcript");
        renderApp();
      })();
    </script>
  </body>
</html>
