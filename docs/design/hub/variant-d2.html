<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ark hub — variant d2: design reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ease:cubic-bezier(0.23,1,0.32,1);
  --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
  --bg:oklch(0.15 0.02 258);
  --surface:oklch(0.2 0.022 258);
  --surface-2:oklch(0.25 0.026 258);
  --hover:oklch(0.285 0.03 258);
  --line:oklch(0.33 0.028 258);
  --line-soft:oklch(0.275 0.025 258);
  --text:oklch(0.96 0.01 258);
  --muted:oklch(0.77 0.02 258);
  --faint:oklch(0.67 0.022 258);
  --cyan:oklch(0.84 0.12 205);
  --amber:oklch(0.86 0.15 82);
  --red:oklch(0.72 0.19 25);
  --green:oklch(0.83 0.15 152);
  --violet:oklch(0.78 0.11 295);
  --idle:oklch(0.68 0.025 258);
  --ink:oklch(0.17 0.02 258);
  --cursor:oklch(0.29 0.045 225);
  --scrim:oklch(0.1 0.02 258 / .62);
  --shadow:0 18px 48px oklch(0.05 0.02 258 / .6),0 2px 6px oklch(0.05 0.02 258 / .4);
  --c:var(--cyan);
}
[data-theme=light]{
  color-scheme:light;
  --bg:oklch(0.962 0.006 250);
  --surface:oklch(0.995 0.003 250);
  --surface-2:oklch(0.972 0.006 250);
  --hover:oklch(0.94 0.01 250);
  --line:oklch(0.85 0.012 250);
  --line-soft:oklch(0.91 0.008 250);
  --text:oklch(0.22 0.02 258);
  --muted:oklch(0.4 0.025 258);
  --faint:oklch(0.48 0.025 258);
  --cyan:oklch(0.47 0.11 220);
  --amber:oklch(0.5 0.13 68);
  --red:oklch(0.5 0.19 25);
  --green:oklch(0.45 0.13 152);
  --violet:oklch(0.48 0.15 295);
  --idle:oklch(0.52 0.02 258);
  --ink:oklch(0.99 0.003 250);
  --cursor:oklch(0.94 0.03 215);
  --scrim:oklch(0.3 0.02 258 / .35);
  --shadow:0 18px 48px oklch(0.2 0.02 258 / .2),0 2px 6px oklch(0.2 0.02 258 / .14);
}
.s-working{--c:var(--cyan)} .s-needs{--c:var(--amber)} .s-bad{--c:var(--red)}
.s-ok{--c:var(--green)} .s-waiting{--c:var(--violet)} .s-idle{--c:var(--idle)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 13.5px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden;caret-color:var(--cyan)}
::selection{background:color-mix(in oklab,var(--cyan) 45%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;vertical-align:-2px}
.flip{transform:scaleX(-1)}
.spacer{flex:1}
[hidden]{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:204px minmax(0,1fr) 420px;grid-template-rows:minmax(0,1fr) 32px;height:100vh}
.nav{overflow:auto;background:var(--bg);border-right:1px solid var(--line);padding:12px 8px 8px;display:flex;flex-direction:column;gap:1px}
.center{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.detail{min-height:0;overflow:auto;background:var(--surface);border-left:1px solid var(--line)}
.status{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 10px;background:var(--bg);border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-width:0}

/* nav */
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font-weight:700;font-size:16px;letter-spacing:-0.01em}
.nav-h{font-size:11.5px;font-weight:600;color:var(--faint);padding:16px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;height:31px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--muted);text-align:left;width:100%;font-weight:600;transition:background-color 100ms}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item[aria-current=page],.nav-item[aria-pressed=true]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.nav-item .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item kbd{background:none;border:0;min-width:0;padding:0;color:var(--faint);box-shadow:none}
.nav-item .m{font:500 11.5px var(--mono);color:var(--faint)}
.badge{font:700 11.5px/1 var(--mono);min-width:20px;height:19px;padding:0 6px;border-radius:99px;background:var(--surface-2);color:var(--muted);display:inline-grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.badge.hot{background:var(--amber);color:var(--ink);box-shadow:none}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:1px;padding-top:12px}

kbd{font:500 11px/1 var(--mono);display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:5px;background:var(--bg);border:1px solid color-mix(in oklab,var(--text) 22%,var(--line));border-bottom-width:2px;color:var(--text)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-weight:600;white-space:nowrap;transition:background-color 120ms var(--ease),border-color 120ms var(--ease),transform 120ms var(--ease)}
.btn:hover{background:var(--hover);border-color:color-mix(in oklab,var(--text) 26%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c);border-color:transparent;color:var(--ink)}
.btn.primary:hover{background:color-mix(in oklab,var(--c) 86%,#fff)}
.btn.primary kbd,.act.fill kbd{background:color-mix(in oklab,var(--ink) 14%,transparent);border-color:color-mix(in oklab,var(--ink) 40%,transparent);color:inherit}
.btn.danger{color:var(--red);border-color:color-mix(in oklab,var(--red) 45%,var(--line))}
.btn.danger:hover{background:color-mix(in oklab,var(--red) 14%,var(--surface-2))}
.btn.danger.solid{background:var(--red);color:var(--ink);border-color:transparent}
.btn.sm{height:25px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn[aria-pressed=true]{background:var(--cyan);color:var(--ink);border-color:transparent}
.btn[aria-pressed=true] kbd{background:color-mix(in oklab,var(--ink) 14%,transparent);border-color:color-mix(in oklab,var(--ink) 40%,transparent);color:inherit}
.icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;border:0;border-radius:7px;background:none;color:var(--muted);flex:none;transition:background-color 120ms,transform 120ms var(--ease)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn:active{transform:scale(.94)}

/* top bar + chief strip */
.top{display:flex;align-items:center;gap:12px;height:50px;padding:0 18px;flex:none}
.top h1{font-size:18px;letter-spacing:-0.02em;white-space:nowrap}
.chips{display:flex;gap:2px;padding:3px;margin-left:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;border:0;background:none;color:var(--muted);font-weight:600}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg)}
.chip .n{font:700 11px var(--mono);opacity:.8}
.chief{display:flex;align-items:center;gap:6px 22px;min-height:40px;padding:5px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;flex-wrap:wrap}
.chief-label{color:var(--faint);font-size:12px;font-weight:600}
.chief-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.chief-item b{color:var(--text);font-size:14px}
.focus-note{color:var(--cyan);font-weight:600}

.scroll{flex:1;overflow:auto;padding:14px 18px 22px;min-height:0}
.sec-h{display:flex;align-items:center;gap:10px;margin:20px 0 8px}
.sec-h:first-child{margin-top:4px}
.sec-h h2{font-size:16px;letter-spacing:-0.01em}
.sec-h .count{font:700 12px var(--mono);padding:1px 8px;border-radius:99px;background:var(--amber);color:var(--ink)}
.sec-h .count.plain{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.hint{font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}

/* brief (digest as a sentence) */
.brief{display:flex;gap:14px;align-items:flex-start;padding:11px 8px 11px 16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,color-mix(in oklab,var(--cyan) 11%,var(--surface)),var(--surface) 62%);transition:opacity 160ms var(--ease),transform 160ms var(--ease)}
.brief.leaving{opacity:0;transform:translateY(-4px)}
.brief-main{flex:1;min-width:0}
.brief p{margin:0}
.brief .lede{font-size:15px;line-height:1.45;text-wrap:pretty;max-width:78ch}
.brief .lede b{font-weight:700}
.brief .lede b.warn{color:var(--amber)} .brief .lede b.hot{color:var(--red)}
.brief .also{margin-top:3px;font-size:12.5px;color:var(--muted)}
.brief .also b{color:var(--text);font-weight:600}

/* header tiles: compact status row under the title bar */
.stats{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1.25fr);gap:8px;padding:2px 18px 10px;border-bottom:1px solid var(--line);flex:none}
.tile{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px 0 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;min-width:0;transition:background-color 120ms,border-color 120ms,transform 120ms var(--ease)}
.tile:hover{background:var(--surface-2);border-color:color-mix(in oklab,var(--text) 26%,var(--line))}
.tile:active{transform:scale(.98)}
.tile .n{font:700 24px/1 var(--mono);letter-spacing:-0.04em;color:var(--c,var(--text));white-space:nowrap}
.tile.plain .n{color:var(--text)}
.tile .n small{font-size:14px;letter-spacing:0;color:var(--muted);font-weight:500}
.tile .tx{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tile .l{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s b{font-weight:600}
.tile .s b.bad{color:var(--red)}
.brief+section .sec-h:first-child{margin-top:14px}

/* status dots */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.dot.hot,.dot.calm{animation:dotping 2s infinite}
.dot.calm{animation-duration:3.2s;--o:45%}
@keyframes dotping{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--c) var(--o,75%),transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
.dot.hollow{background:none;box-shadow:inset 0 0 0 1.75px var(--c);animation:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in oklab,var(--c) 15%,transparent);white-space:nowrap;line-height:1.5}
.tag{display:inline-block;padding:0 6px;border-radius:5px;font:600 10.5px/1.6 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tkt{font:500 12.5px var(--mono);white-space:nowrap}
.ttl,.last{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* lists and rows */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.row{position:relative;display:flex;align-items:center;gap:6px;border-radius:10px;background:var(--surface);border:1px solid var(--line-soft);transition:background-color 100ms,border-color 100ms,opacity 150ms var(--ease),transform 150ms var(--ease)}
.row:hover{background:var(--surface-2)}
.row.cursor{background:var(--cursor);border-color:color-mix(in oklab,var(--cyan) 70%,var(--line))}
.row.leaving{opacity:0;transform:translateX(-6px)}
.row-main{flex:1;min-width:0;display:grid;align-items:center;gap:12px;padding:0 10px;background:none;border:0;text-align:left;border-radius:10px;color:inherit}
.row-main.needs{grid-template-columns:6px 132px minmax(0,1fr) 78px;height:54px}
.row-main.runs{grid-template-columns:minmax(0,1fr) 108px 100px 50px 56px;height:56px}
.row-main.tickets{grid-template-columns:64px minmax(0,1fr) 200px;height:40px}
.row-main.agents{grid-template-columns:92px 158px 52px 128px 54px minmax(0,1fr);height:38px}
.row-main.notes{grid-template-columns:12px 50px minmax(0,1fr) 74px;height:38px}
.row-main.found{grid-template-columns:58px 92px minmax(0,1fr) 110px;height:38px}
.colh{display:grid;gap:12px;padding:0 11px;height:22px;align-items:center;font-size:11.5px;font-weight:600;color:var(--faint)}
.colh.runs{grid-template-columns:minmax(0,1fr) 108px 100px 50px 56px;padding-right:11px}
.colh.agents{grid-template-columns:92px 158px 52px 128px 54px minmax(0,1fr);padding-right:44px}
.num{text-align:right;font-family:var(--mono);font-size:12.5px}

/* needs row */
.mk{width:5px;height:30px;border-radius:3px;background:var(--c)}
.need.s-needs .mk,.need.s-bad .mk{animation:mkpulse 2s ease-in-out infinite}
@keyframes mkpulse{50%{opacity:.45}}
.kindcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.kind{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--c);white-space:nowrap}
.who{display:flex;align-items:center;gap:6px;min-width:0}
.need .ttl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:14px;line-height:1.3;font-weight:500}
.wait{font:700 21px/1 var(--mono);letter-spacing:-0.045em;text-align:right;white-space:nowrap}
.wait small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0;margin:0 2px 0 1px}
.wait.warm{color:var(--amber)} .wait.hot{color:var(--red)}
.age{display:block;width:100%;height:3px;border-radius:2px;background:var(--line);margin-top:6px;position:relative;overflow:hidden}
.age::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--faint);border-radius:2px}
.wait.warm .age::after{background:var(--amber)} .wait.hot .age::after{background:var(--red)}
.act{flex:none;width:146px;margin-right:8px;display:inline-flex;justify-content:space-between;align-items:center;gap:6px;height:32px;padding:0 6px 0 11px;border-radius:8px;border:1px solid color-mix(in oklab,var(--c) 45%,transparent);background:color-mix(in oklab,var(--c) 15%,transparent);color:var(--c);font-weight:700;font-size:13px;transition:background-color 120ms,transform 120ms var(--ease),filter 120ms}
.act:hover{background:color-mix(in oklab,var(--c) 28%,transparent)}
.act:active{transform:scale(.97)}
.act kbd{background:var(--bg);color:var(--text)}
.row.cursor .act,.act.fill{background:var(--c);border-color:transparent;color:var(--ink)}
.row.cursor .act:hover{filter:brightness(1.08)}
.row.cursor .act kbd{background:color-mix(in oklab,var(--ink) 14%,transparent);border-color:color-mix(in oklab,var(--ink) 40%,transparent);color:inherit}
.act span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list.big .row-main.needs{height:66px}
.list.big .wait{font-size:27px}
.list.big .need .ttl{font-size:15px}
.list.big .act{height:36px;width:160px}

/* run rows */
.runmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.runmain .t1{display:flex;align-items:center;gap:8px;min-width:0}
.runmain .t1 .ttl{font-weight:600;font-size:14px}
.story{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story b{font-weight:700;color:var(--text)}
.story b.bad{color:var(--red)} .story b.warn{color:var(--amber)}
.nbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:99px;background:var(--amber);color:var(--ink);font:700 11px var(--mono);padding:0 5px;flex:none}
.dots{display:inline-flex;align-items:center}
.dots i{--d:17px;position:relative;display:inline-grid;place-items:center;width:var(--d);height:var(--d);border-radius:50%;font:700 9.5px/1 var(--mono);font-style:normal;color:var(--text);background:color-mix(in oklab,var(--c) 22%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--c);margin-left:7px}
.dots i:first-child{margin-left:0}
.dots i + i::before{content:"";position:absolute;right:100%;top:50%;width:7px;height:2px;margin-top:-1px;background:color-mix(in oklab,var(--c) 55%,transparent)}
.dots i.calm{animation:dotping 3.2s infinite;--o:45%}
.dots i.hot{animation:dotping 2s infinite}
.dots i.ghost{background:none;box-shadow:inset 0 0 0 1.5px var(--idle);border-radius:99px;width:auto;padding:0 6px;font-weight:500;color:var(--faint)}
.ac{display:inline-flex;gap:3px;font:700 13px var(--mono)}
.ac .p{color:var(--green)} .ac .f{color:var(--red)} .ac .z{color:var(--faint)} .ac i{font-style:normal;color:var(--faint)}

/* detail */
.d-empty{padding:48px 28px;color:var(--muted);text-align:center}
.d-head{padding:16px 18px 16px;border-bottom:1px solid var(--line);position:relative}
.d-id{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.d-head h2{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-0.015em;text-wrap:balance}
.d-meta{margin-top:7px;color:var(--muted);font-size:12.5px}
.d-meta b{color:var(--text)}
.d-note{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.d-wait{position:absolute;top:14px;right:18px;text-align:right}
.d-wait .wait{font-size:34px}
.d-wait .since{font-size:11.5px;color:var(--faint);margin-top:4px}
.d-story{margin:10px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.d-story b{color:var(--text);font-weight:700}
.d-story b.bad{color:var(--red)} .d-story b.warn{color:var(--amber)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.bar .btn{padding:0 9px;font-size:13px;gap:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.facts div{padding:8px 12px;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0}
.facts b{display:block;font:700 18px/1.2 var(--mono);letter-spacing:-0.03em}
.facts span{font-size:12px;color:var(--muted)}
.d-sec{padding:14px 18px 16px;border-bottom:1px solid var(--line)}
.d-sec h3{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.d-sec h3 .r{margin-left:auto;font-weight:500;font-size:12.5px}
.tl{list-style:none;margin:2px 0 0;padding:0;display:flex}
.tl li{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--faint);text-align:center}
.tl li::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--line)}
.tl li:first-child::before{display:none}
.tl li.done::before,.tl li.now::before{background:var(--green)}
.tl i{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl li.done i{background:var(--green);border-color:var(--green)}
.tl li.now i{border-color:var(--c);background:color-mix(in oklab,var(--c) 40%,var(--surface))}
.tl li.now{color:var(--text);font-weight:700}
.tl li.done{color:var(--muted)}
.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-weight:600;font-size:11.5px;color:var(--faint);text-align:left;padding:0 6px 5px 0}
.t td{padding:6px 6px 6px 0;border-top:1px solid var(--line-soft);vertical-align:middle}
.t td.r,.t th.r{text-align:right;padding-right:0}
.t .st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--cyan);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in oklab,var(--cyan) 40%,transparent)}
.link:hover{text-decoration-color:currentColor}
.acbar{display:flex;gap:3px;margin-bottom:8px}
.acbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.acbar i.passing{background:var(--green)} .acbar i.failing{background:var(--red)}
.strat{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.strat+.strat{margin-top:6px}
.strat.rec{border-color:var(--amber);background:color-mix(in oklab,var(--amber) 9%,var(--bg))}
.strat .letter{font:700 26px/1 var(--mono);color:var(--amber)}
.strat .nm{font-weight:600;line-height:1.3}
.strat .mk2{font:500 11.5px var(--mono);color:var(--muted)}
.strat .bt{display:flex;flex-direction:column;gap:4px}
.arow{display:grid;grid-template-columns:10px minmax(0,1fr) auto 28px;gap:4px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line-soft)}
.arow:first-of-type{border-top:0;padding-top:0}
.arow .dot{margin-top:5px}
.arow .nm{font-weight:600}
.arow .out{grid-column:2/4;font:12px/1.45 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.line-out{font:12.5px/1.5 var(--mono);padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line-soft);color:var(--muted);overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stepg{display:block;width:100%;height:auto}
.stepg text,.graph text{fill:var(--text);font-family:var(--sans);font-size:12.5px;pointer-events:none}
.stepg .m,.graph .m{font-family:var(--mono)}
.stepg .b,.graph .b{font-weight:700}
.stepg .sub,.graph .sub{fill:var(--muted);font-size:11.5px}
.graph .tiny{font-size:10.5px}
.stepg .note,.graph .note{fill:var(--faint);font-size:12px;font-style:italic}

/* graph (map view) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel>header{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h2{font-size:16px}
.legend{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.graph{display:block;width:100%;height:auto}
.graph .col{fill:var(--faint);font-size:11.5px;font-weight:600}
.node{cursor:pointer;outline:none}
.node .body,.stepg .body{fill:color-mix(in oklab,var(--c) 15%,var(--surface));stroke:var(--c);stroke-width:1.5;transition:fill .15s}
.node:hover .body{fill:color-mix(in oklab,var(--c) 30%,var(--surface))}
.node.cursor .body{stroke:var(--text);stroke-width:3}
.node:focus-visible .body{stroke:var(--text);stroke-width:3}
.node.ghost .body{fill:transparent;stroke-dasharray:5 4}
.edge{fill:none;stroke:color-mix(in oklab,var(--c,var(--idle)) 55%,transparent);stroke-width:1.6;stroke-linejoin:round}
.edge.flow{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
.edge.dashed{stroke-dasharray:4 5}
.lane{stroke:var(--line);stroke-width:1}
.lane.proj{stroke:color-mix(in oklab,var(--text) 22%,var(--line))}
@keyframes flow{to{stroke-dashoffset:-12}}
.ping{fill:none;stroke:var(--c);stroke-width:2;transform-box:fill-box;transform-origin:center;pointer-events:none;animation:ping 1.9s cubic-bezier(0,0,.2,1) infinite}
.ping.calm{stroke-width:1.5;animation-duration:3.2s;--o:.4}
@keyframes ping{0%{opacity:var(--o,.85);transform:scale(1)}85%,100%{opacity:0;transform:scale(var(--s,1.1))}}

/* map: linked path, dimming, replay scrubber */
.gpanel{position:relative}
.gwrap{padding:6px 8px 8px}
.gcap{min-height:48px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcap b{color:var(--text);font-weight:700} .gcap b.bad{color:var(--red)} .gcap b.warn{color:var(--amber)}
.graph.focus .edge.rel{stroke:var(--c,var(--idle));stroke-width:2.8}
.graph.focus .node.rel:not(.cursor) .body{stroke-width:2.4}
.graph.dim.focus [data-t]:not(.rel){opacity:.4}
.badge-g{cursor:pointer;outline:none}
.badge-g .bd{fill:var(--amber);stroke:var(--surface);stroke-width:1.5}
.badge-g:hover .bd{filter:brightness(1.12)}
.badge-g:focus-visible .bd,.badge-g.cursor .bd{stroke:var(--text);stroke-width:3}
.badge-g .kk{fill:var(--ink);font:700 11.5px var(--mono)}
.rp-panel{margin-top:10px;padding:9px 14px 4px;position:sticky;bottom:0;z-index:3}
.rp-head{display:flex;align-items:center;gap:10px}
.rp-head h2{font-size:15px}
.asof{font:600 13px var(--mono);color:var(--cyan);white-space:nowrap}
.asof.live{color:var(--green)}
.readout{margin:3px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout b{color:var(--text)}
.rp-track{margin:2px 6px 0}
.rp-track input{display:block;width:100%;margin:0;height:22px;accent-color:var(--cyan)}
.rp-ticks{position:relative;height:16px;margin:0 14px}
.rp-tick{position:absolute;top:0;width:16px;height:16px;margin-left:-8px;border:0;background:none;padding:0;display:grid;place-items:center}
.rp-tick i{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:transform 120ms var(--ease),background-color 120ms}
.rp-tick:hover i,.rp-tick:focus-visible i{transform:scale(1.5);background:var(--text)}
.rp-tick.run i{border-radius:2px;background:var(--cyan)}
.rp-tick.need i{background:var(--amber)}
.rp-flag{display:flex;gap:8px;align-items:center;padding:2px 3px 2px 10px;border-radius:8px;background:var(--amber);color:var(--ink);font-weight:700;font-size:12.5px}
.rp-flag .btn{height:24px}

/* where the time went (run detail, timeline lane detail) */
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:10px}
.split i{display:block;min-width:3px;background:var(--c)}
.split-l{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;font-size:12.5px;align-items:center}
.split-l .sw{width:9px;height:9px;border-radius:3px;background:var(--c)}
.split-l .v{font:600 12px var(--mono)}

/* timeline view: standalone swimlanes, no link to Home or Map */
.scroll[data-view=timeline]{display:flex;flex-direction:column;overflow:hidden}
.tm-panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tm-panel>header{flex:none}
.tm-zoom{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tm-zoom button{height:26px;padding:0 11px;border:0;background:none;color:var(--muted);font:600 12px var(--mono);transition:background-color 100ms}
.tm-zoom button+button{border-left:1px solid var(--line)}
.tm-zoom button:hover{background:var(--hover);color:var(--text)}
.tm-zoom button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.proto-note{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--faint);font-style:italic}
.tm-scroll{flex:1;min-height:0;overflow:auto;position:relative;scroll-padding-top:30px}
.tm-inner{position:relative;min-height:100%}
.tm-axis{position:sticky;top:0;z-index:4;height:26px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px}
.tm-axis-in{position:relative;height:100%}
.tm-tick{position:absolute;top:6px;transform:translateX(-50%);font:500 11px var(--mono);color:var(--faint);white-space:nowrap}
.tm-now{position:absolute;right:0;top:4px;font:700 11px var(--mono);color:var(--ink);background:var(--cyan);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tm-grid{position:absolute;top:26px;bottom:0;left:16px;right:16px;pointer-events:none;z-index:0}
.tm-grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
.tm-grid .nowline{right:0;width:1.5px;background:var(--cyan);opacity:.85;z-index:3}
.tm-lanes{list-style:none;margin:0;padding:0;position:relative;z-index:1}
.tm-lane{position:relative;padding:6px 16px 7px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background-color 100ms}
.tm-lane:hover{background:color-mix(in oklab,var(--hover) 55%,transparent)}
.tm-lane.cursor{background:var(--cursor);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--cyan) 55%,transparent)}
.tm-lane.group{cursor:default;padding:6px 16px;background:var(--bg);font-size:12px;font-weight:600;color:var(--faint)}
.tm-lane.group:hover{background:var(--bg)}
.tm-lane-head{display:flex;align-items:center;gap:8px;width:100%;height:22px;padding:0;background:none;border:0;text-align:left;min-width:0;border-radius:5px;color:inherit}
.tm-story{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--muted)}
.tm-story b{color:var(--text);font-weight:700}
.tm-story b.bad{color:var(--red)} .tm-story b.warn{color:var(--amber)}
.tm-story .nm{color:var(--text);font-weight:700}
.tm-meta{font:500 11.5px var(--mono);color:var(--faint);white-space:nowrap}
.tm-track{position:relative;height:20px;margin-top:3px}
.tm-track.nested{height:16px}
.tm-track.nested::before{content:"";position:absolute;left:-9px;top:-5px;width:6px;height:12px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-left-radius:4px}
.tm-block{--c:var(--idle);position:absolute;top:0;bottom:0;min-width:6px;display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:5px;border:1px solid var(--c);background:color-mix(in oklab,var(--c) 27%,var(--surface));color:var(--text);font:500 11px/1 var(--mono);white-space:nowrap;overflow:hidden;margin:0}
.nested .tm-block{padding:0 4px;font-size:10.5px;border-radius:4px}
.tm-block.k-work{--c:var(--cyan)} .tm-block.k-ok{--c:var(--green)} .tm-block.k-fail{--c:var(--red);background:color-mix(in oklab,var(--red) 40%,var(--surface))}
.tm-block.k-wait{--c:var(--violet)} .tm-block.k-idle{background:color-mix(in oklab,var(--idle) 14%,var(--surface))}
.tm-block.thin{top:7px;bottom:7px;padding:0;min-width:0}
.tm-block.clipped{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:transparent}
.tm-block.current:not(.thin)::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--c)}
.tm-block.k-work.current:not(.thin){animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{background:color-mix(in oklab,var(--cyan) 40%,var(--surface))}}
.tm-block.k-stall{--c:var(--red);border-style:dashed;background:color-mix(in oklab,var(--red) 10%,transparent);font-weight:600}
.tm-block.k-stall.live{animation:glow 2s ease-in-out infinite}
.tm-block.k-gate{--c:var(--amber);font-weight:700;background-image:linear-gradient(135deg,color-mix(in oklab,var(--c) 36%,var(--surface)) 25%,color-mix(in oklab,var(--c) 11%,var(--surface)) 25% 50%,color-mix(in oklab,var(--c) 36%,var(--surface)) 50% 75%,color-mix(in oklab,var(--c) 11%,var(--surface)) 75%);background-size:14px 14px}
.tm-block.k-gate.done{opacity:.62;font-weight:500}
.tm-block.k-gate.new{--c:color-mix(in oklab,var(--amber) 55%,var(--muted))}
.tm-block.k-gate.mid{--c:var(--amber)} .tm-block.k-gate.old{--c:var(--red)}
.tm-block.k-gate.live{animation:march 1.1s linear infinite,glow 2.4s ease-in-out infinite}
@keyframes march{to{background-position:14px 0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in oklab,var(--c) 0%,transparent)}50%{box-shadow:0 0 0 3px color-mix(in oklab,var(--c) 38%,transparent)}}
button.tm-block{cursor:pointer;text-align:left;transition:filter 120ms,transform 120ms var(--ease)}
button.tm-block:hover{filter:brightness(1.18);box-shadow:0 0 0 2px var(--c)}
button.tm-block:active{transform:scale(.97)}
.tm-block.ghost{--c:var(--amber);background:none;border-style:dashed;font-weight:600;color:var(--amber)}
.tm-track.burn{height:14px;margin-top:3px;border-bottom:1px solid var(--line)}
.tm-track.burn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tm-track.burn polygon{fill:color-mix(in oklab,var(--text) 13%,transparent);stroke:none}
.tm-track.burn polyline{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.tm-foot{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:7px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--surface)}
.tm-foot span{display:inline-flex;align-items:center;gap:6px}
.tm-foot i{display:inline-block;width:16px;height:9px;border-radius:3px;border:1px solid var(--c);background:color-mix(in oklab,var(--c) 30%,var(--surface))}
.tm-foot i.hatch{background-image:linear-gradient(135deg,color-mix(in oklab,var(--c) 40%,var(--surface)) 25%,color-mix(in oklab,var(--c) 12%,var(--surface)) 25% 50%,color-mix(in oklab,var(--c) 40%,var(--surface)) 50% 75%,color-mix(in oklab,var(--c) 12%,var(--surface)) 75%);background-size:7px 7px}
.tm-foot i.dash{border-style:dashed;background:color-mix(in oklab,var(--c) 10%,transparent)}
.tm-ask{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--bg);text-align:left;transition:background-color 100ms,transform 120ms var(--ease)}
.tm-ask+.tm-ask{margin-top:5px}
.tm-ask:hover{background:var(--hover)}
.tm-ask:active{transform:scale(.985)}
.tm-ask .wait{font-size:16px}

/* metrics, settings */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.metrics>div{padding:14px 16px;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.metrics>div:nth-child(-n+4){border-top:0}
.metrics>div:nth-child(4n+1){border-left:0}
.metrics b{display:block;font:700 26px/1.1 var(--mono);letter-spacing:-0.04em}
.metrics span{color:var(--muted);font-size:13px}
.metrics small{display:block;color:var(--faint);font-size:12px}
.proj{margin-top:20px;border-top:1px solid var(--line);padding-top:8px}
.proj-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:8px;border-radius:8px}
.proj-h.cursor{background:var(--cursor);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--cyan) 60%,transparent)}
.proj-h h2{font-size:16px}
.select{height:28px;padding:0 24px 0 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 12px,calc(100% - 8px) 12px;background-size:5px 5px;background-repeat:no-repeat;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 13px;border:0;background:none;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.check{display:flex;align-items:center;gap:8px;padding:5px 8px}
.check input{accent-color:var(--cyan)}
.searchbar{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}
.searchbar:focus-within{border-color:var(--cyan)}
.searchbar input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:15px}
.chart text{fill:var(--faint);font-size:11px;font-family:var(--sans)}
.chart .val{fill:var(--muted)} .chart .today{fill:var(--text);font-weight:700}
.empty{padding:20px 8px;color:var(--muted)}
.group-h{margin:16px 0 6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.dep{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted);margin-right:8px;white-space:nowrap}
.deps{display:flex;align-items:center;gap:6px;overflow:hidden;color:var(--faint)}

/* composer + status strip */
.composer{display:flex;align-items:center;gap:8px;padding:9px 18px;border-top:1px solid var(--line);background:var(--surface);flex:none}
.c-in{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--faint)}
.c-in:focus-within{border-color:var(--cyan)}
.c-in input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.c-in input::placeholder{color:var(--faint)}
.composer .select{height:34px}
.composer .btn{height:34px}
.achips{display:flex;gap:2px;min-width:0;overflow:hidden}
.achip{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 8px;border-radius:6px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.achip:hover{background:var(--surface-2);color:var(--text)}
.status .sum{white-space:nowrap;color:var(--faint)}
.status .r{margin-left:auto;white-space:nowrap;color:var(--faint);padding-right:318px;font-family:var(--mono);font-size:11.5px}
.proto{position:fixed;right:10px;bottom:5px;font:500 11px var(--mono);color:var(--ink);background:var(--amber);border-radius:5px;padding:3px 9px;z-index:90;pointer-events:none;opacity:.94}

/* hover preview */
#peek{position:fixed;z-index:60;width:400px;padding:10px 12px 11px;border:1px solid color-mix(in oklab,var(--text) 22%,var(--line));border-radius:11px;background:var(--surface-2);box-shadow:var(--shadow);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity 120ms var(--ease),transform 120ms var(--ease)}
#peek.in{opacity:1;transform:none}
#peek.instant{transition-duration:0ms}
#peek h4{margin:0 0 6px;font-size:11.5px;font-weight:600;color:var(--faint)}
#peek .pa+.pa{margin-top:8px}
#peek .pn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
#peek .pn .muted{font-weight:400;font-size:12px}
#peek .po{margin-top:3px;font:12px/1.45 var(--mono);color:var(--muted);overflow-wrap:anywhere}

/* layers */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.dialog,.palette{background:var(--surface-2);border:1px solid color-mix(in oklab,var(--text) 22%,var(--line));border-radius:14px;box-shadow:var(--shadow);width:min(540px,92vw);max-height:76vh;overflow:auto}
.dialog{animation:pop 140ms var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.dialog h2{font-size:18px;padding:18px 20px 4px}
.dialog .body{padding:6px 20px 12px;color:var(--muted)}
.dialog textarea{width:100%;min-height:96px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);margin-top:6px}
.dialog textarea:focus{border-color:var(--cyan)}
.dialog .foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 20px 18px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:10px 14px;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left}
.choice:hover{background:var(--hover)}
.choice b{font-weight:700;color:var(--text);display:flex;gap:8px;align-items:center;width:100%}
.choice b kbd{margin-left:auto}
.choice span{font-size:12.5px;color:var(--muted)}
.palette{width:min(640px,92vw);overflow:hidden;display:flex;flex-direction:column}
.p-in{display:flex;align-items:center;gap:10px;padding:0 18px;height:54px;border-bottom:1px solid var(--line);color:var(--faint)}
.p-in input{flex:1;background:none;border:0;outline:0;font-size:17px;color:var(--text)}
.p-list{overflow:auto;max-height:52vh;padding:6px}
.p-g{font-size:11.5px;font-weight:600;color:var(--faint);padding:9px 10px 4px}
.p-item{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:10px;align-items:center;height:36px;padding:0 10px;border-radius:8px;cursor:pointer}
.p-item.active{background:color-mix(in oklab,var(--cyan) 22%,var(--surface-2))}
.p-item .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-item .sb{color:var(--muted);font-size:12px;white-space:nowrap}
.p-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.p-foot span{display:inline-flex;gap:5px;align-items:center}
.sheet{width:min(660px,92vw)}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 32px;padding:6px 20px 8px}
.sheet h3{font-size:12.5px;color:var(--cyan);margin:12px 0 4px}
.sheet .k{display:flex;justify-content:space-between;align-items:center;gap:10px;height:28px;color:var(--muted);border-bottom:1px solid var(--line-soft)}
.sheet .k span:last-child{display:flex;gap:3px}
#toasts{position:fixed;left:calc(204px + (100vw - 204px - 420px) / 2);bottom:104px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;max-width:560px;padding:10px 15px;border-radius:11px;background:var(--text);color:var(--bg);box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity 160ms var(--ease),transform 160ms var(--ease)}
.toast.in{opacity:1;transform:none}
.toast b{font-weight:700;font-size:13.5px}
.toast code{display:block;margin-top:3px;font:12px/1.4 var(--mono);opacity:.85;overflow-wrap:anywhere}

@media (max-width:1320px){
  .app{grid-template-columns:198px minmax(0,1fr) 344px}
  .chief-item .since{display:none}
  .row-main.runs,.colh.runs{grid-template-columns:minmax(0,1fr) 96px 92px 46px 52px}
  .row-main.needs{grid-template-columns:6px 118px minmax(0,1fr) 72px}
  .act{width:128px}
  .status .sum{display:none}
  .wait{font-size:19px}
  .tile{padding:0 9px}
  .tile .n{font-size:22px}
  #toasts{left:calc(198px + (100vw - 198px - 344px) / 2)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .ping{display:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Views and projects"></nav>
  <main class="center">
    <header class="top" id="top"></header>
    <div class="stats" id="stats" role="group" aria-label="Status"></div>
    <div class="chief" id="chief"></div>
    <div class="scroll" id="main"></div>
    <form class="composer" id="composer" autocomplete="off">
      <label><span class="sr">Project</span><select class="select" id="cproj"></select></label>
      <div class="c-in"><span id="cic"></span><input id="cmsg" aria-label="Message Master Chief"><kbd>c</kbd></div>
      <button class="btn primary" type="submit">Send <kbd>↵</kbd></button>
    </form>
  </main>
  <aside class="detail" id="detail" aria-label="Detail"></aside>
  <footer class="status" id="status"></footer>
</div>
<div id="layer"></div>
<div id="peek" role="tooltip"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div class="proto">PROTOTYPE — variant d2: design reference</div>
<script src="data.js"></script>
<script>
(function(){
'use strict';
const S = JSON.parse(JSON.stringify(HUB_DATA));
const NOW = new Date(S.now).getTime();
const SINCE = Date.parse(S.lastSeen);
const HOUR = 36e5;
const $ = s => document.querySelector(s);
const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';

/* ---------- ui state ---------- */
const ui = { view:'home', filter:'all', sel:null, prev:null, digest:true, focus:false, theme:'dark', q:'',
  dim:true, replay:null, tl:{ hours:12, burn:false, sel:null },
  paused:{}, aborted:{}, acts:[], layer:null, layerReturn:null, pitems:[], pi:0,
  chiefProject:'ark', notifyDesktop:true, notifySound:false };
// the Timeline keeps its own selection (ui.tl.sel); Home, Map and the other views share ui.sel
const cur = () => ui.view === 'timeline' ? ui.tl.sel : ui.sel;
const setCur = sel => { if (ui.view === 'timeline') ui.tl.sel = sel; else ui.sel = sel; };
S.roles = {
  ark:{'Master Chief':'claude · opus-5','Run lead':'claude · opus-5','Implementer':'claude · opus-5','Validator':'codex · gpt-6','Reviewer':'codex · gpt-6','Designer':'claude · opus-5'},
  clara:{'Master Chief':'claude · opus-5','Run lead':'omp · sonnet-5','Implementer':'omp · sonnet-5','Validator':'omp · sonnet-5','Reviewer':'omp · sonnet-5','Designer':'omp · sonnet-5'},
};
const ROLE_OPTIONS = ['claude · opus-5','claude · sonnet-5','codex · gpt-6','omp · sonnet-5'];
const VIEWS = [
  ['home','Home','home'],['map','Map','map'],['timeline','Timeline','clock'],['backlog','Backlog','list'],['agents','Agents','cpu'],['metrics','Metrics','chart'],
  ['search','Search','search'],['projects','Projects & settings','sliders'],['notifications','Notifications','bell'],
];
const TITLES = { home:'Home', map:'Map', timeline:'Timeline', backlog:'Backlog', agents:'Agents', metrics:'Metrics', search:'Search', projects:'Projects & settings', notifications:'Notifications' };

/* ---------- icons ---------- */
const P = d => `<path d="${d}"/>`;
const ICON = {
  home:P('M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'),
  map:'<circle cx="5.5" cy="12" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>'+P('M8 11l8.2-4.2M8 13l8.2 4.2'),
  list:P('M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'),
  cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/>'+P('M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3'),
  chart:P('M3 3v18h18M8 17v-5M13 17V8M18 17v-9'),
  search:'<circle cx="11" cy="11" r="7"/>'+P('m20 20-3.5-3.5'),
  sliders:P('M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2')+'<circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>',
  bell:P('M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0'),
  flag:P('M5 21V4M5 4h11l-2 4 2 4H5'),
  alert:P('M12 3 2 20h20zM12 10v4M12 17h.01'),
  merge:'<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/>'+P('M6 21V9a9 9 0 0 0 9 9'),
  help:'<circle cx="12" cy="12" r="9"/>'+P('M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01'),
  pause:'<circle cx="12" cy="12" r="9"/>'+P('M10 15V9M14 15V9'),
  check:'<circle cx="12" cy="12" r="9"/>'+P('m8.5 12 2.5 2.5 4.5-5'),
  refresh:P('M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5'),
  x:P('M6 6l12 12M18 6 6 18'),
  sun:'<circle cx="12" cy="12" r="4"/>'+P('M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'),
  moon:P('M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'),
  send:P('m22 2-7 20-4-9-9-4zM22 2 11 13'),
  term:P('m4 17 6-6-6-6M12 19h8'),
  arrow:P('M5 12h14M13 6l6 6-6 6'),
  back:P('M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3'),
  play:P('M6 4l14 8-14 8z'),
  plus:P('M12 5v14M5 12h14'),
  flash:P('M13 2 4 14h7l-1 8 9-12h-7z'),
  cmd:P('M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z'),
  focus:'<circle cx="12" cy="12" r="3"/>'+P('M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3'),
  clock:'<circle cx="12" cy="12" r="9"/>'+P('M12 7v5l3 2'),
  prev:P('M15 5 8 12l7 7M6 5v14'),
  next:P('m9 5 7 7-7 7M18 5v14'),
};
const ic = (n, size = 14, cls = '') => `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const kb = k => `<kbd>${k === 'Enter' ? '↵' : k === 'Escape' ? 'esc' : k}</kbd>`;
const LOGO = '<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><g fill="none" stroke="var(--cyan)" stroke-width="2"><path d="M14 6v8M14 14l-7 8M14 14l7 8"/></g><circle cx="14" cy="6" r="4" fill="var(--cyan)"/><circle cx="7" cy="22" r="3.2" fill="var(--amber)"/><circle cx="21" cy="22" r="3.2" fill="var(--green)"/></svg>';

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cut = (text, length) => text.length > length ? text.slice(0, length - 1) + '…' : text;
const mins = iso => Math.max(0, Math.round((NOW - new Date(iso).getTime()) / 60000));
const dur = m => m < 60 ? m + 'm' : m < 1440 ? Math.floor(m/60) + 'h ' + String(m%60).padStart(2,'0') + 'm' : Math.floor(m/1440) + 'd ' + Math.floor(m%1440/60) + 'h';
const words = s => String(s).replace(/_/g, ' ');
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const durWords = m => m < 60 ? plural(m, 'minute') : plural(Math.floor(m / 60), 'hour');
const usd = n => '$' + n.toFixed(2);
const hhmm = iso => new Date(iso).toTimeString().slice(0,5);
const known = new Set(S.projects.map(p => p.id));
const inFilter = pid => ui.filter === 'all' || (ui.filter === 'other' ? !known.has(pid) : pid === ui.filter);
const pk = pid => known.has(pid) ? pid : 'other';
const ticketProject = text => { const m = /([A-Z]+)-\d+/.exec(text || ''); const id = m && m[1].toLowerCase(); return known.has(id) ? id : null; };
const tagName = pid => known.has(pid) ? pid : 'other';
const projectName = pid => (S.projects.find(project => project.id === pid) || {}).name || 'Other';
const same = (a, b) => !!a && !!b && a.type === b.type && a.id === b.id;
const parseSel = arg => { const i = arg.indexOf(':'); return { type: arg.slice(0, i), id: arg.slice(i + 1) }; };
const acShort = criterion => criterion.id.replace(/^.*-AC/, 'AC');

const needById = id => S.needsMe.find(need => need.id === id);
const runById = id => S.runs.find(run => run.id === id);
const runFor = ticket => S.runs.find(run => run.ticket === ticket);
const agentById = id => S.agents.find(agent => agent.id === id);
const ticketById = id => S.backlog.find(ticket => ticket.id === id);
const agentsOfRun = run => S.agents.filter(agent => agent.run === run.id);
const leadOf = run => agentsOfRun(run).find(agent => agent.role === 'run lead');
const chiefTerminal = pid => { const project = S.projects.find(item => item.id === pid); return project && project.masterChief.state === 'live' ? project.masterChief.terminal : null; };
// prototype shortcut: these needs-me items belong to an agent node, not a run node
const NEED_AGENT = {'stuck-ark170-validator':'term-170-val', 'inbox-docs':'term-docs'};
const runNeeds = (run, at = NOW) => S.needsMe.filter(need => need.ticket === run.ticket && !NEED_AGENT[need.id] && Date.parse(need.since) <= at);
const agentNeeds = (agent, at = NOW) => S.needsMe.filter(need => NEED_AGENT[need.id] === agent.id && Date.parse(need.since) <= at);

const KIND = {
  gate:{icon:'flag',tone:'needs',short:'Plannotator'},
  escalation:{label:'Escalation',icon:'alert',tone:'bad',short:'Decide'},
  mergeRequest:{label:'Merge request',icon:'merge',tone:'ok',short:'Open MR'},
  question:{label:'Question',icon:'help',tone:'waiting',short:'Answer'},
  stuckAgent:{label:'Stuck agent',icon:'pause',tone:'bad',short:'Orca'},
  approval:{label:'Approval',icon:'check',tone:'working',short:'Approve'},
  retro:{label:'Retro',icon:'refresh',tone:'idle',short:'Retro'},
};
const kindLabel = need => need.kind === 'gate' ? 'Gate · ' + need.gate : KIND[need.kind].label;
const PHASES = [['planning','Planning'],['awaiting_strategy','Strategy'],['building','Building'],['merge_requests_open','Merge'],['merged','Merged']];
const PHASE_LABEL = { planning:'planning', awaiting_strategy:'strategy gate', building:'building', escalation:'escalated', merge_requests_open:'MR open' };
const STEP_STATE = { succeeded:'ok', running:'working', pending:'idle', failed:'bad' };
const AGENT_STATE = { working:'working', waiting:'waiting', idle:'idle', stuck:'bad' };
const AC_STATE = { passing:'ok', failing:'bad', pending:'idle' };
function runState(run, at = NOW){
  if (ui.aborted[run.id]) return 'idle';
  if (ui.paused[run.id]) return 'waiting';
  if (run.phase === 'escalation') return 'bad';
  if (runNeeds(run, at).length) return 'needs';
  return ['building','planning'].includes(run.phase) ? 'working' : 'ok';
}
const agentState = (agent, at = NOW) => agent.state === 'stuck' ? 'bad' : agentNeeds(agent, at).length ? 'needs' : AGENT_STATE[agent.state];
const phaseLabel = run => ui.aborted[run.id] ? 'aborted' : ui.paused[run.id] ? 'paused' : PHASE_LABEL[run.phase] || words(run.phase);
const heat = st => st === 'needs' || st === 'bad' ? 'hot' : st === 'working' ? 'calm' : '';
const dot = st => `<i class="dot s-${st} ${heat(st)}"></i>`;
const pill = (st, text) => `<span class="pill s-${st}">${esc(text)}</span>`;
const countAC = run => ({ pass: run.criteria.filter(c => c.status === 'passing').length, fail: run.criteria.filter(c => c.status === 'failing').length });
const stepsDone = run => run.steps.filter(step => step.status === 'succeeded').length;

/* countdown: neutral under 30 min, amber under 2 h, red beyond */
const heatOf = m => m >= 120 ? 'hot' : m >= 30 ? 'warm' : '';
const waitHtml = m => (m >= 60 ? `${Math.floor(m / 60)}<small>h</small>${String(m % 60).padStart(2, '0')}<small>m</small>` : `${m}<small>min</small>`);
const waitBlock = (m, withAge) => `<span class="wait ${heatOf(m)}">${waitHtml(m)}${withAge ? `<i class="age" style="--w:${Math.min(100, m / 240 * 100).toFixed(1)}%"></i>` : ''}</span>`;

/* run story line, one sentence per run */
function story(run, long){
  const done = stepsDone(run), total = run.steps.length;
  const failing = run.criteria.filter(c => c.status === 'failing').map(acShort);
  const passing = run.criteria.filter(c => c.status === 'passing').length;
  const head = `<b>${esc(run.ticket)}</b>`;
  if (ui.aborted[run.id]) return `${head} was aborted.`;
  if (ui.paused[run.id]) return `${head} is paused after ${done} of ${total} steps.`;
  switch (run.phase){
    case 'awaiting_strategy': return `${head} is waiting for you to pick one of ${run.strategies.length} strategies.`;
    case 'planning': return `${head} is planning: ${long ? 'the plan is ready and waiting for your approval' : 'plan waiting for your approval'}.`;
    case 'building': return `${head} is building: ${done} of ${total} steps done${failing.length ? `, <b class="bad">${failing.join(', ')} failing</b>` : ''}.`;
    case 'escalation': return `${head} spent its round budget${long ? ` (${run.round} of ${run.roundBudget})` : ''}: ${done} of ${total} steps done, <b class="bad">${failing.join(', ')} still failing</b>.${long ? ' It needs a decision from you.' : ''}`;
    case 'merge_requests_open': return `${head} has ${run.mergeRequests.map(mr => `${esc(mr.repo)} #${mr.number}`).join(', ')} open: ${long ? `all ${total} steps done, ` : ''}${passing} of ${run.criteria.length} criteria passing. <b class="warn">Ready to merge.</b>`;
  }
  return `${head} is ${words(run.phase)}.`;
}

/* ---------- derived lists ---------- */
const needs = () => S.needsMe.filter(need => inFilter(need.project)).sort((a, b) => mins(b.since) - mins(a.since));
const runs = () => S.runs.filter(run => inFilter(run.project));
const tickets = () => S.backlog.filter(ticket => inFilter(ticketProject(ticket.id)));
const agents = () => S.agents.filter(agent => inFilter(agent.project));
const notes = () => S.notifications.map((note, i) => ({ ...note, i, project: ticketProject(note.text) })).filter(note => inFilter(note.project));
function results(){
  const terms = ui.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit = text => terms.every(term => text.toLowerCase().includes(term));
  const out = [];
  tickets().forEach(t => hit(`${t.id} ${t.title} ${words(t.status)} ticket`) && out.push({ type:'ticket', id:t.id, kind:'Ticket', name:t.id, title:t.title, meta:words(t.status) }));
  runs().forEach(r => hit(`${r.ticket} ${r.title} ${words(r.phase)} run ${r.id}`) && out.push({ type:'run', id:r.id, kind:'Run', name:r.ticket, title:r.title, meta:phaseLabel(r) }));
  agents().forEach(a => hit(`${a.name} ${a.role} ${a.model} ${a.harness} ${a.state} ${a.lastLine} agent`) && out.push({ type:'agent', id:a.id, kind:'Agent', name:a.role, title:a.name + ' — ' + a.lastLine, meta:a.state }));
  return out;
}
/* map order: same walk as the graph, so j/k follows what you see */
function mapOrder(){
  const out = [];
  ['ark','clara','other'].filter(key => ui.filter === 'all' || ui.filter === key).forEach(key => {
    if (key === 'other'){ S.agents.filter(a => !a.project).forEach(a => out.push({type:'agent', id:a.id})); return; }
    const project = S.projects.find(item => item.id === key);
    out.push({type:'project', id:key});
    if (project.masterChief.state === 'live') out.push({type:'agent', id:project.masterChief.terminal});
    S.runs.filter(run => run.project === key).forEach(run => { out.push({type:'run', id:run.id}); agentsOfRun(run).forEach(a => out.push({type:'agent', id:a.id})); });
  });
  return out;
}
function listFor(view){
  if (view === 'home') return [...needs().map(n => ({type:'need', id:n.id})), ...(ui.focus ? [] : runs().map(r => ({type:'run', id:r.id})))];
  if (view === 'map') return mapOrder();
  if (view === 'backlog') return ['proposed','ready','in_progress'].flatMap(st => tickets().filter(t => t.status === st)).map(t => ({type:'ticket', id:t.id}));
  if (view === 'agents') return agents().map(a => ({type:'agent', id:a.id}));
  if (view === 'search') return results().map(r => ({type:r.type, id:r.id}));
  if (view === 'projects') return S.projects.filter(p => inFilter(p.id)).map(p => ({type:'project', id:p.id}));
  if (view === 'notifications') return notes().map(n => ({type:'note', id:String(n.i)}));
  if (view === 'timeline') return timelineModel().filter(lane => lane.sel).map(lane => lane.sel);
  return [];
}

/* ---------- toasts ---------- */
function toast(msg, cmd){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<b>${esc(msg)}</b>${cmd ? `<code>${esc(cmd)}</code>` : ''}`;
  const box = $('#toasts');
  box.append(el);
  while (box.children.length > 3) box.firstChild.remove();
  requestAnimationFrame(() => el.classList.add('in'));
  const kill = () => { el.classList.remove('in'); setTimeout(() => el.remove(), 170); };
  el.addEventListener('click', kill);
  setTimeout(kill, 5200);
}
const wouldRun = cmd => toast('Would run:', cmd);
const orcaSwitch = term => wouldRun(`orca terminal switch --terminal ${term}`);
const orcaSend = (term, text) => wouldRun(`orca terminal send --terminal ${term} --text "${text}" --enter`);

/* ---------- actions per selection ---------- */
function actionsFor(sel){
  if (!sel) return [];
  if (sel.type === 'need'){
    const need = needById(sel.id); if (!need) return [];
    const run = need.ticket && runFor(need.ticket);
    const acts = [{ label:need.action.label, short:KIND[need.kind].short, key:need.action.key, primary:true, run:() => doNeed(need) }];
    if (run) acts.push({ label:'Open run', key:'Enter', run:() => openRun(run.id) });
    acts.push({ label:'Ask Master Chief', key:'c', run:() => focusComposer(need.project || 'ark', need.ticket ? `Re ${need.ticket}: ` : '') });
    return acts;
  }
  if (sel.type === 'run'){
    const run = runById(sel.id); if (!run) return [];
    const plan = { label:'Open plan in Plannotator', key:'p', run:() => toast('Would open Plannotator review', `plan.md for ${run.ticket} · ${run.id}`) };
    if (ui.aborted[run.id]) return [plan];
    return [
      { label:'Message run lead', key:'m', run:() => messageDialog(run) },
      { label: ui.paused[run.id] ? 'Resume' : 'Pause', key:'s', run:() => togglePause(run) },
      { label:'Open in Orca', key:'o', run:() => orcaRun(run) },
      plan,
      { label:'Abort', key:'x', danger:true, run:() => abortDialog(run) },
    ];
  }
  if (sel.type === 'agent'){
    const agent = agentById(sel.id); if (!agent) return [];
    const acts = [{ label:'Open in Orca', key:'o', primary:true, run:() => orcaSwitch(agent.id) }];
    acts.push(agent.role === 'chief'
      ? { label:'Message Master Chief', key:'m', run:() => focusComposer(agent.project) }
      : { label:'Message agent', key:'m', run:() => messageDialog(null, agent) });
    if (agent.run) acts.push({ label:'Open run', key:'Enter', run:() => openRun(agent.run) });
    return acts;
  }
  if (sel.type === 'ticket'){
    const ticket = ticketById(sel.id); if (!ticket) return [];
    const run = runFor(ticket.id);
    if (ticket.status === 'proposed') return [{ label:'Approve and queue', key:'a', primary:true, run:() => approve(ticket.id) }];
    if (ticket.status === 'ready') return [{ label:'Queue run', key:'q', primary:true, run:() => { const open = ticket.dependsOn.map(ticketById).filter(d => d.status !== 'done'); orcaSend(chiefTerminal(ticketProject(ticket.id)) || 'term-ark-chief', `Start a run for ${ticket.id}${open.length ? ' once ' + open.map(d => d.id).join(', ') + ' is merged' : ''}`); } }];
    return run ? [{ label:'Open run', key:'Enter', run:() => openRun(run.id) }] : [];
  }
  if (sel.type === 'project'){
    const project = S.projects.find(item => item.id === sel.id); if (!project) return [];
    if (project.masterChief.state !== 'live') return [{ label:'Spawn Master Chief', key:'s', primary:true, run:() => spawnChief(project.id) }];
    return [
      { label:'Message Master Chief', key:'m', primary:true, run:() => focusComposer(project.id) },
      { label:'Open in Orca', key:'o', run:() => orcaSwitch(project.masterChief.terminal) },
    ];
  }
  if (sel.type === 'note'){
    const note = S.notifications[+sel.id]; if (!note) return [];
    const ticket = (/([A-Z]+-\d+)/.exec(note.text) || [])[1];
    const need = ticket && S.needsMe.find(item => item.ticket === ticket);
    const run = ticket && runFor(ticket);
    const acts = [];
    if (need) acts.push({ label:'Show in Needs me', key:'Enter', primary:true, run:() => { setView('home'); select({type:'need', id:need.id}); } });
    else if (run) acts.push({ label:'Open run', key:'Enter', primary:true, run:() => { setView('home'); select({type:'run', id:run.id}); } });
    if (!note.handled) acts.push({ label:'Mark handled', key:'h', run:() => { note.handled = true; toast('Marked handled', note.text); renderAll(); } });
    return acts;
  }
  return [];
}
function runKey(e){
  const act = actionsFor(cur()).find(a => a.key === e.key && a.key !== 'Enter');
  if (!act) return false;
  e.preventDefault(); act.run(); return true;
}

/* ---------- need actions ---------- */
function doNeed(need){
  switch (need.kind){
    case 'gate': return toast('Would open Plannotator review', `${need.ticket} · ${need.gate} gate`);
    case 'escalation': return escalationDialog(need);
    case 'mergeRequest': return toast('Would open merge request', need.url);
    case 'question': return toast('Would open Plannotator Inbox', 'docs-site refactor · keep old URLs as redirects?');
    case 'stuckAgent': return orcaSwitch(NEED_AGENT[need.id]);
    case 'approval': return approve(need.ticket);
    case 'retro': return toast('Would open Plannotator retro', `${need.ticket} · 3 close questions, 2 proposals`);
  }
}
function approve(ticketId){
  const ticket = ticketById(ticketId); if (!ticket || ticket.status !== 'proposed') return;
  const commit = () => {
    ticket.status = 'ready';
    const stale = S.needsMe.filter(need => need.kind === 'approval' && need.ticket === ticketId);
    const index = listFor(ui.view).findIndex(item => same(item, cur()));
    S.needsMe = S.needsMe.filter(need => !stale.includes(need));
    const sel = cur();
    if (sel && sel.type === 'need' && stale.some(need => need.id === sel.id)){ const list = listFor(ui.view); setCur(list[Math.min(index, list.length - 1)] || null); }
    renderAll();
  };
  orcaSend(chiefTerminal(ticketProject(ticketId)) || 'term-ark-chief', `Approve and queue ${ticketId}`);
  const row = document.querySelector(`[data-sel="need:approve-${ticketId.toLowerCase()}"]`);
  if (row && ui.view === 'home'){ row.classList.add('leaving'); setTimeout(commit, 150); } else commit();
}
function togglePause(run){
  ui.paused[run.id] = !ui.paused[run.id];
  const lead = leadOf(run);
  orcaSend(lead ? lead.id : chiefTerminal(run.project), ui.paused[run.id] ? 'Pause after the current step' : 'Resume');
  renderAll();
}
function orcaRun(run){
  const lead = leadOf(run);
  if (lead) orcaSwitch(lead.id); else toast('No live run lead for ' + run.ticket, 'Would run: orca terminal switch --terminal ' + (chiefTerminal(run.project) || 'term-ark-chief'));
}
function spawnChief(pid){
  const project = S.projects.find(item => item.id === pid);
  wouldRun(`ark chief spawn --project ${pid} --workspace ${project.workspace}`);
}

          }

          }

      } else {

}

/* linked path: every node on the selection's path lights up, the rest dims */
function tokensOf(sel){
  const tokens = new Set();
  if (!sel) return tokens;
  const addProject = pid => { if (pid){ tokens.add('project:' + pid); tokens.add('chief:' + pid); } };
  const addRun = run => { tokens.add('run:' + run.id); agentsOfRun(run).forEach(agent => tokens.add('agent:' + agent.id)); addProject(run.project); };
  const addAgent = agent => { tokens.add('agent:' + agent.id); if (agent.run){ tokens.add('run:' + agent.run); addProject(runById(agent.run).project); } else addProject(known.has(agent.project) ? agent.project : 'other'); };
  const addWholeProject = pid => {
    addProject(pid);
    if (pid === 'other') S.agents.filter(agent => !known.has(agent.project)).forEach(agent => tokens.add('agent:' + agent.id));
    else S.runs.filter(run => run.project === pid).forEach(addRun);
  };
  if (sel.type === 'run'){ const run = runById(sel.id); if (run) addRun(run); }
  else if (sel.type === 'agent'){ const agent = agentById(sel.id); if (agent) agent.role === 'chief' ? addWholeProject(agent.project) : addAgent(agent); }
  else if (sel.type === 'project') addWholeProject(sel.id);
  else if (sel.type === 'need'){
    const need = needById(sel.id); if (!need) return tokens;
    const run = need.ticket && runFor(need.ticket);
    if (NEED_AGENT[need.id]) addAgent(agentById(NEED_AGENT[need.id]));
    else if (run) addRun(run);
    else addProject(ticketProject(need.ticket) || need.project);
  }
  return tokens;
}
// one sentence for whatever the graph is following
function captionFor(sel){
  if (!sel) return `Pick a node, or press ${kb('j')}${kb('k')}, to light its path. ${kb('v')} toggles dimming.`;
  const need = sel.type === 'need' ? needById(sel.id) : null;
  const agent = sel.type === 'agent' ? agentById(sel.id) : need && NEED_AGENT[need.id] ? agentById(NEED_AGENT[need.id]) : null;
  const run = sel.type === 'run' ? runById(sel.id) : agent ? runById(agent.run) : need ? runFor(need.ticket) : null;
  if (run) return story(run, true);
  if (agent) return `<b>${esc(agent.name)}</b> is ${agent.state}: <span class="mono">${esc(agent.lastLine)}</span>`;
  if (need) return `<b>${esc(need.ticket || need.source)}</b> ${esc(need.title)}`;
  const project = sel.type === 'project' && S.projects.find(item => item.id === sel.id);
  return project ? `<b>${project.name}</b> has ${plural(S.runs.filter(run => run.project === project.id).length, 'live run')}. Master Chief is ${project.masterChief.state}.` : '';
}

/* replay: scrub the map back through the time since you last looked */

  const events = [];

  S.needsMe.filter(need => inFilter(need.project)).forEach(need => events.push({ at:Date.parse(need.since), kind:'need', text:`${kindLabel(need)} opened${need.ticket ? ' · ' + need.ticket : ''}` }));

  const at = asOf(), events = replayEvents();

  if (direction > 0 && !target) return setReplay(spanMinutes());
  if (target) setReplay(Math.round((target.at - SINCE) / 60000));
}

function blocksOf(list, run){

function blockHtml(block, nested){

  const left = (from - start) / (hours * HOUR) * 100, width = (to - from) / (hours * HOUR) * 100;
  const fits = text => width / 100 * trackWidthPx() >= text.length * (nested ? 6.4 : 6.8) + 14;

// cumulative cost curve: cost accrues only while agents work (the split over time is invented)
function burnHtml(blocks, cost){
  const weight = block => block.kind === 'work' ? 1 : block.kind === 'fail' ? .6 : block.kind === 'stall' ? .15 : block.thin ? .04 : 0;
  const parts = blocks.map(block => ({ from:block.from, to:block.to, weight:weight(block) })).filter(part => part.weight);
  const total = parts.reduce((sum, part) => sum + part.weight * (part.to - part.from), 0);
  if (!total) return '';
  const cumulative = at => parts.reduce((sum, part) => sum + part.weight * Math.max(0, Math.min(part.to, at) - part.from), 0) / total;
  const hours = ui.tl.hours, start = NOW - hours * HOUR;
  const times = [start, ...parts.flatMap(part => [part.from, part.to]).filter(at => at > start && at < NOW), NOW].sort((a, b) => a - b);
  const points = times.map(at => [((at - start) / (hours * HOUR) * 1000).toFixed(1), (13 - cumulative(at) * 12).toFixed(1)]);

// where the time went: working vs waiting on you vs the rest, from a lane's (invented) blocks
function timeSplit(blocks){
  const total = kinds => blocks.filter(block => kinds.includes(block.kind)).reduce((sum, block) => sum + (block.to - block.from), 0) / 60000;
  const parts = [['Working', 'var(--cyan)', total(['work'])], ['Waiting on you', 'var(--amber)', total(['gate'])], ['Waiting on CI or paused', 'var(--violet)', total(['wait'])], ['Stalled', 'var(--red)', total(['stall'])]]
    .filter(part => part[2] > 0).map(([label, color, minutes]) => [label, color, Math.round(minutes)]);
  if (!parts.length) return '<div class="muted">No tracked time yet.</div>';
  const all = parts.reduce((sum, part) => sum + part[2], 0);
  const summary = parts.map(([label, , minutes]) => `${label} ${dur(minutes)}`).join(', ');
  return `<div class="split" role="img" aria-label="Time split: ${summary}">${parts.map(([label, color, minutes]) => `<i style="--c:${color};flex:${minutes}" title="${label} ${dur(minutes)}"></i>`).join('')}</div>
    <div class="split-l">${parts.map(([label, color, minutes]) => `<span class="sw" style="--c:${color}"></span><span>${label}</span><span class="v">${dur(minutes)} · ${Math.round(minutes / all * 100)}%</span>`).join('')}</div>
    <div class="hint" style="margin-top:8px">Prototype data: timings are invented from the start time and the wait starts.</div>`;
}
function timeSplitSection(run){
  const blocks = blocksOf((TIMELINE_HISTORY[run.id] || {}).phases, run);
  return blocks.length ? `<section class="d-sec"><h3>Where the time went</h3>${timeSplit(blocks)}</section>` : '';
}

// lane model: one lane per Master Chief, run, standalone agent, plus waiting-only items
function timelineModel(){
  const model = [];
  const phasesOf = key => blocksOf((TIMELINE_HISTORY[key] || {}).phases);
  S.projects.forEach(project => {
    if (!inFilter(project.id)) return;
    const chief = project.masterChief;
    if (chief.state === 'live'){
      const agent = agentById(chief.terminal);
      model.push({ sel:{type:'agent', id:chief.terminal}, state:'ok', badge:'Master Chief', tag:tagName(project.id), label:`${project.name} Master Chief`, story:`<span class="nm">${project.name} Master Chief</span> is ${agent.state} on ${chief.model} since ${hhmm(chief.since)}: ${esc(agent.lastLine)}`, meta:usd(agent.costUsd), phases:phasesOf('chief:' + project.id), cost:agent.costUsd, burn:true });
    } else {
      model.push({ sel:{type:'project', id:project.id}, state:'needs', badge:'no Master Chief', tag:tagName(project.id), label:`${project.name} has no Master Chief`, story:`<span class="nm">${project.name}</span> has no Master Chief. Nothing steers its runs until you spawn one.`, meta:'', phases:[],
        extra:`<button class="tm-block ghost" style="left:0;right:0" data-act="spawn" data-arg="${project.id}">${ic('plus', 11)}No Master Chief · Spawn Master Chief</button>` });
    }
    S.runs.filter(run => run.project === project.id).forEach(run => {
      const history = TIMELINE_HISTORY[run.id] || {};
      model.push({ sel:{type:'run', id:run.id}, state:runState(run), badge:phaseLabel(run), tag:tagName(run.project), label:run.title, story:story(run), meta:`r${run.round}/${run.roundBudget} · ${usd(run.costUsd)}`, phases:blocksOf(history.phases, run), workers:blocksOf(history.workers, run), cost:run.costUsd, burn:true });
    });
    S.needsMe.filter(need => need.project === project.id && TIMELINE_HISTORY['need:' + need.id]).sort((a, b) => mins(b.since) - mins(a.since)).forEach(need => {
      const sentence = need.kind === 'retro' ? `<b>${need.ticket}</b> merged last night. Its retro waits for you.` : `<b>${need.ticket}</b> is only proposed. It does not start until you approve it.`;
      model.push({ sel:{type:'need', id:need.id}, state:KIND[need.kind].tone, badge:kindLabel(need), tag:tagName(need.project), label:need.title, story:sentence, meta:need.kind === 'retro' ? 'finished' : 'no run yet', phases:phasesOf('need:' + need.id) });
    });
  });
  const loose = S.agents.filter(agent => !known.has(agent.project));
  if (loose.length && (ui.filter === 'all' || ui.filter === 'other')){
    model.push({ group:'Other · standalone agents, no Master Chief' });
    loose.forEach(agent => model.push({ sel:{type:'agent', id:agent.id}, state:agentState(agent), badge:agent.state, tag:'other', label:agent.name, story:`<span class="nm">${esc(agent.name)}</span> is ${agent.state}: ${esc(agent.lastLine)}`, meta:usd(agent.costUsd), phases:phasesOf('agent:' + agent.id), cost:agent.costUsd, burn:true }));
  }
  return model;
}
function laneHtml(lane){
  if (lane.group) return `<li class="tm-lane group" aria-hidden="true">${lane.group}</li>`;
  const key = lane.sel.type + ':' + lane.sel.id;
  const workers = (lane.workers || []).map(block => blockHtml(block, true)).join('');
  return `<li class="tm-lane ${isCursor(lane.sel.type, lane.sel.id) ? 'cursor' : ''}" data-sel="${key}" data-act="sel" data-arg="${key}">
    <button class="tm-lane-head" data-act="sel" data-arg="${key}" title="${esc(lane.label)}">${staticDot(lane.state)}<span class="tm-story">${lane.story}</span><span class="tm-meta">${lane.meta}</span></button>
    <div class="tm-track">${lane.phases.map(block => blockHtml(block)).join('')}${lane.extra || ''}</div>
    ${workers ? `<div class="tm-track nested">${workers}</div>` : ''}${ui.tl.burn && lane.burn ? burnHtml(lane.phases, lane.cost) : ''}</li>`;
}
function renderTimeline(){
  const model = timelineModel();
  const hours = ui.tl.hours, start = NOW - hours * HOUR, stepMs = { 1:10, 12:120, 24:240 }[hours] * 60000;
  const midnight = new Date(start).setHours(0, 0, 0, 0);
  const ticks = [];
  for (let at = midnight + Math.ceil((start - midnight) / stepMs) * stepMs; at < NOW; at += stepMs){
    const percent = (at - start) / (hours * HOUR) * 100;
    if (percent > 4 && percent < 90) ticks.push({ at, percent });
  }
  const zoom = [[1, '1h'], [12, '12h'], [24, '24h']].map(([count, label]) => `<button data-act="zoom" data-arg="${count}" aria-pressed="${hours === count}">${label}</button>`).join('');
  const legend = [['work', 'working', ''], ['gate', 'waiting on you, darker = longer', 'hatch'], ['stall', 'stalled', 'dash'], ['fail', 'failed', ''], ['ok', 'done', ''], ['wait', 'CI wait or paused', '']]
    .map(([kind, label, extra]) => `<span><i class="${extra}" style="--c:var(--${{ work:'cyan', gate:'amber', stall:'red', fail:'red', ok:'green', wait:'violet' }[kind]})"></i>${label}</span>`).join('');
  return `<section class="panel tm-panel" aria-label="Timeline"><header><h2>Timeline</h2><span class="count plain">${model.filter(lane => lane.sel).length}</span>
      <div class="tm-zoom" role="group" aria-label="Time window, last N hours">${zoom}</div>${kb('w')}
      <button class="btn sm" data-act="burn" aria-pressed="${ui.tl.burn}" title="Draw each lane's cost so far as a line">Cost burn${kb('b')}</button>
      <span class="spacer"></span><span class="proto-note" title="Only start times and wait starts come from the data. Every other past timing here is invented prototype data.">${ic('clock', 12)}prototype data: invented timings</span></header>
    <div class="tm-scroll" id="tmscroll"><div class="tm-inner">
      <div class="tm-axis"><div class="tm-axis-in">${ticks.map(tick => `<span class="tm-tick" style="left:${tick.percent.toFixed(2)}%">${hhmm(tick.at)}</span>`).join('')}<span class="tm-now">now ${hhmm(NOW)}</span></div></div>
      <div class="tm-grid" aria-hidden="true">${ticks.map(tick => `<i style="left:${tick.percent.toFixed(2)}%"></i>`).join('')}<i class="nowline"></i></div>
      ${model.length ? `<ul class="tm-lanes" aria-label="Swimlanes, one per Master Chief, run and standalone agent">${model.map(laneHtml).join('')}</ul>` : '<div class="empty">No lanes in this scope.</div>'}
    </div></div>
    <div class="tm-foot" aria-label="Legend">${legend}</div></section>`;
}
function setZoom(hours){ ui.tl.hours = hours; if (ui.view === 'timeline') renderAll(); else setView('timeline'); }
function cycleZoom(){ const order = [1, 12, 24]; setZoom(order[(order.indexOf(ui.tl.hours) + 1) % order.length]); }

// click a waiting block: select its lane, then do what the Needs me row would do
function openBlock(id){
  const need = needById(id); if (!need) return;
  const lane = timelineModel().find(item => item.sel && [...item.phases, ...(item.workers || [])].some(block => block.need && block.need.id === id));
  if (lane) select(lane.sel);
  doNeed(need);
}
function blockRows(blocks){
  return blocks.map(block => {
    const name = esc(block.title || block.label || 'working');
    const label = block.need ? `<button class="link" data-act="block" data-arg="${block.need.id}" title="${esc(block.need.action.label)}">${name}</button>` : name;
    return `<tr><td><span class="st">${staticDot(BLOCK_STATE[block.kind])}${label}</span></td><td class="mono">${hhmm(block.from)}–${block.current ? 'now' : hhmm(block.to)}</td><td class="r mono">${dur(Math.round((block.to - block.from) / 60000))}</td></tr>`;
  }).join('');
}
function askRow(need){
  const kind = KIND[need.kind];
  return `<button class="tm-ask s-${kind.tone}" data-act="block" data-arg="${need.id}" title="${esc(need.action.label)}"><span class="kind">${ic(kind.icon, 13)}${esc(kindLabel(need))}</span><span class="ttl">${esc(need.ticket ? need.ticket + ' · ' : '')}${esc(need.title)}</span>${waitBlock(mins(need.since), false)}</button>`;
}
// the timeline's own detail pane: nothing selected lists what is blocked on you, a lane shows its history
function timelineDetail(){
  const model = timelineModel();
  const lane = model.find(item => item.sel && same(item.sel, ui.tl.sel));
  if (!lane){
    ui.tl.sel = null; ui.acts = [];
    const asks = new Map();
    model.forEach(item => item.sel && [...item.phases, ...(item.workers || [])].forEach(block => { if (block.need) asks.set(block.need.id, block); }));
    const sorted = [...asks.values()].sort((a, b) => b.wait - a.wait);
    return `<div class="d-head"><h2>Timeline</h2><p class="d-note">One lane per Master Chief, run and standalone agent. Walk lanes with ${kb('j')}${kb('k')} or click a lane to see where its time went.</p></div>
      <section class="d-sec"><h3>Waiting on you<span class="r muted">longest first · click to act</span></h3>${sorted.length ? sorted.map(block => askRow(block.need)).join('') : '<div class="muted">Nothing is blocked on you in this scope.</div>'}</section>
      <section class="d-sec"><div class="hint">Prototype data: only start times and wait starts are real, the rest of each lane is invented.</div></section>`;
  }
  const table = (title, blocks) => blocks.length ? `<section class="d-sec"><h3>${title}</h3><table class="t"><thead><tr><th>Block</th><th>When</th><th class="r">Length</th></tr></thead><tbody>${blockRows(blocks)}</tbody></table></section>` : '';
  return `<div class="d-head"><div class="d-id">${pill(lane.state, lane.badge)}<span class="tag">${lane.tag}</span></div><h2>${esc(lane.label)}</h2><p class="d-story">${lane.story}</p>${actionBar(actionsFor(lane.sel))}</div>
    <section class="d-sec"><h3>Where the time went</h3>${timeSplit(lane.phases)}</section>
    ${table('Blocks', lane.phases)}${table('Workers', lane.workers || [])}`;
}
