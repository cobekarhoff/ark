function renderMetrics(){
  const w = S.metrics.week, days = S.metrics.costByDay;
  const cells = [
    ['Runs started', w.runs, 'this week'], ['Merged', w.merged, Math.round(w.merged / w.runs * 100) + '% of runs'], ['Aborted', w.aborted, ''], ['Design rounds', w.designRounds, ''],
    ['Cost', usd(w.costUsd), usd(w.costUsd / w.runs) + ' per run'], ['Median wall time', dur(w.medianWallMinutes), 'per run'],
    ['Waiting at gates', dur(w.gateWaitMinutes), Math.round(w.gateWaitMinutes / w.runs) + ' min per run'], ['Override rate', Math.round(w.overrideRate * 100) + '%', 'plan decisions you changed'],
  ].map(([label, value, note]) => `<div><b>${value}</b><span>${label}</span><small>${note || '&nbsp;'}</small></div>`).join('');
  const max = 20, W = 780, H = 220, L = 34, B = 26, T = 16, bw = (W - L) / days.length;
  const day = i => new Date(NOW - (days.length - 1 - i) * 864e5);
  const bars = days.map((v, i) => {
    const h = v / max * (H - B - T), x = L + i * bw + bw * .2, y = H - B - h, today = i === days.length - 1, d = day(i);
    return `<rect x="${x}" y="${y}" width="${bw * .6}" height="${Math.max(h, 1)}" rx="4" fill="${today ? 'var(--cyan)' : 'color-mix(in oklab,var(--text) 22%,var(--line))'}"/>
      <text class="val ${today ? 'today' : ''}" x="${x + bw * .3}" y="${y - 6}" text-anchor="middle">${usd(v).replace('.00', '')}</text>
      <text class="${today ? 'today' : ''}" x="${x + bw * .3}" y="${H - 8}" text-anchor="middle">${d.toLocaleDateString('en-GB', { weekday:'short' })} ${d.getDate()}</text>`;
  }).join('');
  const grid = [0, 5, 10, 15, 20].map(v => { const y = H - B - v / max * (H - B - T); return `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line-soft)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }).join('');
  return `<div class="sec-h"><h2>This week</h2><span class="hint">all projects, last 7 days</span></div><div class="metrics">${cells}</div>
    <div class="sec-h"><h2>Cost by day</h2><span class="hint">USD, today highlighted</span></div>
    <div class="panel" style="padding:10px 12px"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cost by day in USD: ${days.join(', ')}">${grid}${bars}</svg></div>`;
}

/* small per-run step graph: run, steps (I/V/R), merge request */
function stepGraph(run){
  const st = runState(run), gap = 52, first = 112;
  const items = run.steps.length
    ? run.steps.map(step => ({ label:step.id, letter:step.role[0].toUpperCase(), st:STEP_STATE[step.status], hot:step.status === 'running' ? 'calm' : '', title:`${step.id} · ${step.role} · ${step.status}` }))
    : (run.strategies || []).map(s => ({ label:'', letter:s.id, st:'needs', hot:s.recommended ? 'hot' : '', title:`Strategy ${s.id}: ${s.name}` }));
  const cy = 22;
  let edges = '', nodes = '', last = 84;
  const hotRun = heat(st);
  nodes += `<g class="node s-${st}">${hotRun ? `<rect class="ping ${hotRun}" x="1" y="${cy - 15}" width="83" height="30" rx="8" style="--s:1.2"/>` : ''}<rect class="body" x="1" y="${cy - 15}" width="83" height="30" rx="8"/>${svgText(42, cy + 4.5, run.ticket, 'm b', 'middle')}</g>`;
  items.forEach((item, i) => {
    const cx = first + i * gap;
    edges += `<path class="edge s-${item.st}" d="M${last},${cy} H${cx - 13}"/>`;
    nodes += `<g class="node s-${item.st}"><title>${esc(item.title)}</title>${item.hot ? `<circle class="ping ${item.hot}" cx="${cx}" cy="${cy}" r="13" style="--s:1.7"/>` : ''}<circle class="body" cx="${cx}" cy="${cy}" r="13"/>${svgText(cx, cy + 4.5, item.letter, 'm b', 'middle')}${item.label ? svgText(cx, cy + 27 + (i % 2) * 11, cut(item.label, 12), 'm sub', 'middle') : ''}</g>`;
    last = cx + 13;
  });
  if (!items.length) { edges += `<path class="edge s-idle dashed" d="M${last},${cy} H${first - 13}"/>`; nodes += `<circle cx="${first}" cy="${cy}" r="13" fill="none" stroke="var(--idle)" stroke-dasharray="4 4"/>` + svgText(first + 22, cy + 4, 'plan not approved: no steps yet', 'note'); }
  run.mergeRequests.forEach(mr => {
    const x = last + 20;
    edges += `<path class="edge s-${st}" d="M${last},${cy} H${x}"/>`;
    nodes += `<g class="node s-${st}"><rect class="body" x="${x}" y="${cy - 15}" width="80" height="30" rx="8"/>${svgText(x + 40, cy + 4.5, `MR #${mr.number}`, 'm b', 'middle')}</g>`;
  });
  return `<svg class="stepg" viewBox="0 0 380 72" role="img" aria-label="Step graph for ${run.ticket}: ${run.steps.map(s => s.id + ' ' + s.status).join(', ') || 'no steps yet'}">${edges}${nodes}</svg>`;
}
function runSections(run){
  const idx = run.phase === 'escalation' ? 2 : Math.max(0, PHASES.findIndex(p => p[0] === run.phase));
  const st = runState(run);
  const timeline = `<ol class="tl s-${st}" aria-label="Phase timeline">${PHASES.map(([id, label], i) => `<li class="${i < idx ? 'done' : i === idx ? 'now' : ''}" ${i === idx ? 'aria-current="step"' : ''}><i></i>${run.phase === 'escalation' && i === idx ? 'Escalated' : label}</li>`).join('')}</ol>`;
  const sec = (title, body, extra = '') => `<section class="d-sec"><h3>${title}${extra}</h3>${body}</section>`;
  const steps = run.steps.length ? `<table class="t"><thead><tr><th>Step</th><th>Role</th><th>Status</th></tr></thead><tbody>${run.steps.map(step => `<tr><td class="mono">${step.id}</td><td>${step.role}</td><td><span class="st">${dot(STEP_STATE[step.status])}${step.status}</span></td></tr>`).join('')}</tbody></table>` : `<div class="muted">No steps yet. The plan is not approved.</div>`;
  const ac = countAC(run);
  const criteria = run.criteria.length ? `<div class="acbar" aria-hidden="true">${run.criteria.map(c => `<i class="${c.status}"></i>`).join('')}</div>
    <table class="t"><thead><tr><th>Criterion</th><th>Status</th><th class="r">Proof</th></tr></thead><tbody>${run.criteria.map(c => `<tr><td class="mono">${c.id.replace(run.ticket + '-', '')}</td><td><span class="st">${dot(AC_STATE[c.status])}${c.status}</span></td><td class="r">${c.status === 'pending' ? '<span class="faint">not run</span>' : `<button class="link" data-act="proof" data-arg="${c.id}|${c.status}">${c.status === 'passing' ? 'test run' : 'failure log'}</button>`}</td></tr>`).join('')}</tbody></table>` : `<div class="muted">No acceptance criteria yet.</div>`;
  const strategies = (run.strategies || []).length ? sec('Strategy cards', run.strategies.map(s => `<div class="strat ${s.recommended ? 'rec' : ''}"><span class="letter">${s.id}</span><div><div class="nm">${esc(s.name)}</div><div class="mk2">mockups/${s.id}.html${s.recommended ? ' · <span style="color:var(--amber)">recommended</span>' : ''}</div></div><div class="bt"><button class="btn sm" data-act="mockup" data-arg="${run.ticket}|${s.id}">Open mockup</button><button class="btn sm ${s.recommended ? 'primary s-needs' : ''}" data-act="choose" data-arg="${run.ticket}|${s.id}|${esc(s.name)}">Choose ${s.id}</button></div></div>`).join('')) : '';
  const list = agentsOfRun(run);
  const mrs = run.mergeRequests.length ? sec('Merge requests', run.mergeRequests.map(mr => `<div class="chain">${dot(mr.state === 'open' ? 'needs' : 'idle')}<span class="mono">${mr.repo} #${mr.number}</span><span class="muted">${mr.state}</span><button class="link" data-act="mr" data-arg="${mr.url}">Open on GitHub</button></div>`).join('')) : '';
  return sec('Phase', timeline + `<div class="d-meta">${phaseLabel(run)} · round ${run.round} of ${run.roundBudget}</div>`)
    + timeSplitSection(run)
    + sec('Run graph', stepGraph(run), `<span class="r muted">${run.steps.length ? stepsDone(run) + ' of ' + run.steps.length + ' steps done' : ''}</span>`)
    + strategies
    + sec('Steps', steps)
    + sec('Acceptance criteria', criteria, `<span class="r"><span style="color:var(--green)">${ac.pass} pass</span> · <span style="color:${ac.fail ? 'var(--red)' : 'var(--faint)'}">${ac.fail} fail</span></span>`)
    + mrs
    + sec('Agents', agentRows(list, 'No live agents. The run is waiting on merge requests.'), `<span class="r muted">${usd(list.reduce((s, a) => s + a.costUsd, 0))} live agents</span>`);
}
function runDetail(run){

function needNote(need, run){

/* ---------- hover preview of an agent's last output ---------- */
let peekTimer = 0, peekWarm = 0;
function peekAgents(spec){
  const sel = parseSel(spec);
  if (sel.type === 'agent') return { title:'Last output', list:[agentById(sel.id)] };
  if (sel.type === 'run'){ const run = runById(sel.id); return { title:'Last output from agents on ' + run.ticket, list:agentsOfRun(run) }; }
  if (sel.type === 'need'){
    const need = needById(sel.id), run = need && need.ticket && runFor(need.ticket);
    if (NEED_AGENT[need.id]) return { title:'Last output', list:[agentById(NEED_AGENT[need.id])] };
    if (run) return { title:'Last output from agents on ' + run.ticket, list:agentsOfRun(run) };
  }
  return null;
}
function showPeek(el){
  const info = peekAgents(el.dataset.peek);
  if (!info || !info.list.length) return;
  const box = $('#peek');
  box.innerHTML = `<h4>${esc(info.title)}</h4>` + info.list.map(agent => `<div class="pa"><div class="pn">${dot(agentState(agent))}${esc(agent.name)}<span class="muted">${agent.state} · ${agent.harness} ${agent.model}</span></div><div class="po">${esc(agent.lastLine)}</div></div>`).join('');
  const anchor = el.closest('li') || el, rect = anchor.getBoundingClientRect();
  box.style.left = Math.max(8, Math.min(innerWidth - 408, rect.left + (anchor.tagName === 'LI' ? 150 : 0))) + 'px';
  box.style.top = '0px';
  const height = box.offsetHeight;
  box.style.top = (rect.bottom + 6 + height > innerHeight - 8 ? Math.max(8, rect.top - height - 6) : rect.bottom + 6) + 'px';
  box.classList.toggle('instant', Date.now() - peekWarm < 700);
  box.classList.add('in');
}
function hidePeek(){ clearTimeout(peekTimer); const box = $('#peek'); if (box.classList.contains('in')){ box.classList.remove('in'); peekWarm = Date.now(); } }
function schedulePeek(el){
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => showPeek(el), Date.now() - peekWarm < 700 ? 0 : 320);
}

/* ---------- selection & navigation ---------- */
function paintCursor(){
  const sel = cur(), key = sel && sel.type + ':' + sel.id;
  document.querySelectorAll('[data-sel]').forEach(el => {
    const on = el.dataset.sel === key;
    el.classList.toggle('cursor', on);
    if (on) el.scrollIntoView({ block:'nearest' });
  });
}
function select(sel, keepPrev){

}
// a Needs me badge sits on a graph node; walking the map continues from that node
function nodeOf(sel){
  if (!sel || sel.type !== 'need') return sel;
  const need = needById(sel.id); if (!need) return null;
  if (NEED_AGENT[need.id]) return {type:'agent', id:NEED_AGENT[need.id]};
  const run = need.ticket && runFor(need.ticket);
  return run ? {type:'run', id:run.id} : {type:'project', id:ticketProject(need.ticket) || need.project};
}
function move(delta){
  const list = listFor(ui.view); if (!list.length) return;
  const here = ui.view === 'map' ? nodeOf(cur()) : cur();
  let i = list.findIndex(item => same(item, here));
  i = i < 0 ? (delta > 0 ? 0 : list.length - 1) : Math.max(0, Math.min(list.length - 1, i + delta));
  ui.prev = null; select(list[i]);
}
function setView(view){
  ui.view = view; ui.prev = null;
  if (view !== 'timeline') ui.sel = view === 'map' ? null : listFor(view)[0] || null;
  renderAll();
  $('#main').scrollTop = 0;
  if (view === 'search') $('#q').focus();
}
function setFilter(filter){
  ui.filter = filter; ui.prev = null;
  if (ui.view === 'timeline'){ if (ui.tl.sel && !listFor('timeline').some(item => same(item, ui.tl.sel))) ui.tl.sel = null; }
  else ui.sel = ui.view === 'map' ? null : listFor(ui.view)[0] || null;
  if (known.has(filter)) ui.chiefProject = filter;
  renderAll();
}
function setTheme(theme){ ui.theme = theme; document.documentElement.dataset.theme = theme; renderAll(); }
function toggleFocus(){
  if (ui.view !== 'home') ui.view = 'home';
  ui.focus = !ui.focus; ui.prev = null;
  if (ui.focus && !(ui.sel && ui.sel.type === 'need')) ui.sel = listFor('home')[0] || null;

}
function openSelection(){
  const sel = cur();
  const act = actionsFor(sel).find(a => a.key === 'Enter');

  const need = sel && sel.type === 'need' && needById(sel.id);
  if (need) doNeed(need);

/* ---------- composer ---------- */
function syncComposer(){
  const select = $('#cproj'), current = select.value || ui.chiefProject;
  select.innerHTML = S.projects.map(project => `<option value="${project.id}" ${project.id === current ? 'selected' : ''}>${project.name}${project.masterChief.state === 'live' ? '' : ' (no chief)'}</option>`).join('');
  if (known.has(ui.filter)) select.value = ui.filter;
  $('#cic').innerHTML = ic('send', 14);
  const project = S.projects.find(item => item.id === select.value);
  $('#cmsg').placeholder = project.masterChief.state === 'live' ? `Message ${project.name} Master Chief, e.g. “pause ARK-170 after the current step”` : `${project.name} has no Master Chief. Sending spawns one first.`;
}
function focusComposer(pid, prefill){
  if (known.has(pid)){ $('#cproj').value = pid; ui.chiefProject = pid; syncComposer(); $('#cproj').value = pid; }
  const input = $('#cmsg');
  if (prefill && !input.value) input.value = prefill;
  input.focus();
}
$('#composer').addEventListener('submit', event => {
  event.preventDefault();
  const text = $('#cmsg').value.trim(); if (!text) return;
  const project = S.projects.find(item => item.id === $('#cproj').value);
  ui.chiefProject = project.id;
  if (project.masterChief.state !== 'live') wouldRun(`ark chief spawn --project ${project.id} && orca terminal send --terminal <new-chief> --text "${text}" --enter`);
  else orcaSend(project.masterChief.terminal, text);
  $('#cmsg').value = '';
});
$('#cproj').addEventListener('change', event => { ui.chiefProject = event.target.value; syncComposer(); });

  const term = target ? target.id : chiefTerminal(run.project);
  dialog(`Message ${esc(label)}`, `<textarea id="dm" aria-label="Message" placeholder="What should it do?"></textarea><div class="hint" style="margin-top:6px">${kb(MOD)}${kb('Enter')} sends</div>`,
    [{ label:'Cancel' }, { label:'Send', cls:'primary dlg-primary', run:() => { const text = $('#dm').value.trim() || '…'; closeLayer(); orcaSend(term, text); } }]);
  $('#dm').focus();
}
function abortDialog(run){
  dialog(`Abort ${run.ticket}?`, `<p style="margin:4px 0">The run lead stops after its current step. Work in progress stays on the branch; the ticket returns to <b>ready</b>.</p>`,
    [{ label:'Keep running', focus:true }, { label:'Abort run', cls:'danger solid', run:() => { closeLayer(); ui.aborted[run.id] = true; ui.paused[run.id] = false; const lead = leadOf(run); orcaSend(lead ? lead.id : chiefTerminal(run.project), `Abort ${run.ticket}`); renderAll(); } }]);
}
function escalationDialog(need){
  const lead = leadOf(runFor(need.ticket));
  const choices = [
    ['One more round', 'Grants one extra round to the run lead and keeps the budget for the next.', () => orcaSend(lead.id, `Extra round granted for ${need.ticket}`)],
    ['Take over', 'Jumps to the run lead terminal so you can fix it yourself.', () => orcaSwitch(lead.id)],
    ['Abort run', 'Stops the run. The branch stays.', () => abortDialog(runFor(need.ticket))],
  ];
  dialog(`${need.ticket}: ${esc(need.title)}`, choices.map(([label, text], i) => `<button class="choice" data-act="dlg" data-arg="${i + 1}"><b>${label}${kb(i + 1)}</b><span>${text}</span></button>`).join(''),
    [{ label:'Cancel' }]);
  ui.dlg = [{}, ...choices.map(c => ({ run:() => { closeLayer(); c[2](); } }))];
  ui.dlgChoices = choices.length;
}
function sheet(){
  const group = (title, rows) => `<div><h3>${title}</h3>${rows.map(([text, keys]) => `<div class="k"><span>${text}</span><span>${keys.map(kb).join('')}</span></div>`).join('')}</div>`;
  openLayer(`<div class="scrim" data-act="closeLayer"><div class="dialog sheet" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">Keyboard shortcuts</h2><div class="cols">
    ${group('Anywhere', [['Command palette', [MOD, 'K']], ['This sheet', ['?']], ['Close / go back', ['Escape']], ['Message Master Chief', ['c']], ['Search view', ['/']], ['Toggle theme', ['t']], ['Cycle project filter', ['f']], ['Focus mode: only Needs me', ['z']], ['Dismiss summary', ['d']]])}
    ${group('Lists', [['Move down / up', ['j', 'k']], ['Open selected', ['Enter']], ['Views 1 to 9', ['1', '…', '9']], ['Hover a row', ['preview']]])}
    ${group('Map: linked path and replay', [['Walk nodes', ['j', 'k']], ['Dim unrelated nodes', ['v']], ['Earlier / later event', ['[', ']']], ['Back to live', ['l']], ['Clear selection', ['Escape']]])}
    ${group('Timeline', [['Walk lanes', ['j', 'k']], ['Window 1h / 12h / 24h', ['w']], ['Cost burn lines', ['b']], ['Act on an amber block', ['click']]])}
    ${group('Needs me, by kind', [['Open in Plannotator (gates)', ['p']], ['Decide on escalation', ['e']], ['Open MR / open in Orca', ['o']], ['Answer in Inbox', ['i']], ['Approve and queue', ['a']], ['Answer retro', ['r']]])}
    ${group('Run, agent, ticket', [['Message run lead', ['m']], ['Pause / resume', ['s']], ['Abort (asks first)', ['x']], ['Open in Orca', ['o']], ['Open plan in Plannotator', ['p']], ['Queue ready ticket', ['q']]])}
    </div><div class="foot"><button class="btn" data-act="closeLayer" data-focus>Close${kb('Escape')}</button></div></div></div>`);
  ui.layer = 'dialog'; ui.dlg = [{ run:() => closeLayer() }];
  $('#layer [data-focus]').focus();
}

/* palette */
function paletteItems(){
  const items = [];
  const sel = cur();
  const selLabel = sel ? ({ need:() => (needById(sel.id) || {}).ticket, run:() => (runById(sel.id) || {}).ticket, ticket:() => sel.id, agent:() => (agentById(sel.id) || {}).name, project:() => projectName(sel.id), note:() => 'notification' }[sel.type] || (() => ''))() : '';
  actionsFor(sel).forEach(a => items.push({ group:'Actions', icon:'flash', label:a.label, sub:selLabel || '', hint:a.key, run:a.run }));
  items.push({ group:'Actions', icon:'send', label:'Message Master Chief', sub:'', hint:'c', run:() => focusComposer(ui.chiefProject) });
  items.push({ group:'Actions', icon:'focus', label:ui.focus ? 'Leave focus mode' : 'Focus mode: only Needs me', sub:'', hint:'z', run:toggleFocus });
  S.projects.filter(project => project.masterChief.state !== 'live').forEach(project => items.push({ group:'Actions', icon:'plus', label:`Spawn Master Chief for ${project.name}`, sub:'', run:() => spawnChief(project.id) }));
  items.push({ group:'Actions', icon:ui.theme === 'dark' ? 'sun' : 'moon', label:'Toggle theme', sub:'', hint:'t', run:() => setTheme(ui.theme === 'dark' ? 'light' : 'dark') });
  items.push({ group:'Actions', icon:'help', label:'Show keyboard shortcuts', sub:'', hint:'?', run:sheet });
  items.push({ group:'Actions', icon:'x', label:ui.digest ? 'Dismiss the morning summary' : 'Show the morning summary again', sub:'', hint:'d', run:() => ui.digest ? dismissDigest() : (ui.digest = true, setView('home')) });
  items.push({ group:'Actions', icon:'check', label:'Mark all notifications handled', sub:'', run:handleAll });
  [['all','All projects'],['ark','Ark'],['clara','Clara'],['other','Other']].forEach(([id, label]) => items.push({ group:'Filter', icon:'list', label:`Filter: ${label}`, sub:'', run:() => setFilter(id) }));
  VIEWS.forEach(([id, label, icon], i) => items.push({ group:'Go to', icon, label, sub:'view', hint:String(i + 1), run:() => setView(id) }));
  items.push({ group:'Map', icon:'map', label:ui.dim ? 'Map: show every node at full strength' : 'Map: dim nodes off the selected path', sub:'', hint:'v', run:() => { setView('map'); toggleDim(); } });
  items.push({ group:'Map', icon:'prev', label:'Map replay: step to the earlier event', sub:'', hint:'[', run:() => { setView('map'); stepEvent(-1); } });
  items.push({ group:'Map', icon:'next', label:'Map replay: step to the later event', sub:'', hint:']', run:() => { setView('map'); stepEvent(1); } });
  items.push({ group:'Map', icon:'play', label:'Map replay: back to live', sub:'', hint:'l', run:() => { setView('map'); setReplay(spanMinutes()); } });
  [[1, 'last hour'], [12, 'last 12 hours'], [24, 'last 24 hours']].forEach(([hours, label]) => items.push({ group:'Timeline', icon:'clock', label:`Timeline window: ${label}`, sub:'zoom', hint:ui.view === 'timeline' && ui.tl.hours === hours ? '•' : '', run:() => setZoom(hours) }));
  items.push({ group:'Timeline', icon:'chart', label:ui.tl.burn ? 'Timeline: hide cost burn lines' : 'Timeline: show cost burn lines', sub:'', hint:'b', run:() => { setView('timeline'); toggleBurn(); } });
  S.needsMe.slice().sort((a, b) => mins(b.since) - mins(a.since)).forEach(need => items.push({ group:'Needs me', icon:KIND[need.kind].icon, label:`${need.ticket || need.source} · ${need.title}`, sub:dur(mins(need.since)), run:() => { ui.view = 'home'; ui.sel = {type:'need', id:need.id}; renderAll(); paintCursor(); } }));
  S.runs.forEach(run => items.push({ group:'Runs', icon:'play', label:`${run.ticket} · ${run.title}`, sub:phaseLabel(run), run:() => { ui.view = 'home'; ui.focus = false; ui.sel = {type:'run', id:run.id}; ui.prev = null; renderAll(); paintCursor(); } }));
  S.backlog.forEach(ticket => items.push({ group:'Tickets', icon:'list', label:`${ticket.id} · ${ticket.title}`, sub:words(ticket.status), run:() => { ui.view = 'backlog'; ui.sel = {type:'ticket', id:ticket.id}; renderAll(); paintCursor(); } }));
  S.agents.forEach(agent => items.push({ group:'Agents', icon:'cpu', label:agent.name, sub:agent.state + ' · ' + agent.model, run:() => { ui.view = 'agents'; ui.sel = {type:'agent', id:agent.id}; renderAll(); paintCursor(); } }));
  return items;
}
function openPalette(){
  openLayer(`<div class="scrim" data-act="closeLayer"><div class="palette" role="dialog" aria-modal="true" aria-label="Command palette"><div class="p-in">${ic('search', 17)}<input id="pin" role="combobox" aria-expanded="true" aria-controls="plist" aria-autocomplete="list" placeholder="Jump to a run, ticket, agent or view, or run an action…" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
    <div class="p-list" id="plist" role="listbox" aria-label="Results"></div><div class="p-foot"><span>${kb('↑')}${kb('↓')} move</span><span>${kb('Enter')} run</span><span>${kb('esc')} close</span></div></div></div>`);
  ui.layer = 'palette'; ui.pall = paletteItems(); ui.pi = 0;
  paletteRefresh(); $('#pin').focus();
}
function paletteRefresh(){
  const terms = $('#pin').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  ui.pitems = ui.pall.filter(item => { const hay = `${item.group} ${item.label} ${item.sub}`.toLowerCase(); return terms.every(term => hay.includes(term)); });
  if (terms.length) ui.pitems.sort((a, b) => a.label.toLowerCase().indexOf(terms[0]) - b.label.toLowerCase().indexOf(terms[0]));
  ui.pitems = ui.pitems.slice(0, 40);
  ui.pi = Math.min(ui.pi, Math.max(0, ui.pitems.length - 1));
  let last = '', html = '';
  ui.pitems.forEach((item, i) => {
    if (item.group !== last){ html += `<div class="p-g" role="presentation">${item.group}</div>`; last = item.group; }
    html += `<div class="p-item ${i === ui.pi ? 'active' : ''}" role="option" id="po-${i}" aria-selected="${i === ui.pi}" data-act="pick" data-arg="${i}">${ic(item.icon, 15)}<span class="lb">${esc(item.label)}</span><span class="sb">${esc(item.sub)}</span>${item.hint ? kb(item.hint) : '<span></span>'}</div>`;
  });
  $('#plist').innerHTML = html || '<div class="empty">No matches.</div>';
  $('#pin').setAttribute('aria-activedescendant', ui.pitems.length ? 'po-' + ui.pi : '');
}
function paletteMove(delta){
  if (!ui.pitems.length) return;
  ui.pi = (ui.pi + delta + ui.pitems.length) % ui.pitems.length;
  document.querySelectorAll('.p-item').forEach((el, i) => { el.classList.toggle('active', i === ui.pi); el.setAttribute('aria-selected', i === ui.pi); if (i === ui.pi) el.scrollIntoView({ block:'nearest' }); });
  $('#pin').setAttribute('aria-activedescendant', 'po-' + ui.pi);
}
function palettePick(i){
  const item = ui.pitems[i]; if (!item) return;
  closeLayer(true);
  item.run();
}

/* ---------- misc actions ---------- */
function dismissDigest(){
  const el = $('#brief');
  const done = () => { ui.digest = false; renderAll(); };
  if (el){ el.classList.add('leaving'); setTimeout(done, 160); } else done();
}
function handleAll(){ S.notifications.forEach(n => n.handled = true); toast('Marked all notifications handled', 'Would run: ark notifications ack --all'); renderAll(); }

const ACT = {
  sel:(arg) => { ui.prev = null; select(parseSel(arg)); },
  view:setView,
  setFilter,
  toggleFilter:arg => setFilter(ui.filter === arg ? 'all' : arg),
  need:id => doNeed(needById(id)),
  do:i => { const act = ui.acts[+i]; if (act) act.run(); },
  openRun:id => { ui.view = 'home'; ui.focus = false; ui.prev = null; ui.sel = {type:'run', id}; renderAll(); },
  back,
  orca:term => orcaSwitch(term),
  chiefMsg:pid => focusComposer(pid),
  spawn:spawnChief,
  approve,
  queue:id => { select({type:'ticket', id}); actionsFor(ui.sel)[0].run(); },
  firstGate:() => { const gate = needs().find(n => n.kind === 'gate'); if (!gate) return; if (ui.view !== 'home') setView('home'); ui.prev = null; select({type:'need', id:gate.id}); },
  theme:() => setTheme(ui.theme === 'dark' ? 'light' : 'dark'),
  setTheme,
  focus:toggleFocus,
  palette:openPalette,
  sheet,
  digestX:dismissDigest,
  handleAll,
  closeLayer:(arg, el, event) => { if (event && el.classList.contains('scrim') && event.target !== el) return; closeLayer(); },
  dlg:i => { const b = ui.dlg[+i]; if (b && b.run) b.run(); else closeLayer(); },
  pick:i => palettePick(+i),
  proof:arg => { const [id, status] = arg.split('|'); toast('Would open Plannotator review', `${id} · ${status === 'passing' ? 'test run evidence' : 'failing test output'}`); },
  mockup:arg => { const [ticket, id] = arg.split('|'); toast('Would open Plannotator review', `${ticket} · mockups/${id}.html`); },
  choose:arg => { const [ticket, id, name] = arg.split('|'); wouldRun(`ark gate decide --ticket ${ticket} --gate strategy --choice ${id}  # ${name}`); },
  mr:url => toast('Would open merge request', url),
  dim:toggleDim,
  tick:minutes => setReplay(+minutes),
  stepEvent:direction => stepEvent(+direction),
  live:() => setReplay(spanMinutes()),
  zoom:hours => setZoom(+hours),
  burn:toggleBurn,
  block:openBlock,
};
document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset.arg, el, event);
});
document.addEventListener('change', event => {
  const role = event.target.dataset && event.target.dataset.role;
  if (role){ const [pid, name] = role.split('|'); S.roles[pid][name] = event.target.value; toast('Would write role setting', `~/.ark/projects/${pid}/config.json  roles."${name}" = "${event.target.value}"`); }
  const pref = event.target.dataset && event.target.dataset.pref;
  if (pref){ ui[pref] = event.target.checked; toast('Would save hub setting', `${pref} = ${event.target.checked}`); }
});
document.addEventListener('input', event => {
  if (event.target.id === 'pin'){ ui.pi = 0; paletteRefresh(); }
  if (event.target.id === 'q'){ ui.q = event.target.value; $('#results').innerHTML = resultsHtml(); ui.sel = listFor('search')[0] || null; renderDetail(); paintCursor(); }
  if (event.target.id === 'scrub') setReplay(+event.target.value);
});
document.addEventListener('mouseover', event => {
  const el = event.target.closest && event.target.closest('.p-item');
  if (el && ui.layer === 'palette'){ const i = +el.dataset.arg; if (i !== ui.pi){ ui.pi = i; paletteMove(0); } }
  const peekEl = !ui.layer && event.target.closest && event.target.closest('[data-peek]');
  if (peekEl && !peekEl.contains(event.relatedTarget)) schedulePeek(peekEl);
});
document.addEventListener('mouseout', event => {
  const peekEl = event.target.closest && event.target.closest('[data-peek]');
  if (peekEl && !peekEl.contains(event.relatedTarget)) hidePeek();
});
document.addEventListener('focusin', event => {
  const row = event.target.matches && event.target.matches('.row-main[data-arg]') && event.target;
  if (!row) return;
  const sel = parseSel(row.dataset.arg);
  if (!same(sel, ui.sel)){ ui.prev = null; select(sel); }
  if (row.dataset.peek && row.matches(':focus-visible')) schedulePeek(row);
});
document.addEventListener('focusout', event => { if (event.target.dataset && event.target.dataset.peek) hidePeek(); });
$('#main').addEventListener('scroll', hidePeek, { passive:true });

/* ---------- keyboard ---------- */
const typing = el => el && ((/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== 'range') || el.isContentEditable);
document.addEventListener('keydown', event => {
  const mod = event.metaKey || event.ctrlKey, key = event.key;
  if (mod && key.toLowerCase() === 'k'){ event.preventDefault(); ui.layer === 'palette' ? closeLayer() : openPalette(); return; }
  if (ui.layer === 'palette'){
    if (key === 'Escape'){ event.preventDefault(); closeLayer(); }
    else if (key === 'ArrowDown' || (event.ctrlKey && (key === 'n' || key === 'j'))){ event.preventDefault(); paletteMove(1); }
    else if (key === 'ArrowUp' || (event.ctrlKey && (key === 'p' || key === 'k'))){ event.preventDefault(); paletteMove(-1); }
    else if (key === 'Enter'){ event.preventDefault(); palettePick(ui.pi); }
    else if (key === 'Tab') event.preventDefault();
    return;
  }
  if (ui.layer === 'dialog'){
    if (key === 'Escape'){ event.preventDefault(); closeLayer(); }
    else if (key === 'Enter' && mod){ const primary = $('#layer .dlg-primary'); if (primary){ event.preventDefault(); primary.click(); } }
    else if (/^[1-9]$/.test(key) && ui.dlgChoices && !typing(event.target) && +key <= ui.dlgChoices){ event.preventDefault(); ACT.dlg(+key); }
    else if (key === 'Tab'){ const f = [...document.querySelectorAll('#layer button, #layer textarea')]; if (!f.length) return; const i = f.indexOf(document.activeElement); const next = event.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i + 1) % f.length; event.preventDefault(); f[next].focus(); }
    return;
  }
  hidePeek();
  if (key === 'Escape'){
    if (ui.prev) back();
    else if (typing(event.target)) event.target.blur();
    else if ((ui.view === 'map' || ui.view === 'timeline') && cur()){ setCur(null); paintCursor(); paintFocus(); renderDetail(); }
    return;
  }
  if (typing(event.target) || mod || event.altKey) return;
  if (key === '?'){ event.preventDefault(); sheet(); return; }
  const onSlider = event.target.type === 'range';
  if (key === 'j' || key === 'ArrowDown'){ if (onSlider) return; event.preventDefault(); move(1); return; }
  if (key === 'k' || key === 'ArrowUp'){ if (onSlider) return; event.preventDefault(); move(-1); return; }
  const node = event.target.closest && event.target.closest('.node, .badge-g');
  if ((key === 'Enter' || key === ' ') && node){ event.preventDefault(); node.dispatchEvent(new MouseEvent('click', { bubbles:true })); return; }
  if (key === 'Enter'){
    if (event.target.closest && event.target.closest('.row-main')){ event.preventDefault(); openSelection(); }
    else if (event.target === document.body || event.target.tagName === 'MAIN'){ event.preventDefault(); openSelection(); }
    return;
  }
  if (ui.view === 'map'){
    if (key === 'v'){ toggleDim(); return; }
    if (key === '['){ event.preventDefault(); stepEvent(-1); return; }
    if (key === ']'){ event.preventDefault(); stepEvent(1); return; }
    if (key === 'l'){ event.preventDefault(); setReplay(spanMinutes()); return; }
  }
  if (ui.view === 'timeline'){
    if (key === 'w'){ cycleZoom(); return; }
    if (key === 'b'){ toggleBurn(); return; }
  }
  if (runKey(event)) return;
  if (/^[1-9]$/.test(key)){ event.preventDefault(); setView(VIEWS[+key - 1][0]); return; }
  if (key === '/'){ event.preventDefault(); setView('search'); return; }
  if (key === 'c'){ event.preventDefault(); focusComposer(ui.chiefProject); return; }
  if (key === 't'){ setTheme(ui.theme === 'dark' ? 'light' : 'dark'); return; }
  if (key === 'z'){ toggleFocus(); return; }
  if (key === 'f'){ const order = ['all','ark','clara','other']; setFilter(order[(order.indexOf(ui.filter) + 1) % order.length]); return; }
  if (key === 'd' && ui.digest && ui.view === 'home' && !ui.focus){ dismissDigest(); return; }
});

/* ---------- boot ---------- */
ui.sel = listFor('home')[0] || null;
renderAll();
})();
</script>
</body>
</html>
