name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # `ark preflight` resolves models with OMP's own code (cli/omp-models.ts), so the suite needs OMP installed; pin the version the resolver was written against.
      - run: bun add -g @oh-my-pi/pi-coding-agent@18.12.6
      - run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: omp --version
      - run: bun test
